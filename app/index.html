<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sendit">
<title>Sendit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Night park: dark on purpose, like a session under the park lights. */
:root{
  color-scheme:dark;
  --bg:#06080C; --surface:#10151E; --surface-2:#171F2C; --raise:#1C2636;
  --ink:#EEF3F8; --muted:#8595A9; --line:#222D3E;
  --accent:#FF6B1A; --accent-hot:#FF8A3D; --accent-ink:#160700; --accent-soft:rgba(255,107,26,.14);
  --ice:#5CE1FF; --ice-soft:rgba(92,225,255,.12);
  --good:#3BE08A; --good-soft:rgba(59,224,138,.14); --bad:#FF5470; --bad-soft:rgba(255,84,112,.14);
  --glow:0 0 0 1px rgba(255,107,26,.5),0 0 22px rgba(255,107,26,.35);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.45);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background:
    radial-gradient(70% 45% at 8% -8%, rgba(92,225,255,.16), transparent 70%),
    radial-gradient(60% 40% at 95% -12%, rgba(255,107,26,.18), transparent 70%),
    var(--bg);
  background-attachment:fixed}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
a{color:var(--ice)}

/* falling snow */
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),105vh,0)}}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 0 12px;
  background:linear-gradient(var(--bg) 70%, transparent)}
.brand{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1;
  text-transform:uppercase;font-style:italic;transform:skewX(-6deg)}
.brand span{color:var(--accent);text-shadow:0 0 18px rgba(255,107,26,.7)}
.me-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer}
.me-chip:hover{border-color:var(--accent)}
.me-chip b{font-family:var(--mono);font-size:13px}

h2{font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;letter-spacing:.3px;
  margin:8px 0 2px;line-height:1;text-wrap:balance;font-style:italic}
h3{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;font-style:italic;margin:22px 0 10px;line-height:1}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- rank badges (chunky, game-style) ---------- */
.badge-svg{display:block;flex:none;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.badge-svg.glow-bronze{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(200,116,60,.55))}
.badge-svg.glow-silver{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(200,215,230,.5))}
.badge-svg.glow-gold{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(242,185,30,.6))}
.badge-svg.glow-plat{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(95,224,207,.6))}
.badge-svg.glow-diamond{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(98,168,255,.7))}
.badge-svg.glow-legend{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 20px rgba(255,107,26,.8))}
@media (prefers-reduced-motion:no-preference){
  .badge-svg.float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
}
.rank-word{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.9;
  -webkit-text-stroke:1.5px #0A0D14;paint-order:stroke fill;text-shadow:0 3px 0 #0A0D14}
.t-bronze{color:#F2A36A} .t-silver{color:#E3EAF1} .t-gold{color:#FFD23F}
.t-plat{color:#6FF0DE} .t-diamond{color:#8CC0FF} .t-legend{color:#FF8A3D}

/* rank hero on the Feed */
.hero{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:14px;cursor:pointer;
  background:radial-gradient(120% 120% at 0% 0%, var(--hero-c, rgba(255,107,26,.25)), transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;text-align:left}
.hero .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

/* opening rank reveal */
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(60% 45% at 50% 42%, var(--splash-c), transparent 70%),rgba(4,6,10,.96);cursor:pointer;padding:24px;text-align:center}
.splash .bar{width:min(280px,80vw)}
@media (prefers-reduced-motion:no-preference){
  .splash .badge-svg{animation:slam .7s cubic-bezier(.2,1.6,.4,1) both}
  .splash .rank-word{animation:slam .7s .15s cubic-bezier(.2,1.6,.4,1) both}
  .splash.out{animation:fade .35s ease-in forwards}
  @keyframes slam{from{transform:scale(2.4) rotate(-12deg);opacity:0}}
  @keyframes fade{to{opacity:0;visibility:hidden}}
}

/* tier ladder */
.ladder{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory}
.rung{flex:none;width:92px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.rung.locked .badge-svg{filter:grayscale(1) brightness(.45)}
.rung.here{border-color:var(--accent);box-shadow:var(--glow)}
.rung b{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:15px}

/* cards */
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface) 140px);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:var(--raise);border:1px solid var(--line);flex:none;font-family:var(--mono)}
.avatar.you{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 14px rgba(255,107,26,.5)}
.who{min-width:0;flex:1}
.who .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.who .meta{font-size:12px;color:var(--muted)}
.linkname{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left}
.linkname:hover{color:var(--accent)}
.poster{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(170deg,#12304D,#0A1524)}
.poster::before{content:"";position:absolute;inset:0;background:#DCE8F3;opacity:.9;
  clip-path:polygon(0 72%,38% 52%,62% 58%,100% 30%,100% 100%,0 100%)}
.poster .tname{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:36px;line-height:.95;text-transform:uppercase;color:#0A1524}
.poster .play{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 7px;text-transform:uppercase}
video.clip{display:block;width:100%;aspect-ratio:16/10;background:#000;object-fit:cover}
.card-foot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.trick{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;font-style:italic}
.trick small{font-family:var(--body);font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted);text-transform:none}
.pts{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);text-shadow:0 0 12px rgba(255,107,26,.5)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;border:1px solid}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:rgba(59,224,138,.4)}
.pill.no{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,84,112,.4)}
.pill.wait{background:var(--ice-soft);color:var(--ice);border-color:rgba(92,225,255,.4)}
.pill.totd{background:var(--accent-soft);color:var(--accent-hot);border-color:rgba(255,107,26,.5)}
.pill.sport{background:var(--raise);color:var(--muted);border-color:var(--line)}

/* like / comment bar */
.social{display:flex;align-items:center;gap:6px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--mono)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn.lit{color:var(--accent);border-color:rgba(255,107,26,.6);background:var(--accent-soft)}
.icon-btn.lit svg{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .icon-btn.pop svg{animation:pop .35s ease-out} }
@keyframes pop{40%{transform:scale(1.45) rotate(-8deg)}}
.comments{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.18)}
.comment{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.comment b{font-weight:700;margin-right:4px}
.comment .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:12px 14px;
  font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--accent-hot),var(--accent));color:var(--accent-ink);border-color:transparent;
  box-shadow:0 6px 22px rgba(255,107,26,.35);text-transform:uppercase}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);color:#04160C;border-color:transparent}
.btn.bad{background:var(--bad);color:#1A0207;border-color:transparent}
.btn.small{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus,input:focus{border-color:var(--ice)}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;color:var(--accent);text-shadow:0 0 20px rgba(255,107,26,.55)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;align-self:flex-start}

/* sport switch: big ski / snowboard buttons */
.sport-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sport-switch button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;
  font-family:var(--display);font-weight:900;font-style:italic;font-size:20px;text-transform:uppercase;display:flex;gap:8px;align-items:center;justify-content:center}
.sport-switch button.on{border-color:var(--ice);background:var(--ice-soft);color:var(--ice);box-shadow:0 0 16px rgba(92,225,255,.3)}

/* Trick of the Day hero */
.totd-card{position:relative;border-radius:18px;padding:1.5px;margin-bottom:18px;
  background:linear-gradient(120deg,var(--accent),#C0218A 45%,var(--ice))}
.totd-in{border-radius:16.5px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
  background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.25), transparent 60%),#0B0F16}
.totd-name{font-family:var(--display);font-weight:900;font-style:italic;font-size:40px;line-height:.95;text-transform:uppercase}
.totd-x{grid-row:1 / span 3;grid-column:2;font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;font-style:italic;
  color:var(--accent);text-shadow:0 0 24px rgba(255,107,26,.8)}
.totd-in .btn{grid-column:1 / -1;margin-top:10px}

/* ranks */
.me-card{padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.rank-line{display:flex;align-items:center;gap:14px}
.bar{height:10px;border-radius:5px;background:var(--bg);border:1.5px solid #0A0D14;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#FFB070,var(--accent) 60%,#C84A00);box-shadow:0 0 12px rgba(255,107,26,.7)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;align-items:center;margin-block:12px 10px;flex-wrap:wrap}
.filters select{width:auto;flex:1;min-width:140px;padding:8px 10px}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--line);cursor:pointer}
.board li:hover{background:var(--raise)}
.board li:first-child{border-top:0}
.board li.you{background:var(--accent-soft)}
.board .n{font-family:var(--display);font-weight:900;font-size:22px;font-style:italic;color:var(--muted);text-align:right}
.board li:nth-child(1) .n{color:#FFD35A;text-shadow:0 0 12px rgba(255,211,90,.6)}
.board li:nth-child(2) .n{color:#D6DEE6}
.board li:nth-child(3) .n{color:#E0955A}
.board .score{font-family:var(--mono);font-weight:700;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:26px;font-style:italic;text-transform:uppercase;color:var(--ink)}

/* profile */
.prof-head{display:flex;align-items:center;gap:14px;margin-block:6px 16px}
.prof-head h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-style:italic}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.medals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.medals .card{padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.medals .rank-word{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;padding:0;cursor:pointer}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:15px;line-height:1;text-transform:uppercase;text-align:left;text-shadow:0 1px 6px #000}
.tile em{position:absolute;right:6px;top:5px;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);text-shadow:0 1px 4px #000}
.back{margin-top:6px}

/* ---------- trick book (checklist) ---------- */
.book-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;padding:14px 16px;margin-top:16px}
.book-link .count{font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:1}
.book-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.book-row:first-of-type{border-top:0}
.book-row.done b{color:var(--good)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px}
.check.on{background:var(--good);border-color:#0A0D14;color:#04160C;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.book-cat{padding:10px 14px 4px;display:flex;justify-content:space-between}

.tips{padding:4px 14px 14px 52px;background:rgba(92,225,255,.05);border-top:1px dashed var(--line)}
.tips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tips .label{margin-top:10px;color:var(--ice)}

/* ---------- record ---------- */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:9/14;max-height:62vh;margin-inline:auto;width:100%;border:1px solid var(--line)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-weight:700;
  background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px;font-size:14px}
.cam .timer.live{background:var(--bad);color:#fff}
.cam .controls{position:absolute;left:0;right:0;bottom:16px;display:flex;align-items:center;justify-content:center;gap:28px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--bad);cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.shutter.stop{background:transparent;display:grid;place-items:center}
.shutter.stop::after{content:"";width:28px;height:28px;border-radius:6px;background:var(--bad)}
.cam-side{width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:20px}
.cam-empty{display:grid;place-items:center;gap:14px;text-align:center;padding:24px;height:100%;color:var(--muted)}
.cam-empty .big-cam{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 30px rgba(255,107,26,.5);border:0;cursor:pointer}
.cam-empty .big-cam svg{width:44px;height:44px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}

/* ---------- judge reel (swipe up) ---------- */
.reel{height:calc(100dvh - 196px - env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;margin-inline:-16px;
  scrollbar-width:none;overscroll-behavior:contain}
.reel::-webkit-scrollbar{display:none}
.reel-item{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.reel-item video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.reel-info{position:absolute;left:14px;right:90px;bottom:18px;text-shadow:0 1px 8px #000}
.reel-info .trick{font-size:30px}
.reel-actions{position:absolute;right:12px;bottom:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.round{width:62px;height:62px;border-radius:50%;border:3px solid #0A0D14;cursor:pointer;font-size:26px;font-weight:900;
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.round.yes{background:var(--good);color:#04160C}
.round.no{background:var(--bad);color:#1A0207}
.round.skip{width:46px;height:46px;background:rgba(255,255,255,.14);color:#fff;font-size:18px;border-color:transparent}
.round-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:-10px;text-shadow:0 1px 4px #000}
.reel-reasons{position:absolute;inset:auto 12px 18px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  background:rgba(6,8,12,.9);padding:12px;border-radius:16px;border:1px solid var(--line)}
.reel-reasons .label{grid-column:1 / -1}
.reel-done{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);pointer-events:none;
  font-family:var(--display);font-weight:900;font-style:italic;font-size:44px;text-transform:uppercase}
.reel-end{height:100%;scroll-snap-align:start;display:grid;place-items:center;text-align:center;padding:24px}
.reel-top{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 1px 6px #000}
.modal{position:fixed;inset:0;z-index:40;background:rgba(4,6,10,.8);display:grid;place-items:center;padding:24px}
.modal .card{max-width:360px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px}

/* ---------- duels ---------- */
.duel-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.duel-row:first-child{border-top:0}
.duel-row:hover{background:var(--raise)}
.letters{display:flex;gap:5px}
.letters b{width:30px;height:36px;display:grid;place-items:center;border-radius:8px;font-family:var(--display);font-style:italic;
  font-weight:900;font-size:24px;border:2px dashed var(--line);color:var(--line)}
.letters.small b{width:20px;height:24px;font-size:15px;border-radius:5px;border-width:1.5px}
.letters b.hit{border:2px solid #0A0D14;background:var(--bad);color:#1A0207;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px 14px}
.vs .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vs .side.r{align-items:flex-end}
.vs .mid{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;color:var(--accent);text-shadow:0 0 16px rgba(255,107,26,.6)}
.log{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.log li.hot{border-left-color:var(--accent);color:var(--ink)}
.turn{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.2)}
.turn .what{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px;text-transform:uppercase;line-height:1}
.your-turn{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:3px 9px}
.friend{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.friend:first-child{border-top:0}
.friend .acts{display:flex;gap:6px}

/* ---------- mountain conditions ---------- */
.wx{padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.wx .now{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:1}

/* ---------- achievements ---------- */
.achs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.ach{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.ach .emb{width:54px;height:60px;display:grid;place-items:center;font-size:24px;

.ach.got .emb{background:linear-gradient(160deg,#FFB070,var(--accent) 55%,#9E1170)}

.ach b{font-size:11px;line-height:1.15}
.ach span{font-size:10px;color:var(--muted);line-height:1.2}

/* trick book: category ring + grab chips */
.ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;font-family:var(--mono);
  background:conic-gradient(var(--good) calc(var(--p) * 1%), var(--raise) 0)}
.ring i{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);border:1px solid rgba(59,224,138,.35)}
.chip.next{background:none;color:var(--muted);border:1px dashed var(--line)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,13,19,.85);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabs button{border:0;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(255,107,26,.8))}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tabs button.rec-tab .dot{width:50px;height:50px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--accent-hot),var(--accent));border:3px solid #0A0D14;box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 20px rgba(255,107,26,.5)}
.tabs button.rec-tab svg{stroke:var(--accent-ink);width:24px;height:24px}
.tabs button.rec-tab.on::before{display:none}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--ice);color:#021218;
  font-size:10px;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:#0B0F16;color:var(--ink);border:1px solid var(--accent);box-shadow:var(--glow);
  padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translate(-50%,10px);opacity:.3}}
  .stack > *{animation:enter .35s ease-out both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}}
}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------- connection ----------
// The publishable key is meant to be public. The real security is the rules in
// supabase/001–003 .sql, which the database enforces no matter what this page does.
const SUPABASE_URL = 'https://kyabslzotdtcwtjcygew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sP394lJIxwiubaTzlkwSrg_poXVTb27';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- catalog ----------
const SPORTS = {
  ski:       {label: 'Ski',       icon: '⛷️', cats: ['Park','Rails','Pipe','Moguls','Backcountry'],
              grabs: ['No grab','Mute','Safety','Japan','Tail','Critical']},
  snowboard: {label: 'Snowboard', icon: '🏂', cats: ['Park','Rails','Pipe','Backcountry'],
              grabs: ['No grab','Indy','Melon','Method','Mute','Stalefish','Tail','Nose']},
};
const RESORTS = ['Eldora','Winter Park','Copper','Arapahoe Basin','Breckenridge','Keystone'];
const REASONS = [['fell','Fell'],['wrong_trick','Wrong trick'],['cant_see',"Can't see"]];
const MAX_SECONDS = 20;       // longest recording
const MAX_MB = 50;            // Supabase free plan limit per file
const JUDGE_BREAK = 10;       // suggest a break after this many votes in one sitting
const TIERS = [
  {min:1800,name:'Legend',key:'legend'},{min:1600,name:'Diamond',key:'diamond'},
  {min:1400,name:'Platinum',key:'plat'},{min:1200,name:'Gold',key:'gold'},
  {min:1000,name:'Silver',key:'silver'},{min:0,name:'Bronze',key:'bronze'},
];
// Upward curve: tier n needs 50 × n × (n+1) pts, so each gap is 100 bigger than the last.
// Keep in sync with vote_weight() in supabase/008_rank_curve.sql.
const TRICK_TIERS = [
  {min:1500,name:'Legend',key:'legend',w:2.25},{min:1000,name:'Diamond',key:'diamond',w:2},
  {min:600,name:'Platinum',key:'plat',w:1.75},{min:300,name:'Gold',key:'gold',w:1.5},
  {min:100,name:'Silver',key:'silver',w:1.25},{min:0,name:'Bronze',key:'bronze',w:1},
];
const trickTierOf = p => TRICK_TIERS.find(t => p >= t.min);
const tierOf = r => TIERS.find(t => r >= t.min);
const CLIP_SELECT = '*, profiles!clips_user_id_fkey(username, points), likes(count), comments(count)';
const PROFILE_BITS = 'id, username, points, rating';

// ---------- state ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('sendit-' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('sendit-' + k, v); } catch (e) {} },
};
const S = {
  tab: 'feed', prevTab: 'feed', session: null, me: null,
  tricks: [], clips: [], myVotes: new Set(), myLikes: new Set(), totd: null, wx: null,
  landed: new Map(),        // my Trick Book: trick id -> Set of grabs I've been verified with
  book: null,               // {id, name, landed, sport} while viewing a Trick Book
  friends: [], duels: [], duelId: null, duelMoves: {}, duelSport: null, duelTrick: null, watchMove: null,
  search: {q: '', results: null},
  board: {scope: 'friends', period: 'all', resort: '', rows: []},
  profile: null, openComments: null, comments: {},
  sport: store.get('sport', 'ski'),
  authMode: 'signin', busy: false, postPreset: null, splashDone: false,
  judge: {list: [], voted: {}, reasonFor: null, count: 0, breakShown: false},
  rec: {mode: 'idle', stream: null, recorder: null, chunks: [], blob: null, url: null, facing: 'environment',
        startedAt: 0, tick: null, stopTimer: null, context: null},
};
let seenStatus = null; // my clip id -> status, so we notice when one gets verified

// ---------- helpers ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
const $ = id => document.getElementById(id);
const count = rel => (rel && rel[0] ? rel[0].count : 0);
const myId = () => S.session && S.session.user.id;
const mustOk = r => { if (r.error) throw r.error; return r.data; };
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + 'm';
  const h = Math.round(m / 60); return h < 24 ? h + 'h' : Math.round(h / 24) + 'd';
}
let toastTimer;
function toast(msg, ms = 2800){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const trickById = id => S.tricks.find(t => t.id === id) || {id, name: id, category: '', pts: 0, sport: 'ski'};
const sportOf = t => SPORTS[t.sport] ? t.sport : 'ski';
const tricksFor = (sport, cat) => S.tricks.filter(t => sportOf(t) === sport && (!cat || t.category === cat));
const basePoints = (trickId, grab) => Math.round(trickById(trickId).pts * (grab && grab !== 'No grab' ? 1.2 : 1));
// What a clip would pay you. Mirrors resolve_clip() in supabase/006_grab_points.sql:
// new trick = full points; new grab on a trick you have = just the grab (20% of base); exact repeat = 0.
function payout(trickId, grab){
  const base = trickById(trickId).pts, totd = trickId === S.totd, x = totd ? 2 : 1, grabbed = grab && grab !== 'No grab';
  const grabs = S.landed.get(trickId);
  if (!grabs) return {pts: Math.round(base * (grabbed ? 1.2 : 1) * x),
    why: totd ? '🆕 New trick + 🔥 Trick of the Day: 2×' : grabbed ? '🆕 New trick! Grab adds 20%' : '🆕 New trick! Full points'};
  if (grabbed && !grabs.has(grab)) return {pts: Math.round(base * .2 * x), why: `🆕 New grab! A ${grab} is worth 20% of the trick`};
  if (totd) return {pts: base, why: 'Already landed, but it\'s the Trick of the Day: pays once today'};

const RESORT_GEO = {

const WX_ICON = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️'
  : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
async function loadWeather(){
  const resort = S.me && S.me.home_resort, geo = RESORT_GEO[resort];
  if (!geo){ S.wx = null; return; }
  const key = 'wx-' + resort, cached = store.get(key, null);
  if (cached){ try { const c = JSON.parse(cached); if (Date.now() - c.at < 30 * 60000){ S.wx = c; return; } } catch (e) {} }
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo[0]}&longitude=${geo[1]}` +
      '&current=temperature_2m,wind_speed_10m,weather_code&daily=snowfall_sum,temperature_2m_max,temperature_2m_min,weather_code' +

const TIP_GROUPS = [
  {test: t => /flip|Rodeo|Misty|McTwist|Flair|Cork/i.test(t.name), tips: [
    '⚠ Upside down or off-axis: learn it on a trampoline or airbag first, ideally with a coach.',
    'Never try a new invert on a jump you haven\'t hit many times already.']},
  {test: t => /Switch|Cab/.test(t.name), tips: ['Switch tricks start with riding switch: spend time riding backwards on groomers until it feels normal.']},
  {test: t => t.category === 'Rails', tips: ['Check the feature first: how long it is, and whether it\'s kinked or down.', 'Flat base, centred weight, soft knees. Commit all the way to the end.']},
  {test: t => t.category === 'Pipe', tips: ['Carve up the wall, and pop off the lip toward the sky, not out into the flat bottom.']},
  {test: t => t.category === 'Moguls', tips: ['Keep your upper body quiet and facing downhill. Pop off a bump you can see the landing of.']},
  {test: t => t.category === 'Backcountry', tips: ['Scout the landing from below before you hit it, and ride with a partner and avalanche gear.', 'Pick your takeoff and landing lines, and control your speed before the lip.']},
  {test: t => t.category === 'Park' && /\d{3}/.test(t.name), tips: ['Spot your landing before you open up, and land with your weight centred and your knees soft.']},

function tipsFor(t){
  const out = [...(TIPS[t.id] || [])];
  for (const g of TIP_GROUPS) if (g.test(t)) out.push(...g.tips);
  return out.slice(0, 5);
}

// Minutes until midnight in Denver, when the Trick of the Day changes.
function totdResetsIn(){
  const parts = new Intl.DateTimeFormat('en-US', {timeZone: 'America/Denver', hour: 'numeric', minute: 'numeric', hourCycle: 'h23'})
    .formatToParts(new Date());
  const get = type => Number(parts.find(p => p.type === type).value);
  const left = 24 * 60 - (get('hour') * 60 + get('minute'));
  return `${Math.floor(left / 60)}h ${left % 60}m`;
}

// ---------- ranks: tier + division (I, II, III) ----------
// Each tier is split into three divisions, like game ranks. Legend is the top and has none.
const ROMAN = ['', 'I', 'II', 'III'];
function rankInfo(value, table){
  const t = table.find(x => value >= x.min), i = table.indexOf(t), next = i > 0 ? table[i - 1] : null;
  if (!next) return {tier: t, div: 0, label: t.name, pct: 100, toNext: 0, nextLabel: null};
  const span = next.min - t.min, into = value - t.min;
  const div = Math.min(3, Math.floor(into / span * 3) + 1);
  const divTop = t.min + Math.round(span * div / 3);
  const pct = (into - span * (div - 1) / 3) / (span / 3) * 100;
  return {tier: t, div, label: `${t.name} ${ROMAN[div]}`, pct, toNext: divTop - value,
          nextLabel: div < 3 ? `${t.name} ${ROMAN[div + 1]}` : `${next.name} I`};
}

  }
  return d + 'Z';
}

async function landedTricks(userId){
  const rows = mustOk(await db.from('clips').select('trick_id, grab').eq('user_id', userId).eq('status', 'verified'));

// Toast when one of my clips gets decided while the app is open.
function noticeResults(before){
  const mine = S.clips.filter(c => c.user_id === myId());
  if (seenStatus){
    for (const c of mine){
      if (seenStatus[c.id] !== 'pending' || c.status === 'pending') continue;
      const name = trickById(c.trick_id).name;
      if (c.status === 'verified'){
        const a = rankInfo(before ? before.points : 0, TRICK_TIERS), b = rankInfo(S.me.points, TRICK_TIERS);
        if (a.label !== b.label) showRankUp(b);
        else toast(c.points_awarded ? `✅ Verified! ${name} earned +${c.points_awarded} pts` : `✅ Verified! ${name} (repeat, no new points)`, 4500);
      } else toast(`The community didn't verify your ${name}`, 4500);
    }
  }
  seenStatus = Object.fromEntries(mine.map(c => [c.id, c.status]));
}

      <button class="avatar linkname ${mine ? 'you' : ''}" ${mine ? '' : avStyle(who)} data-act="profile" data-id="${c.user_id}" aria-label="${esc(who)}'s profile">${esc(initials(who))}</button>
      <div class="who"><div class="name"><button class="linkname" data-act="profile" data-id="${c.user_id}">${esc(who)}</button>
        ${c.profiles ? miniBadge(c.profiles.points) : ''}</div>
        <div class="meta">${esc(c.resort || '')} · ${ago(c.created_at)} ago</div></div>
      ${status}
    </div>
    ${media}
    <div class="card-foot">
      <div class="row"><div class="trick">${esc(t.name)} <small>· ${esc(c.grab)} · ${esc(t.category)}</small></div>
        <div class="pts">${shown}</div></div>
      <div class="row" style="justify-content:flex-start;gap:6px">
        <span class="pill sport">${sp.icon} ${sp.label}</span>
        ${c.totd ? '<span class="pill totd">🔥 Trick of the Day · 2×</span>' : ''}</div>
      <div class="row">
        <div class="social">
          <button class="icon-btn ${liked ? 'lit' : ''}" data-act="like" data-id="${c.id}" aria-pressed="${liked}" aria-label="Fire">${ICON.fire}${count(c.likes)}</button>
          <button class="icon-btn ${open ? 'lit' : ''}" data-act="comments" data-id="${c.id}" aria-expanded="${open}" aria-label="Comments">${ICON.chat}${count(c.comments)}</button>
        </div>
        ${mine && c.status === 'pending' ? `<button class="linkish" data-act="delete" data-id="${c.id}">Delete</button>` : ''}
      </div>
    </div>
    ${open ? commentsPanel(c.id) : ''}
  </article>`;
}

function commentsPanel(clipId){
  const list = S.comments[clipId];
  const body = !list ? '<div class="hint">Loading…</div>'
    : !list.length ? '<div class="hint">No comments yet. Say something nice.</div>'
    : list.map(m => `<div class="comment"><div><b>${esc(m.profiles ? m.profiles.username : 'Rider')}</b>${esc(m.body)}
        <span class="hint"> · ${ago(m.created_at)}</span></div>
        ${m.user_id === myId() ? `<button class="x" data-act="delcomment" data-id="${m.id}" data-clip="${clipId}" aria-label="Delete comment">×</button>` : ''}</div>`).join('');
  return `<div class="comments">${body}
    <form class="inline-form comment-form" data-clip="${clipId}">
      <input id="comment-${clipId}" maxlength="280" placeholder="Add a comment" autocomplete="off" aria-label="Comment">
      <button class="btn small primary" type="submit">Send</button>
    </form></div>`;
}

function rankHero(){
  const r = rankInfo(S.me.points, TRICK_TIERS), d = rankInfo(S.me.rating, TIERS);
  return `<button class="hero" data-act="tab" data-tab="ranks" style="--hero-c:${BADGE[r.tier.key][1]}55">
    ${badgeSVG(r.tier.key, 92, r.div, {glow: true, float: true})}
    <div class="grow">
      <div class="label">Trick rank</div>
      ${rankWord(r, 38)}
      <div class="bar"><i style="width:${Math.max(4, r.pct)}%"></i></div>
      <div class="hint">${r.nextLabel ? `<b class="mono" style="color:var(--ink)">${r.toNext}</b> pts to ${esc(r.nextLabel)}` : 'Top rank. Legend.'}
        · Duels: ${esc(d.label)}</div>
    </div>
  </button>`;
}

function totdCard(){
  if (!S.totd) return '';
  const t = trickById(S.totd), sp = SPORTS[sportOf(t)];
  return `<section class="totd-card"><div class="totd-in">
    <div class="label" style="color:var(--accent-hot)">Trick of the Day · resets in ${totdResetsIn()}</div>
    <div class="totd-name">${esc(t.name)}</div>
    <div class="hint">${sp.icon} ${sp.label} · ${esc(t.category)} · worth <b class="mono" style="color:var(--ink)">${t.pts * 2}</b> pts today instead of ${t.pts}</div>
    <div class="totd-x">2×</div>
    <button class="btn primary" data-act="totdpost">Record your ${esc(t.name)}</button>
  </div></section>`;
}

function rankCard(title, value, table, unit, extra){
  const r = rankInfo(value, table);
  return `<section class="card me-card" style="background:radial-gradient(120% 100% at 0% 0%, ${BADGE[r.tier.key][1]}40, transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface))">
    <div class="row"><div class="label">${title}</div><span class="hint">${extra}</span></div>
    <div class="rank-line">${badgeSVG(r.tier.key, 84, r.div, {glow: true})}
      <div>${rankWord(r, 36)}<div class="mono hint" style="margin-top:6px">${value} ${unit}</div></div></div>
    <div class="bar"><i style="width:${Math.max(4, r.pct)}%"></i></div>
    <div class="hint">${r.nextLabel ? `${r.toNext} ${unit} to ${esc(r.nextLabel)}` : 'Top rank'}</div>
  </section>`;
}

function ladder(value, table){
  const here = table.find(x => value >= x.min);
  return `<div class="ladder">${[...table].reverse().map(t => `
    <div class="rung ${value < t.min ? 'locked' : ''} ${t === here ? 'here' : ''}">
      ${badgeSVG(t.key, 54, 0)}<b class="t-${t.key}">${t.name}</b><span class="hint mono">${t.min}+</span></div>`).join('')}</div>`;
}


// ---------- HUD pieces: compact tiles on phones, a right-hand rail on big screens ----------
const WIDE = matchMedia('(min-width: 1000px)');
WIDE.addEventListener('change', () => { if (S.me) render(true); });

function hudTiles(){
  const r = rankInfo(S.me.points, TRICK_TIERS);
  const rank = `<button class="card htile frame" data-act="tab" data-tab="ranks">
    <div class="label">Trick rank</div>
    <div class="row1">${badgeSVG(r.tier.key, 44, r.div, {glow: true})}${rankWord(r, 26)}</div>
    <div class="bar"><i style="width:${Math.max(4, r.pct)}%"></i></div>
    <div class="readout">${r.nextLabel ? `${r.toNext} PTS → ${esc(r.nextLabel).toUpperCase()}` : 'TOP RANK'}</div></button>`;
  let wx;
  if (!S.me.home_resort) wx = `<button class="card htile" data-act="tab" data-tab="ranks"><div class="label">Conditions</div>
    <div style="font-size:26px">🏔️</div><div class="hint">Set your home mountain on Ranks</div></button>`;
  else if (!S.wx || S.wx.resort !== S.me.home_resort) wx = `<div class="card htile"><div class="label">${esc(S.me.home_resort)}</div><div class="hint">Loading conditions…</div></div>`;
  else {
    const W = S.wx, d = W.daily, fresh = (d.snowfall_sum[0] || 0) + (d.snowfall_sum[1] || 0);
    const day = i => new Date(d.time[i] + 'T12:00').toLocaleDateString('en-US', {weekday: 'narrow'});
    wx = `<div class="card htile"><div class="label">${esc(W.resort)}</div>
      <div class="row1"><span class="temp">${WX_ICON(W.current.weather_code)} ${Math.round(W.current.temperature_2m)}°</span></div>
      <div class="snowline">${fresh >= 0.1 ? fresh.toFixed(1) : '0'}″ <span class="hint" style="font-family:var(--body);font-style:normal;font-size:11px">new snow</span></div>
      <div class="minidays">${[2, 3, 4].map(i => `<span>${day(i)}<b>${WX_ICON(d.weather_code[i])}</b></span>`).join('')}</div></div>`;
  }
  return `<div class="hud2">${rank}${wx}</div>`;
}

function totdStrip(){
  if (!S.totd) return '';
  const t = trickById(S.totd);
  return `<div class="totd-strip"><span class="x">2×</span>
    <div><div class="label" style="color:var(--accent-hot)">Trick of the Day · ${totdResetsIn()}</div><div class="nm">${esc(t.name)}</div></div>
    <button class="btn primary" data-act="totdpost">Record</button></div>`;
}

function miniBoard(){
  const rows = (S.board.rows || []).slice(0, 6);
  if (!rows.length) return '<div class="hint" style="margin-top:6px">Add friends in Duels to see them here.</div>';
  return `<ol class="mini-board">${rows.map((u, i) => `<li class="${u.id === myId() ? 'you' : ''}" data-act="profile" data-id="${u.id}">
    <span class="mono hint">${i + 1}</span>${badgeSVG(trickTierOf(u.points).key, 22)}<b>${esc(u.username)}</b><span class="mono">${u.score}</span></li>`).join('')}</ol>`;
}

function renderRail(){
  const rail = $('rail');
  if (!WIDE.matches || !S.me){ rail.innerHTML = ''; return; }
  const myTurn = S.duels.filter(d => d.status === 'active' && d.turn === myId());
  const requests = S.friends.filter(f => f.status === 'pending' && f.incoming);
  const toJudge = judgeQueue().length;
  rail.innerHTML = `${rankHero()}${wxCard()}${totdCard()}
    <section class="card frame"><div class="row"><div class="label">Friends board</div>
      <button class="linkish" data-act="tab" data-tab="ranks">See all</button></div>${miniBoard()}</section>
    <section class="card"><div class="label">Needs you</div>
      ${myTurn.map(d => `<button class="alert" data-act="open-duel" data-id="${d.id}"><span class="your-turn">Your turn</span> vs <b>${esc(d.other.username)}</b></button>`).join('')}
      ${requests.map(f => `<button class="alert" data-act="tab" data-tab="duels">👋 <b>${esc(f.other.username)}</b> wants to be friends</button>`).join('')}
      ${toJudge ? `<button class="alert" data-act="tab" data-tab="judge">⚖️ <b>${toJudge}</b> clip${toJudge > 1 ? 's' : ''} waiting for your vote</button>` : ''}
      ${!myTurn.length && !requests.length && !toJudge ? '<div class="hint" style="margin-top:6px">All caught up. Go ride.</div>' : ''}
    </section>`;
}

// ---------- views ----------
const views = {
  auth(){
    const up = S.authMode === 'signup';
    return `<h2>${up ? 'Join Sendit' : 'Drop in'}</h2>
      <p class="sub">${up ? 'Film a trick, get it verified by other riders, and rank up from Bronze to Legend.'
                          : 'Sign in to record, judge, duel and climb the leaderboard.'}</p>

        <div class="field"><label class="label" for="auth-email">Email</label>
          <input id="auth-email" type="email" autocomplete="email" required></div>
        <div class="field"><label class="label" for="auth-pass">Password</label>

          ${up ? '<span class="hint">At least 8 characters.</span>' : ''}</div>

    const top = WIDE.matches ? '' : hudTiles() + totdStrip();

      <div class="stack">${clips.length ? clips.map(clipCard).join('')
        : `<div class="card empty"><strong>No clips yet</strong>Verified tricks show up here. Be the first.</div>`}</div>`;
  },

  judge(){

    if (!J.list.length) return `<h2>Judge</h2>

    return `<div class="reel" id="reel">${J.list.map(reelItem).join('')}
      <div class="reel-end"><div><div class="rank-word t-gold" style="font-size:44px">All caught up</div>

    </div>
    <p class="hint" style="text-align:center;margin-top:8px">Swipe up for the next clip · your vote counts ×${w.w} · riders stay anonymous</p>`;
  },

  record(){
    const R = S.rec, ctx = R.context;
    const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    const title = ctx ? (ctx.kind === 'set' ? 'Duel: set your trick' : 'Duel: match it') : 'Record';
    const ctxLine = ctx ? `<p class="sub">${ctx.kind === 'set' ? 'Setting' : 'Matching'} <b style="color:var(--ink)">${esc(trickById(ctx.trickId).name)}</b> vs ${esc(ctx.otherName)}. Land it on camera.</p>`
                        : `<p class="sub">Clips are filmed in the app, so nobody can post old or downloaded videos.</p>`;
    let body;
    if (!canRecord) body = `<div class="cam"><div class="cam-empty"><div>
        <strong class="rank-word t-silver" style="font-size:28px">Camera not available</strong>
        <p>This browser can't record here. The camera needs the app to be opened over a secure (https) link. That comes when Sendit goes online.</p></div></div></div>`;
    else if (R.mode === 'review') body = `<div class="cam"><video src="${R.url}" controls playsinline loop autoplay muted></video></div>
      ${ctx ? duelReviewForm(ctx) : postForm()}`;
    else if (R.mode === 'live' || R.mode === 'recording') body = `<div class="cam">
        <video id="rec-live" autoplay muted playsinline></video>
        <div class="timer ${R.mode === 'recording' ? 'live' : ''}" id="rec-timer">${R.mode === 'recording' ? '● 0.0s' : `max ${MAX_SECONDS}s`}</div>
        <div class="controls">
          <button class="cam-side" data-act="cam-close" aria-label="Close camera">✕</button>
          <button class="shutter ${R.mode === 'recording' ? 'stop' : ''}" data-act="${R.mode === 'recording' ? 'rec-stop' : 'rec-start'}" aria-label="Record or stop"></button>
          <button class="cam-side" data-act="cam-flip" aria-label="Flip camera">⟲</button>
        </div></div>`;
    else body = `${ctx ? '' : sportSwitch(S.sport, 'sport') + '<div style="height:12px"></div>'}

      ${ctx ? '<button class="linkish" data-act="rec-cancel" style="margin-top:12px">Cancel duel attempt</button>' : ''}`;
    return `<h2>${title}</h2>${ctxLine}${body}`;
  },

  duels(){
    if (S.duelId) return duelDetail();
    const mine = S.duels.filter(d => d.status === 'active');
    const done = S.duels.filter(d => d.status === 'done').slice(0, 5);
    const incoming = S.friends.filter(f => f.status === 'pending' && f.incoming);
    const sent = S.friends.filter(f => f.status === 'pending' && !f.incoming);
    const friends = acceptedFriends();
    const results = S.search.results;
    return `<h2>Duels</h2><p class="sub">Game of S.K.I.: land a trick and your friend has to match it. Miss and you take a letter. Spell S-K-I and you lose rating.</p>

    <div class="card">${mine.length ? mine.map(d => {
        const myL = d.challenger === myId() ? d.letters_challenger : d.letters_opponent;
        const theirL = d.challenger === myId() ? d.letters_opponent : d.letters_challenger;
        return `<button class="duel-row" data-act="open-duel" data-id="${d.id}">
          <div class="avatar" ${avStyle(d.other.username)}>${esc(initials(d.other.username))}</div>
          <div><b>vs ${esc(d.other.username)}</b><div class="hint" style="display:flex;gap:10px;align-items:center;margin-top:4px">
            You ${lettersHtml(myL, true)} Them ${lettersHtml(theirL, true)}</div></div>
          ${d.turn === myId() ? '<span class="your-turn">Your turn</span>' : '<span class="hint">Their turn</span>'}</button>`;
      }).join('') : `<div class="empty"><strong>No duels yet</strong>Challenge a friend below.</div>`}</div>

    <h3>Friends</h3>
    <button class="btn small" style="margin-bottom:10px" data-act="invite">📨 Invite friends to Sendit</button>
    <form class="inline-form" id="friend-search">
      <input id="friend-q" placeholder="Find riders by username" value="${esc(S.search.q)}" autocomplete="off" aria-label="Search usernames">
      <button class="btn small" type="submit">Search</button></form>
    ${results ? `<div class="card" style="margin-top:10px">${results.length ? results.map(p => friendRow(p, 'search')).join('')
        : '<div class="empty" style="padding:16px">Nobody by that name yet.</div>'}</div>` : ''}
    ${incoming.length ? `<div class="label" style="margin:16px 0 8px">Requests</div>
      <div class="card">${incoming.map(f => friendRow(f.other, 'incoming')).join('')}</div>` : ''}
    <div class="label" style="margin:16px 0 8px">Your crew · ${friends.length}</div>
    <div class="card">${friends.length ? friends.map(f => friendRow(f.other, 'friend')).join('')
      : '<div class="empty" style="padding:18px">Search for your friends above to add them.</div>'}</div>
    ${sent.length ? `<p class="hint" style="margin-top:8px">Waiting on: ${sent.map(f => esc(f.other.username)).join(', ')}</p>` : ''}

    ${done.length ? `<h3>Recent duels</h3><div class="card"><ul class="board">${done.map(d => {
        const won = d.winner === myId();
        return `<li data-act="open-duel" data-id="${d.id}"><span class="n">${won ? 'W' : 'L'}</span>
          <div class="avatar" ${avStyle(d.other.username)}>${esc(initials(d.other.username))}</div>
          <div><b>${esc(d.other.username)}</b><div class="hint">${won ? 'You won' : 'You lost'}</div></div>
          <span class="score" style="color:var(--${won ? 'good' : 'bad'})">${won ? '+' : '−'}${d.rating_change || 0}</span></li>`;
      }).join('')}</ul></div>` : ''}`;
  },

  ranks(){
    const me = S.me, b = S.board;
    const verified = S.clips.filter(c => c.user_id === me.id && c.status === 'verified').length;
    const doneDuels = S.duels.filter(d => d.status === 'done'), wins = doneDuels.filter(d => d.winner === me.id).length;
    return `<h2>Ranks</h2><p class="sub">Every verified trick adds points. Each tier has three divisions: fill the bar to earn the next star.</p>
    <div class="stack">
      ${rankCard('Trick rank', me.points, TRICK_TIERS, 'pts', `${verified} verified`)}
      ${rankCard('Duel rank', me.rating, TIERS, 'rating', `${wins}W · ${doneDuels.length - wins}L`)}
    </div>
    <button class="card book-link" data-act="book" data-id="${me.id}" data-name="${esc(me.username)}">
      <span style="font-size:30px">📖</span>
      <div style="flex:1"><div class="label">Trick Book</div><div class="hint">Your checklist of every trick and the grabs you've done on each.</div></div>
      <span class="count t-gold rank-word">${S.landed.size}/${S.tricks.length}</span></button>
    <h3>The road to Legend</h3>
    ${ladder(me.points, TRICK_TIERS)}
    <h3>Leaderboard</h3>
    <div class="filters">
      <div class="seg" role="group" aria-label="Who">
        <button class="${b.scope === 'friends' ? 'on' : ''}" data-act="scope" data-k="friends">Friends</button>
        <button class="${b.scope === 'global' ? 'on' : ''}" data-act="scope" data-k="global">Everyone</button></div>
      <div class="seg" role="group" aria-label="Time period">
        <button class="${b.period === 'all' ? 'on' : ''}" data-act="period" data-k="all">All time</button>
        <button class="${b.period === 'week' ? 'on' : ''}" data-act="period" data-k="week">Week</button></div>
      <select id="board-resort" aria-label="Home mountain">
        <option value="">All mountains</option>${RESORTS.map(r => `<option ${b.resort === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
    </div>
    <div class="card">${b.rows.length ? `<ol class="board">${b.rows.map((u, i) => `
      <li class="${u.id === me.id ? 'you' : ''}" data-act="profile" data-id="${u.id}"><span class="n">${i + 1}</span>
        ${badgeSVG(trickTierOf(u.points).key, 34)}
        <div><b>${esc(u.username)}</b><div class="hint">${esc(rankInfo(u.points, TRICK_TIERS).label)}${u.home_resort ? ' · ' + esc(u.home_resort) : ''}</div></div>
        <span class="score">${u.score} <small class="hint">pts</small></span></li>`).join('')}</ol>`
      : `<div class="empty"><strong>Nobody yet</strong>${b.scope === 'friends' ? 'Add friends in the Duels tab.' : 'Be the first on the board.'}</div>`}</div>
    <section class="card form" style="margin-top:20px">
      <div class="label">Your profile</div>
      <div class="hint">Signed in as <b>${esc(me.username)}</b> · ${esc(S.session.user.email)}</div>
      <div class="field"><label class="label" for="home-resort">Home mountain</label>
        <select id="home-resort"><option value="">Not set</option>${RESORTS.map(r =>
          `<option ${me.home_resort === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="btns"><button class="btn" data-act="profile" data-id="${me.id}">View my page</button>
        <button class="btn" data-act="signout">Sign out</button></div>
    </section>`;
  },

  book(){
    const B = S.book;
    if (!B) return '<p class="sub">Loading…</p>';
    const mine = B.id === myId(), all = tricksFor(B.sport);
    const done = all.filter(t => B.landed.has(t.id));
    const banked = done.reduce((n, t) => n + t.pts, 0);
    return `<button class="linkish back" data-act="book-back">← Back</button>
    <h2>${mine ? 'Your' : esc(B.name) + '’s'} Trick Book</h2>
    <p class="sub">A trick pays full points the first time it's verified, and each new grab on it adds a little more. Tick them all off to climb.</p>
    ${sportSwitch(B.sport, 'book-sport')}
    <section class="card me-card" style="margin-top:14px">
      <div class="row"><span class="rank-word t-gold" style="font-size:40px">${done.length} / ${all.length}</span>
        <span class="hint">${SPORTS[B.sport].label} tricks landed</span></div>
      <div class="bar"><i style="width:${Math.max(3, done.length / all.length * 100)}%"></i></div>

      const list = tricksFor(B.sport, cat); if (!list.length) return '';

  reelObserver = new IntersectionObserver(entries => {

      if (e.isIntersecting && e.intersectionRatio > .6) v.play().catch(() => {}); else v.pause();

  reel.querySelectorAll('.reel-item').forEach(el => reelObserver.observe(el));

// ---------- recording ----------
function pickMime(){
  const options = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return options.find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function openCamera(){
  const R = S.rec;
  try {
    stopStream();
    R.stream = await navigator.mediaDevices.getUserMedia({
      // 60 fps when the phone allows it: twice the frames means the trick AI loses the rider less.
      // Phones that can't do 60 quietly fall back to 30.
      video: {facingMode: {ideal: R.facing}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 60}}, audio: false});
    R.mode = 'live'; render(true);
  } catch (err){
    toast(err.name === 'NotAllowedError' ? 'Camera blocked. Allow camera access in your browser settings.' : 'Camera error: ' + err.message, 5000);
  }
}
function attachStream(){ const v = $('rec-live'); if (v && S.rec.stream){ v.srcObject = S.rec.stream; v.play().catch(() => {}); } }
function stopStream(){ const R = S.rec; if (R.stream){ R.stream.getTracks().forEach(t => t.stop()); R.stream = null; } }
function startRecording(){
  const R = S.rec, mime = pickMime();
  if (!R.stream) return;
  R.chunks = [];
  R.recorder = new MediaRecorder(R.stream, mime ? {mimeType: mime, videoBitsPerSecond: 1800000} : undefined);
  R.recorder.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.recorder.onstop = () => {
    const type = (R.recorder.mimeType || mime || 'video/webm').split(';')[0];
    R.blob = new Blob(R.chunks, {type});
    if (R.url) URL.revokeObjectURL(R.url);
    R.url = URL.createObjectURL(R.blob);
    clearInterval(R.tick); clearTimeout(R.stopTimer);
    stopStream(); R.mode = 'review'; render(true);
  };
  R.recorder.start(250);
  R.startedAt = Date.now(); R.mode = 'recording';
  // Update just the button and timer, so the live preview keeps running
  const shutter = document.querySelector('.shutter'); shutter.classList.add('stop'); shutter.dataset.act = 'rec-stop';
  const timer = $('rec-timer'); timer.classList.add('live');
  R.tick = setInterval(() => { timer.textContent = `● ${((Date.now() - R.startedAt) / 1000).toFixed(1)}s / ${MAX_SECONDS}s`; }, 100);
  R.stopTimer = setTimeout(() => { if (R.recorder && R.recorder.state === 'recording') R.recorder.stop(); }, MAX_SECONDS * 1000);
}
function resetRecorder(keepContext){
  const R = S.rec;
  if (R.recorder && R.recorder.state === 'recording'){ R.recorder.onstop = null; R.recorder.stop(); }
  clearInterval(R.tick); clearTimeout(R.stopTimer); stopStream();
  if (R.url) URL.revokeObjectURL(R.url);
  Object.assign(R, {mode: 'idle', recorder: null, chunks: [], blob: null, url: null});
  if (!keepContext) R.context = null;
}

// ---------- offline outbox ----------
// No signal on the hill? Clips wait on the phone (in IndexedDB, the browser's own storage)
// and upload by themselves when the connection comes back.
const outbox = {
  _db: null,
  open(){
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('sendit', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('outbox', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async run(mode, fn){
    const dbh = await this.open();
    return new Promise((res, rej) => {
      const tx = dbh.transaction('outbox', mode), req = fn(tx.objectStore('outbox'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  },
  add(item){ return this.run('readwrite', s => s.put(item)); },
  all(){ return this.run('readonly', s => s.getAll()); },
  remove(id){ return this.run('readwrite', s => s.delete(id)); },
};
const looksOffline = err => !navigator.onLine || /fetch|network|load failed|timed? ?out/i.test(String(err && err.message));
async function queueClip(item){
  await outbox.add({id: crypto.randomUUID(), recordedAt: new Date().toISOString(), ...item});
  await updateOutboxChip();
}
async function updateOutboxChip(){
  let n = 0; try { n = (await outbox.all()).length; } catch (e) {}
  const chip = $('outbox-chip'); if (!chip) return;
  chip.hidden = !n || !S.me; chip.textContent = `📤 ${n} waiting`;
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !navigator.onLine || !S.me) return;
  flushing = true;
  let sent = 0;
  try {
    for (const it of await outbox.all()){
      try {
        const clipId = await uploadClip(it.fields, it.blob);
        if (it.kind === 'duel') await duelMove(it.duelId, true, it.trick, clipId);
        await outbox.remove(it.id); sent++;
      } catch (err){
        if (looksOffline(err)) break;                 // still no signal: try again later
        await outbox.remove(it.id);                   // a real error (e.g. duel moved on): don't retry forever
        toast(`Couldn't upload a saved clip: ${err.message}`, 5000);
      }
    }
  } catch (e) { /* storage unavailable (private browsing) */ }
  flushing = false;
  await updateOutboxChip();
  if (sent){ toast(`📤 Uploaded ${sent} saved clip${sent > 1 ? 's' : ''}`); await refresh(); }
}
window.addEventListener('online', () => flushOutbox());

// Upload the recorded video and create the clip. Returns the new clip's id.
async function uploadClip(fields, blob = S.rec.blob){
  if (!blob || !blob.size) throw new Error('Nothing recorded');
  if (blob.size > MAX_MB * 1024 * 1024) throw new Error(`Video is over ${MAX_MB} MB. Record a shorter clip.`);
  const type = blob.type || 'video/webm';
  const ext = type.includes('mp4') ? 'mp4' : type.includes('quicktime') ? 'mov' : 'webm';
  const path = `${myId()}/${crypto.randomUUID()}.${ext}`;  // must start with my user id (storage rule)
  const up = await db.storage.from('clips').upload(path, blob, {contentType: type});
  if (up.error) throw up.error;
  const ins = await db.from('clips').insert({...fields, video_path: path}).select('id').single();
  if (ins.error){ await db.storage.from('clips').remove([path]); throw ins.error; }
  return ins.data.id;
}

const TABS = [
  ['feed','Feed','<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ['judge','Judge','<path d="M5 12l4 4L19 6"/>'],
  ['record','Record','<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor"/>'],
  ['duels','Duels','<path d="M5 19L19 5M14 5h5v5M5 5l5 5M14 14l5 5"/>'],
  ['ranks','Ranks','<path d="M4 20h16M7 20V11M12 20V5M17 20v-6"/>'],
];
const judgeQueue = () => S.clips.filter(c => c.status === 'pending' && c.user_id !== myId() && !S.myVotes.has(c.id));
const KEEP = ['board-resort', 'friend-q'];  // keep what's typed/picked across redraws

function render(force = false){
  const signedIn = !!(S.session && S.me);
  $('tabbar').hidden = !signedIn; $('me-chip').hidden = !signedIn;
  if (!signedIn){ $('view').innerHTML = views.auth(); $('rail').innerHTML = ''; return; }
  const r = rankInfo(S.me.points, TRICK_TIERS);
  $('me-chip').innerHTML = `${badgeSVG(r.tier.key, 26)}<b>${S.me.points}</b>`;
  const judgeCount = judgeQueue().length;
  const duelCount = S.duels.filter(d => d.status === 'active' && d.turn === myId()).length
    + S.friends.filter(f => f.status === 'pending' && f.incoming).length;
  $('tabs').innerHTML = TABS.map(([id, label, icon]) => {
    const badge = id === 'judge' ? judgeCount : id === 'duels' ? duelCount : 0;
    if (id === 'record') return `<button class="rec-tab ${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="record" aria-label="Record">
      <span class="dot"><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg></span>${label}</button>`;
    return `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}" aria-label="${label}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  }).join('');
  // Don't rebuild screens that are mid-use: the reel, the camera, or the post form
  if (!force && ((S.tab === 'judge' && $('reel')) || (S.tab === 'record' && S.rec.mode !== 'idle'))){ renderRail(); return; }
  const keep = {}; KEEP.forEach(id => { const el = $(id); if (el) keep[id] = el.value; });
  $('view').innerHTML = views[S.tab]();
  for (const [id, v] of Object.entries(keep)){ const el = $(id); if (el) el.value = v; }
  syncPost();
  renderRail();
  if (S.tab === 'judge') watchReel();
  if (S.tab === 'record' && (S.rec.mode === 'live' || S.rec.mode === 'recording')) attachStream();
}

function showSplash(){
  if (S.splashDone) return;
  S.splashDone = true;
  const r = rankInfo(S.me.points, TRICK_TIERS);
  $('overlay').innerHTML = `<div class="splash" id="splash" data-act="close-splash" style="--splash-c:${BADGE[r.tier.key][1]}66">
    ${badgeSVG(r.tier.key, 190, r.div, {glow: true})}
    <div class="label">Your rank</div>
    ${rankWord(r, 64)}
    <div class="mono" style="font-weight:700">${S.me.points} pts${r.nextLabel ? ` · ${r.toNext} to ${esc(r.nextLabel)}` : ''}</div>
    <div class="bar"><i style="width:${Math.max(4, r.pct)}%"></i></div>
    <div class="hint" style="margin-top:14px">Tap to drop in</div>
  </div>`;
  setTimeout(closeSplash, 2800);
}
// A short, calm celebration when you move up a rank or division.
function showRankUp(r){
  $('overlay').innerHTML = `<div class="splash" id="splash" data-act="close-splash" style="--splash-c:${BADGE[r.tier.key][1]}66">
    <div class="label" style="color:var(--accent-hot)">Rank up</div>

function closeSplash(){
