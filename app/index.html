<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stomped">
<title>Stomped · the trick app for skiers & snowboarders</title>
<meta name="description" content="Film a trick in the app. Other riders judge it, anonymously. Verified tricks earn points and move you up from Bronze to Legend.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stomped">
<meta property="og:title" content="Stomped · Land it. Prove it.">
<meta property="og:description" content="The trick app for skiers & snowboarders. Film it, riders verify it, rank up from Bronze to Legend.">
<meta property="og:image" content="https://connorusingai.github.io/sendit/app/icons/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Night park: dark on purpose, like a session under the park lights. */
:root{
  color-scheme:dark;
  --bg:#06080C; --surface:#10151E; --surface-2:#171F2C; --raise:#1C2636;
  --ink:#EEF3F8; --muted:#8595A9; --line:#222D3E;
  --accent:#FF6B1A; --accent-hot:#FF8A3D; --accent-ink:#160700; --accent-soft:rgba(255,107,26,.14);
  --ice:#c9d0de; --ice-soft:rgba(201,208,222,.12);
  --good:#3BE08A; --good-soft:rgba(59,224,138,.14); --bad:#FF5470; --bad-soft:rgba(255,84,112,.14);
  --glow:0 0 0 1px rgba(255,107,26,.5),0 0 22px rgba(255,107,26,.35);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.45);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background:
    radial-gradient(70% 45% at 8% -8%, rgba(201,208,222,.16), transparent 70%),
    radial-gradient(60% 40% at 95% -12%, rgba(255,107,26,.18), transparent 70%),
    var(--bg);
  background-attachment:fixed}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
::selection{background:rgba(255,107,26,.35);color:#fff}
input,textarea{caret-color:var(--accent)}
a{color:var(--ice)}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* falling snow */
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),105vh,0)}}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 0 12px;
  background:linear-gradient(var(--bg) 70%, transparent)}
.brand{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1;
  text-transform:uppercase;font-style:italic;transform:skewX(-6deg)}
.brand span{color:var(--accent);text-shadow:0 0 18px rgba(255,107,26,.7)}
.me-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer}
.me-chip:hover{border-color:var(--accent)}
#acct-chip{padding:6px;justify-content:center;font-size:17px}
.me-chip b{font-family:var(--mono);font-size:13px}

h2{font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;letter-spacing:.3px;
  margin:8px 0 2px;line-height:1;text-wrap:balance;font-style:italic}
h3{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;font-style:italic;margin:22px 0 10px;line-height:1}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- rank badges (chunky, game-style) ---------- */
.badge-svg{display:block;flex:none;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.badge-svg.glow-bronze{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(200,116,60,.55))}
.badge-svg.glow-silver{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(200,215,230,.5))}
.badge-svg.glow-gold{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(242,185,30,.6))}
.badge-svg.glow-plat{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(95,224,207,.6))}
.badge-svg.glow-diamond{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(98,168,255,.7))}
.badge-svg.glow-legend{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 20px rgba(255,107,26,.8))}
@media (prefers-reduced-motion:no-preference){
  .badge-svg.float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
}
.rank-word{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.9;
  -webkit-text-stroke:1.5px #0A0D14;paint-order:stroke fill;text-shadow:0 3px 0 #0A0D14}
.t-bronze{color:#F2A36A} .t-silver{color:#E3EAF1} .t-gold{color:#FFD23F}
.t-plat{color:#6FF0DE} .t-diamond{color:#8CC0FF} .t-legend{color:#FF8A3D}

/* rank hero on the Feed */
.hero{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:14px;cursor:pointer;
  background:radial-gradient(120% 120% at 0% 0%, var(--hero-c, rgba(255,107,26,.25)), transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;text-align:left}
.hero .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

/* opening rank reveal */
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(60% 45% at 50% 42%, var(--splash-c), transparent 70%),rgba(4,6,10,.96);cursor:pointer;padding:24px;text-align:center}
.splash .bar{width:min(280px,80vw)}
@media (prefers-reduced-motion:no-preference){
  .splash .badge-svg{animation:slam .7s cubic-bezier(.2,1.6,.4,1) both}
  .splash .rank-word{animation:slam .7s .15s cubic-bezier(.2,1.6,.4,1) both}
  .splash.out{animation:fade .35s ease-in forwards}
  @keyframes slam{from{transform:scale(2.4) rotate(-12deg);opacity:0}}
  @keyframes fade{to{opacity:0;visibility:hidden}}
}

/* tier ladder */
.ladder{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory}
.rung{flex:none;width:92px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.rung.locked .badge-svg{filter:grayscale(1) brightness(.45)}
.rung.here{border-color:var(--accent);box-shadow:var(--glow)}
.rung b{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:15px}

/* cards */
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface) 140px);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:var(--raise);border:1px solid var(--line);flex:none;font-family:var(--mono)}
.avatar.you{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 14px rgba(255,107,26,.5)}
.who{min-width:0;flex:1}
.who .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.who .meta{font-size:12px;color:var(--muted)}
.linkname{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left}
.linkname:hover{color:var(--accent)}
.poster{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(170deg,#12304D,#0A1524)}
.poster::before{content:"";position:absolute;inset:0;background:#DCE8F3;opacity:.9;
  clip-path:polygon(0 72%,38% 52%,62% 58%,100% 30%,100% 100%,0 100%)}
.poster .tname{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:36px;line-height:.95;text-transform:uppercase;color:#0A1524}
.poster .play{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 7px;text-transform:uppercase}
video.clip{display:block;width:100%;aspect-ratio:4/5;max-height:70vh;background:#000;object-fit:contain}
.card-foot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.trick{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;font-style:italic}
.trick small{font-family:var(--body);font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted);text-transform:none}
.pts{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);text-shadow:0 0 12px rgba(255,107,26,.5)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;border:1px solid}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:rgba(59,224,138,.4)}
.pill.no{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,84,112,.4)}
.pill.wait{background:var(--ice-soft);color:var(--ice);border-color:rgba(201,208,222,.4)}
.pill.totd{background:var(--accent-soft);color:var(--accent-hot);border-color:rgba(255,107,26,.5)}
.pill.sport{background:var(--raise);color:var(--muted);border-color:var(--line)}

/* like / comment bar */
.social{display:flex;align-items:center;gap:6px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--mono)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn.lit{color:var(--accent);border-color:rgba(255,107,26,.6);background:var(--accent-soft)}
.icon-btn.lit svg{fill:var(--accent)}
.icon-btn{transition:color .15s,border-color .15s,background-color .15s}
.icon-btn:active{transform:scale(.94)}
@media (prefers-reduced-motion:no-preference){
  .icon-btn.pop svg{animation:pop .35s ease-out}
  .comments.opening,.comment.new{animation:drop .22s ease-out}
}
@keyframes pop{40%{transform:scale(1.45) rotate(-8deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.comments{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.18)}
.comment{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.comment b{font-weight:700;margin-right:4px}
.comment .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:12px 14px;
  font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--accent-hot),var(--accent));color:var(--accent-ink);border-color:transparent;
  box-shadow:0 6px 22px rgba(255,107,26,.35);text-transform:uppercase}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);color:#04160C;border-color:transparent}
.btn.bad{background:var(--bad);color:#1A0207;border-color:transparent}
.btn.small{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus,input:focus{border-color:var(--ice)}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;color:var(--accent);text-shadow:0 0 20px rgba(255,107,26,.55)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;align-self:flex-start}

/* sport switch: big ski / snowboard buttons */
.sport-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sport-switch button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;
  font-family:var(--display);font-weight:900;font-style:italic;font-size:20px;text-transform:uppercase;display:flex;gap:8px;align-items:center;justify-content:center}
.sport-switch button.on{border-color:var(--hot,#ff5a1f);background:rgba(255,90,31,.12);color:var(--hot,#ff5a1f);box-shadow:none}

/* Trick of the Day hero */
.totd-card{position:relative;border-radius:18px;padding:1.5px;margin-bottom:18px;
  background:linear-gradient(120deg,var(--accent),#C0218A 45%,var(--ice))}
.totd-in{border-radius:16.5px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
  background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.25), transparent 60%),#0B0F16}
.totd-name{font-family:var(--display);font-weight:900;font-style:italic;font-size:40px;line-height:.95;text-transform:uppercase}
.totd-x{grid-row:1 / span 3;grid-column:2;font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;font-style:italic;
  color:var(--accent);text-shadow:0 0 24px rgba(255,107,26,.8)}
.totd-in .btn{grid-column:1 / -1;margin-top:10px}

/* ranks */
.me-card{padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.rank-line{display:flex;align-items:center;gap:14px}
.bar{height:10px;border-radius:5px;background:var(--bg);border:1.5px solid #0A0D14;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#FFB070,var(--accent) 60%,#C84A00);box-shadow:0 0 12px rgba(255,107,26,.7)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;align-items:center;margin-block:12px 10px;flex-wrap:wrap}
.filters select{width:auto;flex:1;min-width:140px;padding:8px 10px}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--line);cursor:pointer}
.board li:hover{background:var(--raise)}
.board li:first-child{border-top:0}
.board li.you{background:var(--accent-soft)}
.board .n{font-family:var(--display);font-weight:900;font-size:22px;font-style:italic;color:var(--muted);text-align:right}
.board li:nth-child(1) .n{color:#FFD35A;text-shadow:0 0 12px rgba(255,211,90,.6)}
.board li:nth-child(2) .n{color:#D6DEE6}
.board li:nth-child(3) .n{color:#E0955A}
.board .score{font-family:var(--mono);font-weight:700;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:26px;font-style:italic;text-transform:uppercase;color:var(--ink)}

/* profile */
.prof-head{display:flex;align-items:center;gap:14px;margin-block:6px 16px}
.prof-head h2{margin:0}
.friend-rank{display:flex;align-items:center;gap:5px}
.squad-seg{display:flex;width:100%;margin:4px 0 14px}
.squad-seg button{flex:1;padding:8px 4px}
.squad-seg .cnt,.feed-bar .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--hot,#ff5a1f);color:#0a0b10;font:700 10px/16px "JetBrains Mono",monospace}
.prof-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.prof-rank{display:grid;gap:8px;margin-bottom:12px;padding:14px 16px}
.prof-rank .row{flex-wrap:wrap;gap:6px 12px;justify-content:space-between}
.crew-pitch{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;font-style:italic}
.duel-rank{display:inline-flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-style:italic}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.medals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
/* Skeletons: grey shapes where content is about to load (feels faster than "Loading…") */
.skel{display:block;height:12px;border-radius:2px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--raise) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:skel 1.3s linear infinite}
.skel.big{height:22px}.skel.round{width:44px;height:44px;border-radius:50%}
.skel-item .fi-info{display:flex;flex-direction:column;gap:10px}.skel-item .fi-side{gap:16px}
.skel-prof{display:flex;flex-direction:column;gap:12px;margin-block:10px}.skel-prof .skel.card-h{height:120px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
/* First-time setup (2 taps) and the one-time Record hint */
.onboard{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;
  background:rgba(4,6,10,.97);max-width:480px;margin:0 auto}
.onboard h2{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:34px;line-height:1;margin:0}
.onboard .ob-step{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.onboard .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onboard .ob-grid .btn{min-height:64px;font-size:16px;font-weight:700}
.onboard .ob-grid .btn.big{min-height:110px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.onboard .ob-grid .btn.big svg{width:34px;height:34px}
.rec-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:12;
  background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px;border-radius:10px;max-width:260px;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
.rec-hint::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:8px solid transparent;border-bottom:0;border-top-color:var(--accent)}
.rec-hint small{display:block;font-weight:500;opacity:.8}
/* "Get Stomped on your home screen" card (Connor 10/27): slides up from the bottom, over the tab bar */
.install-sheet{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;max-width:440px;margin:0 auto;
  padding:16px;display:grid;gap:10px;transform:translateY(130%);transition:transform .32s cubic-bezier(.2,.9,.3,1.2)}
.install-sheet.open{transform:none}
.install-sheet h3{margin:0;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.install-sheet p{margin:0;color:var(--muted)}
.install-sheet ol{margin:0;padding-left:20px;display:grid;gap:6px}
.install-sheet ol svg{width:18px;height:18px;vertical-align:-3px;color:var(--accent-hot)}
.install-sheet .btns{display:flex;gap:8px}
.install-sheet .btns .btn{flex:1}
.inapp-note{border-left:3px solid var(--accent)!important}
@media (prefers-reduced-motion:no-preference){.rec-hint{animation:hintbob 1.6s ease-in-out infinite}}
@keyframes hintbob{50%{transform:translateX(-50%) translateY(-4px)}}
.sent-you{display:block;padding:12px 14px;margin-block:0 14px;border-color:var(--accent);color:var(--ink);text-decoration:none}
.sent-you b{color:var(--accent)}
.medals .card{padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.medals .rank-word{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;padding:0;cursor:pointer}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:15px;line-height:1;text-transform:uppercase;text-align:left;text-shadow:0 1px 6px #000}
.tile em{position:absolute;right:6px;top:5px;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);text-shadow:0 1px 4px #000}
.back{margin-top:6px}

/* ---------- trick book (checklist) ---------- */
.book-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;padding:14px 16px;margin-top:16px}
.book-link .count{font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:1}
.book-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.book-row:first-of-type{border-top:0}
.book-row.done b{color:var(--good)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px}
.check.on{background:var(--good);border-color:#0A0D14;color:#04160C;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.book-cat{padding:10px 14px 4px;display:flex;justify-content:space-between}

.tips{padding:4px 14px 14px 52px;background:rgba(201,208,222,.05);border-top:1px dashed var(--line)}
.tips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tips .label{margin-top:10px;color:var(--ice)}

/* ---------- record ---------- */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:9/14;max-height:62vh;margin-inline:auto;width:100%;border:1px solid var(--line)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-weight:700;
  background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px;font-size:14px}
.cam .timer.live{background:var(--bad);color:#fff}
.cam .controls{position:absolute;left:0;right:0;bottom:16px;display:flex;align-items:center;justify-content:center;gap:28px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--bad);cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.shutter.stop{background:transparent;display:grid;place-items:center}
.shutter.stop::after{content:"";width:28px;height:28px;border-radius:6px;background:var(--bad)}
.cam-side{width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:20px}
.cam-empty{display:grid;place-items:center;gap:14px;text-align:center;padding:24px;height:100%;color:var(--muted)}
.cam-empty .big-cam{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 30px rgba(255,107,26,.5);border:0;cursor:pointer}
.cam-empty .big-cam svg{width:44px;height:44px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}

/* ---------- judge reel (swipe up) ---------- */
.reel{height:calc(100dvh - 196px - env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;margin-inline:-16px;
  scrollbar-width:none;overscroll-behavior:contain}
.reel::-webkit-scrollbar{display:none}
.reel-item{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.reel-item video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.reel-info{position:absolute;left:14px;right:14px;bottom:118px;text-shadow:0 1px 8px #000}
.reel-info .trick{font-size:30px}
.reel-actions{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:flex-end;gap:28px}
.reel-actions > div{display:flex;flex-direction:column;align-items:center;gap:14px}
.reel-item.judging{touch-action:pan-y;will-change:transform}
.swipe-hint{position:absolute;top:22%;z-index:2;padding:6px 14px;border:4px solid currentColor;border-radius:12px;pointer-events:none;
  font-family:var(--display);font-weight:900;font-style:italic;font-size:40px;text-transform:uppercase;text-shadow:0 2px 0 #0A0D14}
.swipe-hint.yes{left:18px;color:var(--good);transform:rotate(-12deg);opacity:var(--yes,0)}
.swipe-hint.no{right:18px;color:var(--bad);transform:rotate(12deg);opacity:var(--no,0)}
/* ---------- full-screen feed ---------- */
.feedwrap{position:relative}
.feed-bar.float{position:absolute;top:10px;left:0;right:0;z-index:5;justify-content:center;flex-wrap:nowrap;gap:6px;margin:0;pointer-events:none}
.feed-bar.float .seg{pointer-events:auto;background:rgba(10,13,20,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.feed-bar.float .seg button{padding:6px 8px;font-size:12px}
.reel.feedreel{height:calc(100dvh - 150px - env(safe-area-inset-bottom,0px))}
.feedreel .reel-top{top:62px}   /* clear the Clips | Judge bar */
.feed-bar .on .cnt{background:#0a0b10;color:var(--hot,#ff5a1f)}
.feed-item video{object-fit:contain}
.feed-item::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.feed-item .poster{height:100%;display:grid;place-items:center}
.fi-side{position:absolute;right:8px;bottom:22px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.fi-side .icon-btn{flex-direction:column;gap:3px;background:none;border:0;padding:0;color:#fff;font-size:12px;text-shadow:0 1px 4px #000}
.fi-side .icon-btn svg{width:32px;height:32px;stroke-width:1.8;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
.fi-side .icon-btn.lit{background:none;color:var(--accent)}
.fi-side .avatar{width:46px;height:46px;border:2px solid #fff;font-size:14px}
.fi-info{position:absolute;left:14px;right:78px;bottom:20px;z-index:2;display:grid;gap:5px;text-shadow:0 1px 6px #000}
.fi-info .who{display:flex;align-items:center;gap:6px;font-weight:800}
.fi-info .trick{font-family:var(--display);font-weight:900;font-style:italic;font-size:32px;text-transform:uppercase;line-height:1}
.fi-info .meta{font-size:13px;color:#dfe6ef}
.fi-info .row{justify-content:flex-start;gap:8px}
.fi-info .pts{font-family:var(--mono);color:var(--accent)}
.fi-info .pts small{color:#dfe6ef;font-weight:600}
.feed-item > .comments{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:62%;overflow:auto;background:rgba(12,15,22,.97);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line)}
.feed-item > .clip-menu{position:absolute;right:66px;bottom:80px;z-index:6;display:grid;gap:6px;max-width:250px;padding:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px}
.reel-item.intro{overflow-y:auto;padding:60px 16px 16px;background:var(--bg);display:grid;align-content:start;gap:12px}
.round{width:62px;height:62px;border-radius:50%;border:3px solid #0A0D14;cursor:pointer;font-size:26px;font-weight:900;
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.round.yes{background:var(--good);color:#04160C}
.round.no{background:var(--bad);color:#1A0207}
.round.skip{width:46px;height:46px;background:rgba(255,255,255,.14);color:#fff;font-size:18px;border-color:transparent}
.round-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:-10px;text-shadow:0 1px 4px #000}
.reel-reasons{position:absolute;inset:auto 12px 18px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  background:rgba(6,8,12,.9);padding:12px;border-radius:16px;border:1px solid var(--line)}
.reel-reasons .label{grid-column:1 / -1}
.reel-done{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);pointer-events:none;overflow:hidden}
.reel-done > *{grid-area:1 / 1}
.reel-done .stamp{font-family:var(--display);font-weight:900;font-style:italic;font-size:58px;text-transform:uppercase;line-height:1;
  padding:6px 18px;border:5px solid currentColor;border-radius:14px;transform:rotate(-8deg);text-shadow:0 3px 0 #0A0D14;
  box-shadow:0 0 0 3px #0A0D14,inset 0 0 0 3px #0A0D14,0 0 40px currentColor}
.reel-done.yes{color:var(--good)}
.reel-done.no{color:var(--bad)}
.reel-done .ring{width:120px;height:120px;border-radius:50%;border:6px solid var(--good);opacity:0}
.reel-done .snow i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);border-radius:50%;background:#fff;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .reel-done{animation:fade-in .15s ease-out}
  .reel-done.yes .stamp{animation:stamp .45s cubic-bezier(.2,1.8,.4,1) both}
  .reel-done.yes .ring{animation:shock .6s .12s ease-out both}
  .reel-done.yes .snow i{animation:burst .75s .1s cubic-bezier(.1,.7,.3,1) both}
  .reel-item:has(.reel-done.yes) video{animation:jolt .3s .1s ease-out}
  .reel-done.no .stamp{animation:stamp-no .5s ease-out both}
}
@keyframes fade-in{from{opacity:0}}
@keyframes stamp{from{transform:rotate(-20deg) scale(2.6);opacity:0}60%{opacity:1}to{transform:rotate(-8deg) scale(1)}}
@keyframes shock{from{transform:scale(.3);opacity:.9}to{transform:scale(3.2);opacity:0}}
@keyframes burst{0%{transform:rotate(var(--a)) translateX(0);opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) translateY(20px);opacity:0}}
@keyframes jolt{30%{transform:translateY(6px) scale(1.02)}}
@keyframes stamp-no{from{transform:rotate(-8deg) scale(1.4);opacity:0}30%{opacity:1;transform:rotate(-8deg) translateX(-14px)}
  50%{transform:rotate(-8deg) translateX(12px)}70%{transform:rotate(-8deg) translateX(-8px)}to{transform:rotate(-8deg)}}
.reel-end{height:100%;scroll-snap-align:start;display:grid;place-items:center;text-align:center;padding:24px}
.reel-top{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 1px 6px #000}
.modal{position:fixed;inset:0;z-index:40;background:rgba(4,6,10,.8);display:grid;place-items:center;padding:24px}
.modal .card{max-width:360px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px}

/* ---------- duels ---------- */
.duel-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.duel-row:first-child{border-top:0}
.duel-row:hover{background:var(--raise)}
.letters{display:flex;gap:5px}
.letters b{width:30px;height:36px;display:grid;place-items:center;border-radius:8px;font-family:var(--display);font-style:italic;
  font-weight:900;font-size:24px;border:2px dashed var(--line);color:var(--line)}
.letters.small b{width:20px;height:24px;font-size:15px;border-radius:5px;border-width:1.5px}
.letters b.hit{border:2px solid #0A0D14;background:var(--bad);color:#1A0207;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px 14px}
.vs .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vs .side.r{align-items:flex-end}
.vs .mid{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;color:var(--accent);text-shadow:0 0 16px rgba(255,107,26,.6)}
.log{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.log li.hot{border-left-color:var(--accent);color:var(--ink)}
.turn{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.2)}
.turn .what{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px;text-transform:uppercase;line-height:1}
.your-turn{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:3px 9px}
.friend{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.friend:first-child{border-top:0}
.friend .acts{display:flex;gap:6px}

/* ---------- mountain conditions ---------- */
.wx{padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.wx .now{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:1}
.wx .snow{text-align:right}
.wx .snow b{display:block;font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:1;color:var(--ice);text-shadow:0 0 14px rgba(201,208,222,.4)}
.wx .days{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx .day{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px}
.wx .day .ico{font-size:20px;line-height:1.3}

/* ---------- achievements ---------- */
.achs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.ach{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.ach .emb{width:54px;height:60px;display:grid;place-items:center;font-size:24px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#2B3A52,#141B27)}
.ach.got .emb{background:linear-gradient(160deg,#FFB070,var(--accent) 55%,#9E1170)}
.ach:not(.got){opacity:.4}
.ach:not(.got) .emb{filter:grayscale(1)}
.ach b{font-size:11px;line-height:1.15}
.ic-line{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.ach .emb .ic-line{color:var(--muted)}
.ach.got .emb .ic-line{color:#0a0b10;stroke-width:2.4}
.book-ic{display:grid;place-items:center;color:var(--hot,#ff5a1f)}
.ach-more{grid-column:1 / -1;justify-self:start}
.ach span{font-size:10px;color:var(--muted);line-height:1.2}

/* trick book: category ring + grab chips */
.ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;font-family:var(--mono);
  background:conic-gradient(var(--good) calc(var(--p) * 1%), var(--raise) 0)}
.ring i{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);border:1px solid rgba(59,224,138,.35)}
.chip.next{background:none;color:var(--muted);border:1px dashed var(--line)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,13,19,.85);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabs button{border:0;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(255,107,26,.8))}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tabs button.rec-tab .dot{width:50px;height:50px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--accent-hot),var(--accent));border:3px solid #0A0D14;box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 20px rgba(255,107,26,.5)}
.tabs button.rec-tab svg{stroke:var(--accent-ink);width:24px;height:24px}
.tabs button.rec-tab.on::before{display:none}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--ice);color:#021218;
  font-size:10px;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
/* Phone tab bar, game style: each tab is its own chunky button, the active one lit orange (the desktop sidebar
   keeps its own look from the 1000px rules below) */
@media (max-width:999px){
  .tabs{background:linear-gradient(rgba(6,8,12,0),rgba(6,8,12,.92) 30%);border-top:0;backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
  .tabs nav{gap:7px;align-items:end}
  .tabs button{height:56px;padding:0;justify-content:center;gap:3px;border-radius:12px;background:rgba(16,21,30,.88);
    border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 rgba(0,0,0,.45);
    font-family:var(--display);font-size:13px;font-weight:900;letter-spacing:.08em;transition:transform .08s ease,box-shadow .08s ease}
  .tabs button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(0,0,0,.45)}
  .tabs button.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent),0 0 16px -2px rgba(255,107,26,.55),0 4px 0 rgba(0,0,0,.45)}
  .tabs button.on::before{display:none}
  .tabs button.rec-tab{background:none;border:0;box-shadow:none;height:66px}
  .tabs button.rec-tab .dot{width:56px;height:56px;margin-top:-10px;border:3px solid #06080C}
  .tabs .badge{top:-6px;left:auto;right:-4px;background:var(--bad);color:#fff;font-family:var(--body);font-weight:800;min-width:20px;line-height:20px;box-shadow:0 0 10px rgba(255,84,112,.6)}
  .app{padding-block-end:96px}
  .reel{height:calc(100dvh - 214px - env(safe-area-inset-bottom,0px))}           /* the game tab bar is a bit taller */
  .reel.feedreel{height:calc(100dvh - 166px - env(safe-area-inset-bottom,0px))}
  .lodge{min-height:calc(100svh - 162px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:#0B0F16;color:var(--ink);border:1px solid var(--accent);box-shadow:var(--glow);
  padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translate(-50%,10px);opacity:.3}}

}

/* ================= HUD redesign (2026-09-30): denser, more futuristic ================= */
body{background:#0a0b10}   /* DESIGN.md: near-black + film grain everywhere (grid removed 10/25) */
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;font-weight:700}
h2{font-size:30px;margin:4px 0 2px}

.stack{gap:12px}

.crew-create input{min-width:0}

/* ---------- feel like an app, not a web page ---------- */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea,.comment p{-webkit-user-select:text;user-select:text}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.fb textarea{width:100%;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
input,select,textarea{font-size:16px}   /* under 16px, iPhone zooms the whole page when you tap a box */
button,[data-act],select{touch-action:manipulation}
.top{background:rgba(6,8,12,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  margin-inline:-16px;padding-inline:16px}
.player{position:relative;cursor:pointer;background:#000}
.pl-play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);
  pointer-events:none;transition:opacity .2s,transform .2s}
.pl-play svg{width:28px;height:28px;fill:#fff;margin-left:4px}
.player.playing .pl-play{opacity:0;transform:scale(.7)}
.pl-mute{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;
  background:rgba(0,0,0,.55);cursor:pointer}
.pl-mute svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:none;border-color:var(--line);color:var(--muted);width:100%}
@media (prefers-reduced-motion:no-preference){
  button,.btn{transition:transform .12s ease,filter .12s ease}
  button:active,.btn:active{transform:scale(.95)}
  .tabs button:active{transform:scale(.88)}
  #view.swap{animation:swap .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{from{opacity:0;transform:translateX(14px)}}
}

.clip-menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}

.feed-bar .seg button{padding:7px 10px}

/* first-run help: how it works (sign-in), start-here checklist (feed), landed rule (judge) */
.how{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:how}
.how li{counter-increment:how;display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:center;padding:12px 14px;
  border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.how li::before{content:counter(how);grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:900;font-style:italic;font-size:18px}
.how li span{color:var(--muted);font-size:13.5px}
.start{padding:14px}
/* The control a "Pick your ..." link jumped to: glow for a moment so the eye finds it */
.flash{box-shadow:0 0 0 3px var(--accent),0 0 22px rgba(255,107,26,.55);transition:box-shadow .4s}
.start-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;background:none;border:0;
  border-top:1px solid var(--line);cursor:pointer}
.start-step b{display:block}
.start-step .tick{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  color:var(--accent-ink);font-weight:900;font-size:13px}
.start-step.ok .tick{background:var(--good);border-color:var(--good)}
.start-step.ok b{color:var(--muted);text-decoration:line-through}
.rule{margin-top:14px;padding:12px 14px}
.rule summary{cursor:pointer;font-weight:700;color:var(--ice)}
.rule ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--ink)}

/* ---------- laptop & desktop: sidebar nav | feed | HUD rail ---------- */
@media (min-width:1000px){
  .shell{margin-left:228px;display:grid;grid-template-columns:minmax(0,640px) 350px;gap:26px;justify-content:center;padding:0 28px}
  .app{max-width:none;margin:0;padding-inline:0;padding-block:0 40px}
  .rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:14px 2px 24px;scrollbar-width:thin}
  .top{background:none;margin-inline:0;padding-inline:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  /* signed out: no sidebar or rail, so center one wide column and show the logo */
  body.signed-out .shell{margin-left:0;grid-template-columns:minmax(0,880px)}
  body.signed-out .rail{display:none}
  body.signed-out .brand{visibility:visible}
  body.signed-out #auth-form,body.signed-out #auth-top,body.signed-out #auth-top + .sub{max-width:480px}
  .tabs{top:0;bottom:0;right:auto;width:228px;border-top:0;border-right:1px solid rgba(201,208,222,.14);padding:84px 14px 20px;
    background:linear-gradient(180deg,rgba(10,14,22,.92),rgba(6,8,12,.95))}
  .tabs::before{content:"STOMP";position:absolute;top:24px;left:24px;font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;letter-spacing:.5px;transform:skewX(-6deg);color:var(--ink)}
  .tabs::after{content:"ED";position:absolute;top:24px;left:114px;font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;color:var(--accent);text-shadow:0 0 18px rgba(255,107,26,.7);transform:skewX(-6deg)}
  .tabs nav{display:flex;flex-direction:column;align-items:stretch;gap:6px;max-width:none}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:13px}
  .tabs button:hover{background:rgba(201,208,222,.06)}
  .tabs button.on{background:var(--accent-soft)}
  .tabs button.on::before{top:8px;bottom:8px;left:0;right:auto;width:3px;height:auto}
  .tabs .badge{position:static;margin-left:auto}
  .tabs button.rec-tab{order:-1;margin-bottom:10px;background:linear-gradient(180deg,var(--accent-hot),var(--accent));color:var(--accent-ink);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);border-radius:0;box-shadow:0 0 24px rgba(255,107,26,.4)}
  .tabs button.rec-tab .dot{width:auto;height:auto;margin:0;background:none;border:0;box-shadow:none}
  .tabs button.rec-tab.on{background:linear-gradient(180deg,var(--accent-hot),var(--accent))}
  .brand{visibility:hidden}
  .toast{bottom:28px;left:calc(50% + 114px)}
  .reel{height:calc(100vh - 120px)}
}

/* Game-style buttons everywhere: a raised top edge, a solid shadow underneath, and a press-down on tap.
   Placed after the base rules so it restyles them without touching layout. */
.btn{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#26324a,#161e2c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 0 #04060a,0 10px 18px -10px #000;transition:transform .08s ease,box-shadow .08s ease,filter .1s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 0 #04060a}
.btn.primary{border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #8a3208,0 0 22px rgba(255,107,26,.35)}
.btn.primary:active:not([disabled]){box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #8a3208,0 0 14px rgba(255,107,26,.3)}
.btn.good{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #137040}.btn.good:active{box-shadow:0 1px 0 #137040}
.btn.bad{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #8a1f30}.btn.bad:active{box-shadow:0 1px 0 #8a1f30}
.btn.small{font-size:14px;padding:8px 12px}
.icon-btn{background:linear-gradient(180deg,#232e43,#161e2b);border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #04060a;font-weight:800}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 #04060a}
.icon-btn.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #5a2206,0 0 12px rgba(255,107,26,.35)}
.seg{background:#0b0f16;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.seg button{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:linear-gradient(180deg,var(--accent-hot),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #8a3208}
.sport-switch button{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 #04060a;transition:transform .08s ease,box-shadow .08s ease}
.sport-switch button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 #04060a}
.sport-switch button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 #8a3208}
.round{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.55);transition:transform .08s ease,box-shadow .08s ease}
.round:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.55)}
@media (prefers-reduced-motion:reduce){.btn,.icon-btn,.round,.sport-switch button{transition:none}}
/* Panels sit up off the screen like game cards; text boxes sink in like game input fields */
.card{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 5px 0 #04060a,0 16px 28px -14px #000}
/* DESIGN.md "cut corners, not round ones" (critique 10/25): bevel the top-left and bottom-right like the Base panels */
.card,.stat,.rung{border-radius:0;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.stat,.rung{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.btn,.tile,.seg,.seg button,input,select,textarea,.sport-switch button{border-radius:0}
/* Cold fingers and gloves (10/27): everything you tap is at least ~44px (Apple's minimum), feed buttons 48px */
.me-chip{min-height:44px}#acct-chip{min-width:44px}
.seg button,.feed-bar.float .seg button{min-height:42px}
.feed-bar.float .seg button{padding:8px 12px}
.fi-side{gap:6px}
.fi-side .icon-btn{min-width:48px;min-height:48px;justify-content:center}
.fi-info .linkname{min-height:40px;display:inline-flex;align-items:center}
.linkish{min-height:44px;display:inline-flex;align-items:center}
.btn.small{min-height:44px}
.b2-invite{width:100%;margin-top:12px;min-height:48px;justify-content:center}.b2-lbl button{min-height:44px;padding-inline:10px}
/* Rank tag on feed clips: badge + rank name in the rank's color (name, not just color) */
.rank-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 2px;border:1px solid currentColor;background:rgba(0,0,0,.5);
  font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.03em;line-height:1}
.btn,.tile,.sport-switch button{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
select,input,textarea{background:#070a10;border-color:rgba(255,255,255,.08);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05)}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 3px rgba(255,107,26,.2);outline:none}
details>summary{cursor:pointer}

/* Base (internally 'lodge'): the home screen. Rider in the middle, everything else at the thumb. */
.lodge{position:relative;display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 190px);
  /* svh = the screen you can actually see (iPhone Safari's 100vh counts the hidden toolbar, so the Lodge scrolled a bit) */
  min-height:calc(100svh - 176px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lodge-panel{background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px -12px #000}
.lodge-road{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.lodge-road .row{display:flex;align-items:center;gap:10px}

const initials = n => String(n || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';

const count = rel => (rel && rel[0] ? rel[0].count : 0);

const mustOk = r => { if (r.error) throw r.error; return r.data; };
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + 'm';
  const h = Math.round(m / 60); return h < 24 ? h + 'h' : Math.round(h / 24) + 'd';
}
let toastTimer;
// Raw network/database errors become plain words with a next step (critique 10/25: H9)
function plainError(msg){
  const m = String(msg || '');
  if (/failed to fetch|networkerror|load failed|network request failed|timeout|offline/i.test(m))
    return 'No connection right now. Check your signal and try again.';
  if (/jwt|token|not authenticated|401/i.test(m)) return 'You got signed out. Sign in again to keep going.';
  if (/duplicate key|already exists/i.test(m)) return 'That was already done.';
  if (/permission|policy|403|row-level security/i.test(m)) return "You can't do that here.";
  // Anything else that reads like database or code talk: say it plainly, keep the details in the console
  if (/violates|constraint|column|relation|syntax|PGRST|uuid|null value|does not exist|schema cache|unexpected|undefined|\bat \w+ \(/i.test(m)){
    console.warn('Hidden error:', m);
    const head = m.match(/^([A-Z][a-z]+(?: [a-z]+)? failed): /);   // keep "Vote failed" etc.
    return (head ? head[1] + '. ' : '') + 'Something went wrong on our end. Try again in a minute.';
  }
  return m;
}
function toast(msg, ms = 2800){
  const t = $('toast'); t.textContent = plainError(msg); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const trickById = id => S.tricks.find(t => t.id === id) || {id, name: id, category: '', pts: 0, sport: 'ski'};
const sportOf = t => SPORTS[t.sport] ? t.sport : 'ski';
const tricksFor = (sport, cat) => S.tricks.filter(t => sportOf(t) === sport && (!cat || t.category === cat));
// What you ride (Connor 10/27): 'ski', 'snowboard' or 'both'. A skier never sees snowboard tricks or Trick of the Day.
const ridesSports = () => S.sports === 'both' ? Object.keys(SPORTS) : [S.sports];

// Each sport has its own Trick of the Day (supabase/016).
const isTotd = id => { const t = trickById(id); return !!t && S.totds[sportOf(t)] === id; };
const basePoints = (trickId, grab) => Math.round(trickById(trickId).pts * (grab && grab !== 'No grab' ? 1.2 : 1));
// What a clip would pay you. Mirrors resolve_clip() in supabase/006_grab_points.sql:
// new trick = full points; new grab on a trick you have = just the grab (20% of base); exact repeat = 0.
function payout(trickId, grab, combo){
  const p = trickPayout(trickId, grab), chain = combo || [];
  if (!chain.length) return p;
  // Rail combo (supabase/014_rail_combos.sql): a chain you haven't landed before adds half the added tricks' points.
  if (S.landed.combos && S.landed.combos.has(comboKey(trickId, chain)))
    return {pts: p.pts, why: p.why + ' · You\'ve landed this exact combo, so no combo bonus.'};
  const bonus = comboBonus(chain) * (isTotd(trickId) ? 2 : 1);
  return {pts: p.pts + bonus, why: `🔗 New combo: +${bonus} bonus. ` + p.why};
}
function trickPayout(trickId, grab){
  const base = trickById(trickId).pts, totd = isTotd(trickId), x = totd ? 2 : 1, grabbed = grab && grab !== 'No grab';
  const grabs = S.landed.get(trickId);
  if (!grabs) return {pts: Math.round(base * (grabbed ? 1.2 : 1) * x),
    why: totd ? 'New trick + Trick of the Day: 2×' : grabbed ? 'New trick! Grab adds 20%' : 'New trick! Full points'};
  if (grabbed && !grabs.has(grab)) return {pts: Math.round(base * .2 * x), why: `🆕 New grab! A ${grab} is worth 20% of the trick`};
  if (totd) return {pts: base, why: 'Already landed, but it\'s the Trick of the Day: pays once today'};
  return {pts: 0, why: grabbed ? `✓ You've landed this with a ${grab}. Try a new grab for points.` : '✓ Already in your Trick Book. Add a grab for points.'};
}
// ---------- rail combos ----------
const MAX_COMBO = 3;   // tricks after the first one; the database allows the same
const comboKey = (trickId, combo) => [trickId, ...combo].join('>');
const comboBonus = combo => Math.round(combo.reduce((s, id) => s + trickById(id).pts, 0) * .5);
// "270 On → Swap → 270 Out" for a combo clip, the plain trick name otherwise
const clipName = c => [c.trick_id, ...(c.combo || [])].map(id => trickById(id).name).join(' → ');
const videoUrl = path => db.storage.from('clips').getPublicUrl(path).data.publicUrl;
const winChance = (me, them) => Math.round(100 / (1 + Math.pow(10, (them - me) / 400)));
// Each rider gets their own avatar colour, picked from their username.
function avStyle(name){
  let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `style="background:linear-gradient(135deg,hsl(${h} 70% 48%),hsl(${(h + 50) % 360} 65% 30%));color:#fff;border-color:transparent"`;
}

// ---------- mountain conditions (Open-Meteo: free, no account needed) ----------
const RESORT_GEO = {
  'Eldora': [39.9372, -105.5827], 'Winter Park': [39.8868, -105.7625], 'Copper': [39.5022, -106.1511],
  'Arapahoe Basin': [39.6425, -105.8719], 'Breckenridge': [39.4817, -106.0384], 'Keystone': [39.6045, -105.9540],
};
const WX_ICON = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️'
  : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
async function loadWeather(){
  const resort = S.me && S.me.home_resort, geo = RESORT_GEO[resort];
  if (!geo){ S.wx = null; return; }
  const key = 'wx-' + resort, cached = store.get(key, null);
  if (cached){ try { const c = JSON.parse(cached); if (Date.now() - c.at < 30 * 60000){ S.wx = c; return; } } catch (e) {} }
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo[0]}&longitude=${geo[1]}` +
      '&current=temperature_2m,wind_speed_10m,weather_code&daily=snowfall_sum,temperature_2m_max,temperature_2m_min,weather_code' +
      '&past_days=1&forecast_days=4&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FDenver';
    const r = await fetch(url); if (!r.ok) return;
    const j = await r.json();
    S.wx = {at: Date.now(), resort, current: j.current, daily: j.daily};
    store.set(key, JSON.stringify(S.wx));
  } catch (e) { /* no signal on the hill: just skip the card */ }
}
function wxCard(){
  if (!S.me.home_resort) return `<button class="card wx" data-act="tab" data-tab="ranks" data-focus="home-resort" style="width:100%;text-align:left;cursor:pointer">
    <div><div class="label">Mountain conditions</div><div class="hint">Tap to set your home mountain and see snow and weather here.</div></div>
    <span style="font-size:26px;color:var(--ice)">${IC.mountain}</span></button>`;
  const W = S.wx; if (!W || W.resort !== S.me.home_resort) return '';
  const d = W.daily, fresh = (d.snowfall_sum[0] || 0) + (d.snowfall_sum[1] || 0);  // yesterday + today
  const day = i => new Date(d.time[i] + 'T12:00').toLocaleDateString('en-US', {weekday: 'short'});
  return `<section class="card wx">
    <div><div class="label">${esc(W.resort)} · now</div>
      <div class="now">${WX_ICON(W.current.weather_code)} ${Math.round(W.current.temperature_2m)}°</div>
      <div class="hint">Wind ${Math.round(W.current.wind_speed_10m)} mph</div></div>
    <div class="snow"><b>${fresh >= 0.1 ? fresh.toFixed(1) : '0'}″</b><span class="hint">new snow, 2 days</span></div>
    <div class="days">${[2, 3, 4].map(i => `<div class="day"><div class="label">${day(i)}</div><div class="ico">${WX_ICON(d.weather_code[i])}</div>
      <div class="mono">${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div>
      ${d.snowfall_sum[i] >= 0.1 ? `<div style="color:var(--ice);font-weight:700">❄ ${d.snowfall_sum[i].toFixed(1)}″</div>` : ''}</div>`).join('')}</div>
  </section>`;
}

                 'Weight forward for the tap, then level out in the air.'],
  'sb-tailtap': ['Lift your nose so your tail taps the feature, then ollie off the tail.',
                 'Start on a small box end or a snow bump.'],
  // snowboard: pipe + backcountry
  'sb-fsair': ['Ride up the frontside wall (your toes face it) and air straight up, then land back into the wall.',
               'Carve up the wall instead of going straight up it. Start small.'],
  'sb-alley': ['Alley-oop means spinning uphill, against the direction you\'re moving along the pipe.',
               'Turn your shoulders uphill before you leave the lip.'],
  'sb-mctwist': ['An inverted 540 in the pipe. One of the hardest pipe tricks.',
                 'Get big pipe airs and backflips first, and learn it into an airbag.'],
  'sb-cliff15': ['Look at the landing from below first: steep, deep snow, no rocks.',
                 'Small ollie off the edge, eyes on the landing, absorb with your knees.'],
  'sb-bcflip': ['Scout the takeoff and landing, and build the jump so the landing is steep enough.',
                'Never your first backflip. It needs to be dialled in the park first.'],
};
const TIP_GROUPS = [
  {test: t => t.category === 'Rails', tips: ['Check the feature first: how long it is, and whether it\'s kinked or down.']},
  {test: t => t.category === 'Park', tips: ['Spot your landing before you open up, and land with your weight centred and your knees soft.']},
];
const isInvert = t => /flip|Rodeo|Misty|McTwist|Flair|Cork/i.test(t.name);
function tipsFor(t){
  const out = [...(TIPS[t.id] || [])];
  if (!out.length) for (const g of TIP_GROUPS) if (g.test(t)) out.push(...g.tips);   // only for a trick with no tips of its own
  if (isInvert(t)) out.push('⚠ Upside down or off-axis: learn it on a trampoline or airbag first, ideally with a coach.');
  return out.slice(0, 4);
}

const inCat = (L, cat) => [...L.keys()].filter(id => trickById(id).category === cat).length;

// Trophy case: earned badges first; the locked ones stay folded until you ask (S.achAll)
function achievementsHtml(L){

  const shown = S.achAll ? [...earned, ...locked] : earned.length ? earned : locked.slice(0, 4);

// Minutes until midnight in Denver, when the Trick of the Day changes.
function totdResetsIn(){
  const parts = new Intl.DateTimeFormat('en-US', {timeZone: 'America/Denver', hour: 'numeric', minute: 'numeric', hourCycle: 'h23'})
    .formatToParts(new Date());
  const get = type => Number(parts.find(p => p.type === type).value);
  const left = 24 * 60 - (get('hour') * 60 + get('minute'));
  return `${Math.floor(left / 60)}h ${left % 60}m`;
}

// ---------- ranks: tier + division (I, II, III) ----------
// Each tier is split into three divisions, like game ranks. Legend is the top and has none.
const ROMAN = ['', 'I', 'II', 'III'];
function rankInfo(value, table){
  const t = table.find(x => value >= x.min), i = table.indexOf(t), next = i > 0 ? table[i - 1] : null;
  if (!next) return {tier: t, div: 0, label: t.name, pct: 100, toNext: 0, nextLabel: null};
  const span = next.min - t.min, into = value - t.min;
  const div = Math.min(3, Math.floor(into / span * 3) + 1);
  const divTop = t.min + Math.round(span * div / 3);
  const pct = (into - span * (div - 1) / 3) / (span / 3) * 100;
  return {tier: t, div, label: `${t.name} ${ROMAN[div]}`, pct, toNext: divTop - value,
          nextLabel: div < 3 ? `${t.name} ${ROMAN[div + 1]}` : `${next.name} I`};
}

// Chunky game-style badge: a shield with a mountain, and more gear each tier up.
// Stars under the shield show the division (1-3).
// ---------- rank badges (v5, 2026-10-20): angular layered emblem, ski-tip blades that grow per tier ----------
const BADGE = {
  bronze: ['#F6B98A','#C8743C','#6E3410'], silver: ['#FFFFFF','#B9C4CF','#5E6A78'],
  gold:   ['#FFF0A0','#F2B91E','#8C5A00'], plat:   ['#E8FFFB','#5FE0CF','#177066'],
  diamond:['#E6F4FF','#62A8FF','#2436C4'], legend: ['#FFE9B0','#FF5A1F','#C4123E'],
};
const ORDER = ['bronze','silver','gold','plat','diamond','legend'];
function star(cx, cy, r, inner = .45, n = 5){
  let d = '';
  for (let i = 0; i < n * 2; i++){
    const a = (-90 + i * 180 / n) * Math.PI / 180, rr = i % 2 ? r * inner : r;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
const bMirror = pts => pts.map(([x, y]) => [120 - x, y]);
const bPoly = pts => 'M' + pts.map(p => p.join(' ')).join(' L') + ' Z';
const bScale = (pts, k, cx = 60, cy = 58) => pts.map(([x, y]) => [+(cx + (x - cx) * k).toFixed(1), +(cy + (y - cy) * k).toFixed(1)]);
const B_EMBLEM = [[60, 10], [94, 22], [98, 60], [60, 106], [22, 60], [26, 22]];

function badgeSVG(key, size = 64, div = 0, {glow = false, float = false} = {}){
  const [hi, mid, lo] = BADGE[key], lvl = ORDER.indexOf(key), O = '#0A0D14';
  const id = 'b5' + key, metal = id + 'm', dark = id + 'd';
  const pair = (pts, fill, sw = 4) => `<path d="${bPoly(pts)}" fill="${fill}" stroke="${O}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="${bPoly(bMirror(pts))}" fill="${fill}" stroke="${O}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  // Two-tone blade: light outer half, dark inner half, so it looks carved
  const blade = (pts, cut) => pair(pts, `url(#${metal})`) + `<path d="${bPoly(cut)}" fill="${lo}" opacity=".55"/><path d="${bPoly(bMirror(cut))}" fill="${lo}" opacity=".55"/>`;

  let back = '', front = '';
  if (lvl === 5) back += `<g opacity=".9">${Array.from({length: 16}, (_, i) => {
      const a = (i * 22.5 + 11.25) * Math.PI / 180, r1 = 30, r2 = i % 2 ? 66 : 76, w = .09;
      const P = (r, t) => `${(60 + r * Math.cos(t)).toFixed(1)} ${(56 + r * Math.sin(t)).toFixed(1)}`;
      return `<path d="M${P(r1, a - w)} L${P(r2, a)} L${P(r1, a + w)} Z" fill="url(#${id}ray)"/>`; }).join('')}</g>`;
  if (lvl === 0) back += pair([[24, 24], [14, 18], [18, 34]], `url(#${metal})`, 3.5);
  // ski-tip blades, growing with the tier
  if (lvl >= 1) back += blade([[30, 30], [8, 8], [12, 30], [26, 46]], [[30, 30], [12, 30], [26, 46]]);
  if (lvl >= 2) back += `<path d="${bPoly([[46, 16], [60, -4], [74, 16], [60, 12]])}" fill="url(#${metal})" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
    <path d="${bPoly([[60, -4], [74, 16], [60, 12]])}" fill="${lo}" opacity=".5"/>`;
  if (lvl >= 3) back += blade([[26, 58], [0, 52], [8, 70], [32, 78]], [[26, 58], [8, 70], [32, 78]]);
  if (lvl >= 2) back += blade([[26, 36], [-2, 24], [4, 46], [24, 56]], [[26, 36], [4, 46], [24, 56]]);
  // Diamond only: chunky ice crystals growing out of the bottom corners
  const cry = lvl === 5 ? `url(#${id}fire)` : `url(#${id}ice)`;
  if (lvl >= 4) back += pair([[34, 86], [14, 112], [30, 108], [42, 96]], cry, 3.5)
    + pair([[24, 70], [2, 86], [14, 90], [30, 80]], cry, 3.5)
    + `<g fill="#fff" opacity=".8"><path d="M18 108 L30 92 L24 104 Z"/><path d="M102 108 L90 92 L96 104 Z"/></g>`;
  if (lvl === 5) back += pair([[34, 20], [18, -8], [44, 6], [52, 14]], `url(#${id}fire)`, 4);

  // nested frames: outer rim, inner rim, face (two-tone)
  const outer = B_EMBLEM, rim2 = bScale(B_EMBLEM, .84), face = bScale(B_EMBLEM, .72);
  const half = face.filter(([x]) => x >= 60).concat([[60, face[3][1]]]);
  const rightHalf = [[60, face[0][1]], ...face.slice(1, 4)];
  // sharp geometric mountain with a snowcap; crystal glint behind it from Platinum up
  const mtn = `<g transform="translate(60 56) scale(.78) translate(-60 -62)">${lvl >= 3 ? `<path d="${bPoly([[60, 30], [74, 52], [60, 64], [46, 52]])}" fill="${hi}" opacity=".35"/>` : ''}
    <path d="${bPoly([[34, 84], [50, 58], [57, 66], [68, 44], [86, 84]])}" fill="${hi}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="${bPoly([[68, 44], [86, 84], [68, 84], [64, 62]])}" fill="${mid}"/>
    <path d="${bPoly([[68, 44], [74, 56], [69, 54], [65, 58], [63, 54]])}" fill="#fff"/>
    <path d="${bPoly([[34, 84], [50, 58], [57, 66], [68, 44], [86, 84]])}" fill="none" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/></g>`;
  if (lvl >= 4) front += `<g fill="#fff">${[[104, 14, 6], [12, 20, 4.5], [110, 92, 4]].map(([x, y, r]) => `<path d="${star(x, y, r, .25, 4)}"/>`).join('')}</g>`;
  if (lvl === 5) front += `<path d="M40 22 L35 -2 L50 8 L60 -8 L70 8 L85 -2 L80 22 Z" fill="url(#${id}gold)" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M42 16 L78 16" stroke="${O}" stroke-width="2"/>
    <circle cx="60" cy="8" r="3.6" fill="#62A8FF" stroke="${O}" stroke-width="1.8"/>
    <circle cx="47" cy="12" r="2.4" fill="#FF5470" stroke="${O}" stroke-width="1.5"/><circle cx="73" cy="12" r="2.4" fill="#FF5470" stroke="${O}" stroke-width="1.5"/>`;

  const stars = [];
  for (let i = 0; i < div; i++) stars.push(star(60 + (i - (div - 1) / 2) * 25, 119, 12));
  // Drawn on a 120-wide grid; the box adds 16 units of room on every side for blades, rays and crowns.
  // Small badges (feed rows) keep their old box so rows don't shift; the emblem just gets a touch smaller.
  const k = size >= 40 ? size / 120 : size / 152, w = Math.round(152 * k), h = Math.round(164 * k);
  return `<svg class="badge-svg ${glow ? 'glow-' + key : ''} ${float ? 'float' : ''}" viewBox="-16 -16 152 164" width="${w}" height="${h}" aria-hidden="true">
    <defs>
      <linearGradient id="${metal}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hi}"/><stop offset=".5" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/></linearGradient>
      <linearGradient id="${dark}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lo}"/><stop offset="1" stop-color="#0A0D14"/></linearGradient>
      <radialGradient id="${id}ray" gradientUnits="userSpaceOnUse" cx="60" cy="56" r="76"><stop offset=".35" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFB02E" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id}ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".4" stop-color="#A8ECFF"/><stop offset="1" stop-color="#3D7BFF"/></linearGradient>
      <linearGradient id="${id}gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6B0"/><stop offset="1" stop-color="#E89B00"/></linearGradient>
      <linearGradient id="${id}fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7A0A2E"/><stop offset=".5" stop-color="#FF3D2E"/><stop offset="1" stop-color="#FFB02E"/></linearGradient>
    </defs>
    ${back}
    <path d="${bPoly(outer)}" fill="url(#${metal})" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>
    <path d="${bPoly(rightHalf.length ? [[60, outer[0][1]], ...outer.slice(1, 4)] : [])}" fill="${lo}" opacity=".45"/>
    ${lvl === 5 ? `<path d="${bPoly(bScale(B_EMBLEM, .93))}" fill="none" stroke="#FFD23F" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    <path d="${bPoly(rim2)}" fill="${O}" />
    <path d="${bPoly(face)}" fill="url(#${dark})" stroke="${hi}" stroke-width="1.5" stroke-opacity=".5" stroke-linejoin="round"/>
    <path d="${bPoly(rightHalf)}" fill="#000" opacity=".25"/>
    ${mtn}
    ${front}
    ${stars.map(d => `<path d="${d}" fill="#FFD23F" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>`).join('')}
  </svg>`;
}
// Where to draw a badge image on a canvas so its emblem lands where a size×(size·1.1) box would
const badgeRect = (x, y, size) => { const k = size / 120; return [x - 16 * k, y - 16 * k, 152 * k, 164 * k]; };
const rankWord = (info, size) => `<span class="rank-word t-${info.tier.key}" style="font-size:${size}px">${esc(info.label)}</span>`;
const miniBadge = points => badgeSVG(trickTierOf(points).key, 22);
const rankTag = points => { const r = rankInfo(points, TRICK_TIERS);
  return `<span class="rank-tag t-${r.tier.key}">${badgeSVG(r.tier.key, 26, r.div)}${esc(r.label)}</span>`; };

// One Trick of the Day per sport (016). Before 016 is run the database has one shared trick: file it under its own sport.
async function loadTotds(){
  const per = await Promise.all(Object.keys(SPORTS).map(sp => db.rpc('trick_of_day', {sp})));
  if (per.every(r => !r.error)) return Object.fromEntries(Object.keys(SPORTS).map((sp, i) => [sp, per[i].data]));
  const one = mustOk(await db.rpc('trick_of_day')), t = trickById(one);
  return t ? {[sportOf(t)]: one} : {};
}

// Every trick someone has been verified on, and which grabs they've done it with: their Trick Book.
// Returns a Map of trick id -> Set of grabs, with .combos = the rail combos landed (see comboKey).
async function landedTricks(userId){
  // '*' rather than naming combo, so this still works before 014_rail_combos.sql is run
  const rows = mustOk(await db.from('clips').select('*').eq('user_id', userId).eq('status', 'verified'));
  const book = new Map();
  book.combos = new Set();
  for (const r of rows){
    if (!book.has(r.trick_id)) book.set(r.trick_id, new Set()); book.get(r.trick_id).add(r.grab);
    if (r.combo && r.combo.length) book.combos.add(comboKey(r.trick_id, r.combo));
  }
  return book;
}

// Toast when one of my clips gets decided while the app is open.
function noticeResults(before){
  const mine = S.clips.filter(c => c.user_id === myId());
  if (seenStatus){
    for (const c of mine){
      if (seenStatus[c.id] !== 'pending' || c.status === 'pending') continue;
      const name = clipName(c);
      if (c.status === 'verified'){
        const a = rankInfo(before ? before.points : 0, TRICK_TIERS), b = rankInfo(S.me.points, TRICK_TIERS);
        showReward(c, a.label !== b.label ? b : null);
      } else toast(`The community didn't verify your ${name}`, 4500);
    }
  }
  seenStatus = Object.fromEntries(mine.map(c => [c.id, c.status]));
  try { localStorage.setItem('seen-status-' + myId(), JSON.stringify(seenStatus)); } catch (e) {}
}
// So a clip verified while the app was closed still gets its moment on the next open
function loadSeenStatus(){
  if (seenStatus || !S.me) return;
  try { const s = localStorage.getItem('seen-status-' + myId()); if (s) seenStatus = JSON.parse(s); } catch (e) {}
}

// The reward moment: STOMPED slams in, the screen shakes, points count up, confetti. A rank change follows it.
function showReward(c, rankUp){
  const pts = c.points_awarded || 0;
  $('overlay').innerHTML = `<div class="reward" id="reward" role="dialog" aria-label="Clip verified">
    <canvas id="reward-fx" aria-hidden="true"></canvas>
    <div class="reward-card lodge-panel">
      <h2>Stomped</h2>
      <p>${esc(clipName(c))} · verified by the crew</p>
      <div class="pts">${pts ? '+<span id="reward-n">0</span>' : 'Repeat'}</div>
      <p class="hint">${pts ? 'points' : 'Already landed, no new points'}</p>
      <button class="btn primary" data-act="reward-collect">Collect</button>
    </div></div>`;
  S.rewardRankUp = rankUp;
  const app = document.querySelector('.shell');
  if (app && !matchMedia('(prefers-reduced-motion: reduce)').matches){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }
  if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) try { navigator.vibrate([25, 40, 25]); } catch (e) {}
  if (pts){ let n = 0; const el = $('reward-n'), step = () => { n = Math.min(pts, n + Math.ceil(pts / 28)); if (el) el.textContent = n; if (n < pts) requestAnimationFrame(step); }; step(); }
  confetti($('reward-fx'));
}
function confetti(cv){
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const D = devicePixelRatio || 1, W = cv.width = innerWidth * D, H = cv.height = innerHeight * D, g = cv.getContext('2d');
  const col = ['#FF6B1A', '#ffcf3d', '#3BE08A', '#5CE1FF', '#ffffff'];
  let bits = Array.from({length: 130}, (_, i) => ({x: W / 2, y: H * .42, vx: (Math.random() - .5) * 20 * D, vy: (-6 - Math.random() * 15) * D,
    s: (3 + Math.random() * 6) * D, a: Math.random() * 6, c: col[i % col.length], t: 0}));
  const tick = () => { if (!cv.isConnected) return; g.clearRect(0, 0, W, H);
    bits = bits.filter(b => b.t < 150);
    bits.forEach(b => { b.t++; b.vy += .45 * D; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.a += .2;
      g.save(); g.translate(b.x, b.y); g.rotate(b.a); g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g.restore(); });
    if (bits.length) requestAnimationFrame(tick); };
  tick();
}

let playerObserver;
function watchPlayers(){
  if (playerObserver) playerObserver.disconnect();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const vids = document.querySelectorAll('#view video[data-auto]'); if (!vids.length) return;
  playerObserver = new IntersectionObserver(es => es.forEach(e => {
    if (e.intersectionRatio >= .6) e.target.play().catch(() => {}); else e.target.pause();
  }), {threshold: [0, .6]});
  vids.forEach(v => playerObserver.observe(v));
}
// Full-screen reels: tall phone clips fill the screen; wide clips show whole instead of being cropped
document.addEventListener('loadedmetadata', e => {
  const v = e.target; if (!(v.classList && v.classList.contains('fit')) || !v.videoWidth) return;
  v.style.objectFit = v.videoHeight >= v.videoWidth ? 'cover' : 'contain';
}, true);
// Fit each clip's frame to the video itself (between 4:5 tall and 16:9 wide), so there are no black bars.
document.addEventListener('loadedmetadata', e => {
  const v = e.target; if (!(v.classList && v.classList.contains('clip')) || !v.videoWidth) return;
  v.style.aspectRatio = String(Math.min(16 / 9, Math.max(4 / 5, v.videoWidth / v.videoHeight)));
  v.style.objectFit = 'cover';
}, true);
for (const [ev, on] of [['play', true], ['pause', false]])
  document.addEventListener(ev, e => { const p = e.target.closest && e.target.closest('.player'); if (p) p.classList.toggle('playing', on); }, true);
