  book(){
    const B = S.book;
    if (!B) return SKEL_PAGE;
    const mine = B.id === myId(), all = tricksFor(B.sport);
    const done = all.filter(t => B.landed.has(t.id));
    return `<button class="linkish back" data-act="book-back">← Back</button>
    <h2>${mine ? 'your' : '@' + esc(B.name) + '’s'} trick book</h2>
    <p class="sub">A trick pays full points the first time it's called landed, and each new grab on it adds a little more.</p>
    ${sportSwitch(B.sport, 'book-sport')}
    <div style="margin-top:14px;display:grid;gap:8px">
      <div class="row"><span class="disp" style="font-size:34px">${done.length} / ${all.length}</span><span class="hint">${SPORTS[B.sport].label} tricks landed</span></div>
      <div class="bar"><i style="width:${Math.max(3, done.length / all.length * 100)}%"></i></div>
    </div>
    <div style="margin-top:14px">${SPORTS[B.sport].cats.map(cat => {
      const list = tricksFor(B.sport, cat); if (!list.length) return '';
      const n = list.filter(t => B.landed.has(t.id)).length;
      return `<div style="margin-top:18px"><div class="book-cat"><span class="sec-h">${cat.toLowerCase()}</span><span class="ring" aria-label="${n} of ${list.length}"><i>${n}/${list.length}</i></span></div>
        ${list.map(t => {
          const got = B.landed.has(t.id);
          return `<div class="book-row ${got ? 'done' : ''}">
            <span class="check ${got ? 'on' : ''}" aria-label="${got ? 'Landed' : 'Not yet'}">${got ? '✓' : ''}</span>
            <div><b>${esc(t.name)}</b>${isTotd(t.id) ? ` <span class="pill totd">2× today</span>` : ''}<div class="hint mono">${t.pts} pts</div>${got ? `<div class="chips" style="margin-top:4px">${
              [...B.landed.get(t.id)].filter(g => g !== 'No grab').map(g => `<span class="chip">${esc(g)}</span>`).join('')}${
              mine ? `<span class="chip next">+${Math.round(t.pts * .2)} per new grab</span>` : ''}</div>` : ''}</div>
            <div style="display:flex;gap:6px">
              <button class="btn small" data-act="book-tip" data-id="${t.id}" aria-expanded="${S.bookTip === t.id}" aria-label="Tips for ${esc(t.name)}">${ic('bulb', 16)}</button>
              ${mine && !got ? `<button class="btn small primary" data-act="book-record" data-id="${t.id}">Film it</button>` : ''}</div>
          </div>${S.bookTip === t.id ? `<div class="tips"><div class="label">How to land it</div>
            <ul>${tipsFor(t).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}`;
        }).join('')}</div>`;
    }).join('')}</div>`;
  },

  // Me (A): your pass, 6 stats, your bag, then your clips as a contact sheet with STOMPED / BAILED stamps.
  // Someone else's page is the same, with add / challenge, and report / block on their pass.
  profile(){
    const P = S.profile;
    if (!P || !P.data) return SKEL_PAGE;
    const u = P.data, mine = u.id === myId(), L = P.landed || new Map();
    const verified = P.clips.filter(c => c.status === 'verified'), bailed = P.clips.filter(c => c.status === 'rejected');
    const fire = P.clips.reduce((n, c) => n + count(c.likes), 0);
    const f = S.friends.find(x => x.other && x.other.id === u.id), duel = !mine && activeDuelWith(u.id);
    const acts = mine ? `<button class="btn small" data-act="pass-photo">${passPhotoUrl(u) ? 'Change' : 'Add'} pass photo</button><button class="btn small" data-act="invite">${ic('send', 15)} Invite</button>`
      : (f && f.status === 'accepted' ? (duel ? `<button class="btn small" data-act="open-duel" data-id="${duel.id}">View duel</button>`
          : `<button class="btn small primary" data-act="challenge" data-id="${u.id}">Challenge</button>`)
        : f ? '<span class="pill wait">Request sent</span>' : `<button class="btn small primary" data-act="add-friend" data-id="${u.id}">+ Add friend</button>`)
        + `<button class="btn small" data-act="pass-menu" aria-expanded="${!!S.passMenu}">${ICON.more}<span class="sr">More</span></button>`;
    const passMenu = !mine && S.passMenu ? `<div class="card form" style="margin-top:8px">
        <button class="btn small" data-act="report-pass" data-id="${u.id}">Report this pass photo</button>
        <button class="btn small" data-act="block" data-id="${u.id}" data-name="${esc(u.username)}">Block @${esc(u.username)}</button>
        ${isFounder() && u.pass_photo ? `<button class="btn small bad" data-act="founder-photo" data-id="${u.id}">Founder: remove this photo</button>` : ''}
        <span class="hint">Blocking hides their clips and comments from you and ends your friendship.</span></div>` : '';
    const stats = mine
      ? [[verified.length, 'landed'], [bailed.length, 'bailed'], [S.myVotes.size, 'calls made'], [L.size, 'tricks in your bag'], [daysOnSnow(P.clips), 'days on snow'], [S.mtRank ? '#' + S.mtRank : '–', S.me.home_resort ? 'at ' + mtTab() : 'no mountain yet']]
      : [[verified.length, 'landed'], [bailed.length, 'bailed'], [L.size, 'tricks'], [fire, 'fire'], [daysOnSnow(P.clips), 'days on snow'], [u.rating, 'duel rating']];
    const bag = [...L.keys()].map(id => trickById(id)).sort((a, b) => a.pts - b.pts);
    const todo = mine ? nextPicks() : [];
    const cf = S.clipFilter || 'all', shown = cf === 'all' ? P.clips : P.clips.filter(c => c.status === cf);
    const fbtn = (k, l, n) => `<button class="${cf === k ? 'on' : ''}" data-act="clip-filter" data-k="${k}">${l} ${n}</button>`;
    return `${mine ? '' : '<button class="linkish back" data-act="back">← Back</button>'}
    <div class="me">
      ${mine ? '' : `<div class="row"><b style="font-size:18px">@${esc(u.username)}</b>${u.id === CREATOR_ID ? '<span class="pill">founder · rider #001</span>' : ''}</div>`}
      <div><div class="pass-wrap">${mine ? `<button class="pass-btn" data-act="pass-photo" aria-label="Change your pass photo">${passSVG(u, {pick: true})}</button>` : passSVG(u)}</div>
        <div class="pass-acts">${acts}</div>${passMenu}</div>
      ${P.trophies && P.trophies.length ? `<div><div class="label">last season</div><div class="trophy-row">${P.trophies.map(t =>
        passSVG({...u, points: t.points}, {tier: t.tier, season: t.season})).join('')}</div></div>` : ''}
      <div class="six">${stats.map(([v, l]) => `<div class="num"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
      <div class="bag"><div class="row"><span class="sec-h">${mine ? 'your bag' : 'their bag'}</span>
        <button class="linkish" data-act="book" data-id="${u.id}" data-name="${esc(u.username)}">trick book</button></div>
        <div class="chips">${bag.map(t => `<span class="chip">${esc(t.name)}</span>`).join('')}${todo.map(t => `<button class="chip todo" data-act="book-record" data-id="${t.id}" style="cursor:pointer">${esc(t.name)}</button>`).join('')}

// Judge like Tinder: drag a clip right for Landed, left for Bailed. Up and down still scroll to the next clip.
{
  let sw = null;
  document.addEventListener('pointerdown', e => {
    const it = e.target.closest && e.target.closest('.reel-item.judging[data-id]');
    if (!it || e.target.closest('button') || it.dataset.id in S.judge.voted || S.judge.reasonFor) return;
    sw = {it, x: e.clientX, y: e.clientY, dx: 0, on: false};
  });
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on){
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }   // that's a scroll, not a swipe
      if (Math.abs(dx) < 12) return;
      sw.on = true;
    }
    sw.dx = dx;
    sw.it.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    sw.it.style.setProperty('--yes', Math.max(0, Math.min(1, dx / 110)));
    sw.it.style.setProperty('--no', Math.max(0, Math.min(1, -dx / 110)));
  });
  const end = () => {
    if (!sw) return;
    const {it, dx, on} = sw; sw = null;
    if (!on) return;
    it.style.transition = 'transform .22s ease-out'; it.style.transform = '';
    it.style.setProperty('--yes', 0); it.style.setProperty('--no', 0);
    setTimeout(() => { it.style.transition = ''; }, 240);
    if (Math.abs(dx) > 100) vote(it.dataset.id, dx > 0, null);   // far enough = it counts
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}
let reelObserver;
function watchReel(){
  if (reelObserver) reelObserver.disconnect();
  const reel = $('reel'); if (!reel) return;
  // Play the clip that's on screen; pause the rest.
  reelObserver = new IntersectionObserver(entries => {
    for (const e of entries){
      const v = e.target.querySelector('video'); if (!v) continue;
      if (e.isIntersecting && e.intersectionRatio > .6) v.play().catch(() => {}); else v.pause();
      if (e.isIntersecting && e.target.dataset.near) feedMore();
    }
  }, {root: reel, threshold: [0, .6, 1]});
  const items = [...reel.querySelectorAll('.reel-item')];
  items.slice(-3).forEach(el => { el.dataset.near = 1; });   // 3 clips from the end: fetch the next page so the scroll never stops
  items.forEach(el => reelObserver.observe(el));
}

function pickMime(){
  const options = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return options.find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function openCamera(){
  const R = S.rec;
  try {
    stopStream();
    R.stream = await navigator.mediaDevices.getUserMedia({
      // 60 fps when the phone allows it: twice the frames means the trick AI loses the rider less.
      // Phones that can't do 60 quietly fall back to 30.
      video: {facingMode: {ideal: R.facing}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 60}}, audio: false});
    R.mode = 'live'; render(true);
  } catch (err){
    toast(err.name === 'NotAllowedError' ? 'Camera blocked. Allow camera access in your browser settings.' : 'Camera error: ' + err.message, 5000);
  }
}
function attachStream(){ const v = $('rec-live'); if (v && S.rec.stream){ v.srcObject = S.rec.stream; v.play().catch(() => {}); } }
function stopStream(){ const R = S.rec; if (R.stream){ R.stream.getTracks().forEach(t => t.stop()); R.stream = null; } }
// ---------- motion log ----------
// While recording, log the phone's spin rate (gyroscope) and acceleration, for the trick AI.
// Filmed on a selfie stick, the phone spins with the rider, so the gyro measures the trick itself;
// filmed by a friend, it records how the camera moved. Either way the video is unchanged, and
// phones without sensors (or that say no) simply post without a motion file.
const motion = {
  rows: [], t0: 0, on: false,
  // iPhones ask permission once, and only from a tap, so this runs on the record button.
  async allowed(){
    if (typeof DeviceMotionEvent === 'undefined') return false;
    if (typeof DeviceMotionEvent.requestPermission !== 'function') return true;
    try { return (await DeviceMotionEvent.requestPermission()) === 'granted'; } catch (e){ return false; }
  },
  onEvent(e){
    const r = e.rotationRate, a = e.accelerationIncludingGravity;
    if (!r || !a || r.alpha == null || a.x == null) return;
    const f = v => Math.round(v * 10) / 10;
    motion.rows.push([Math.round(performance.now() - motion.t0), f(r.alpha), f(r.beta), f(r.gamma), f(a.x), f(a.y), f(a.z)]);
  },
  start(){ this.rows = []; this.t0 = performance.now(); this.on = true; window.addEventListener('devicemotion', this.onEvent); },
  // Returns the log, or null when the phone sent too little to be worth keeping.
  stop(){
    if (!this.on) return null;
    this.on = false; window.removeEventListener('devicemotion', this.onEvent);
    if (this.rows.length < 20) return null;
    return {v: 1, cols: ['ms', 'rot_alpha', 'rot_beta', 'rot_gamma', 'acc_x', 'acc_y', 'acc_z'],
      units: 'deg/s, m/s² (acc includes gravity)', facing: S.rec.facing,
      orientation: (screen.orientation && screen.orientation.angle) || 0, rows: this.rows};
  },
};

async function startRecording(){
  const R = S.rec, mime = pickMime();
  if (!R.stream || R.starting) return;
  logEvent('record_start');
  R.starting = true; R.useMotion = R.useMotion != null ? R.useMotion : await motion.allowed(); R.starting = false;
  if (!R.stream) return;
  R.chunks = []; R.motion = null;
  // 1.5 Mbit/s keeps a 20 s clip near 4 MB (the free database holds about 1 GB of video) and is still sharp at 720p.
  // Set the bitrate even when no type matched, or some phones pick 5+ Mbit/s on their own.
  R.recorder = new MediaRecorder(R.stream, {videoBitsPerSecond: 1500000, ...(mime ? {mimeType: mime} : {})});
  R.recorder.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.recorder.onstop = () => {
    const type = (R.recorder.mimeType || mime || 'video/webm').split(';')[0];
    R.blob = new Blob(R.chunks, {type});
    if (R.url) URL.revokeObjectURL(R.url);
    R.url = URL.createObjectURL(R.blob);
    R.motion = motion.stop();
    clearInterval(R.tick); clearTimeout(R.stopTimer);
    stopStream(); R.mode = 'review'; render(true);
  };
  R.recorder.start();   // one piece at the end: Safari has written broken MP4s when asked for small timed pieces
  if (R.useMotion) motion.start();
  R.startedAt = Date.now(); R.mode = 'recording';
  // Update just the button and timer, so the live preview keeps running
  const shutter = document.querySelector('.shutter'); shutter.classList.add('stop'); shutter.dataset.act = 'rec-stop';
  const timer = $('rec-timer'); timer.classList.add('live');
  R.tick = setInterval(() => { timer.textContent = `● ${((Date.now() - R.startedAt) / 1000).toFixed(1)}s / ${MAX_SECONDS}s`; }, 100);
  R.stopTimer = setTimeout(() => { if (R.recorder && R.recorder.state === 'recording') R.recorder.stop(); }, MAX_SECONDS * 1000);
}
function resetRecorder(keepContext){
  const R = S.rec;
  if (R.recorder && R.recorder.state === 'recording'){ R.recorder.onstop = null; R.recorder.stop(); }
  clearInterval(R.tick); clearTimeout(R.stopTimer); stopStream(); motion.stop();
  if (R.url) URL.revokeObjectURL(R.url);
  Object.assign(R, {mode: 'idle', recorder: null, chunks: [], blob: null, url: null, motion: null});
  if (!keepContext) R.context = null;
}

// ---------- offline outbox ----------
// No signal on the hill? Clips wait on the phone (in IndexedDB, the browser's own storage)
// and upload by themselves when the connection comes back.
const outbox = {
  _db: null,
  open(){
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('sendit', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('outbox', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async run(mode, fn){
    const dbh = await this.open();
    return new Promise((res, rej) => {
      const tx = dbh.transaction('outbox', mode), req = fn(tx.objectStore('outbox'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  },
  add(item){ return this.run('readwrite', s => s.put(item)); },
  all(){ return this.run('readonly', s => s.getAll()); },
  remove(id){ return this.run('readwrite', s => s.delete(id)); },
};
const looksOffline = err => !navigator.onLine || /fetch|network|load failed|timed? ?out/i.test(String(err && err.message));
async function queueClip(item){
  await outbox.add({id: crypto.randomUUID(), recordedAt: new Date().toISOString(), ...item});
  await updateOutboxChip();
}
async function updateOutboxChip(){
  let n = 0; try { n = (await outbox.all()).length; } catch (e) {}
  const chip = $('outbox-chip'); if (!chip) return;
  chip.hidden = !n || !S.me; chip.textContent = `📤 ${n} waiting`;
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !navigator.onLine || !S.me) return;
  flushing = true;
  let sent = 0;
  try {
    for (const it of await outbox.all()){
      try {
        const clipId = await uploadClip(it.fields, it.blob, it.motion);
        if (it.kind === 'duel') await duelMove(it.duelId, true, it.trick, clipId);
        await outbox.remove(it.id); sent++;
      } catch (err){
        if (looksOffline(err)) break;                 // still no signal: try again later
        await outbox.remove(it.id);                   // a real error (e.g. duel moved on): don't retry forever
        toast(`Couldn't upload a saved clip: ${err.message}`, 5000);
      }
    }
  } catch (e) { /* storage unavailable (private browsing) */ }
  flushing = false;
  await updateOutboxChip();
  if (sent){ toast(`📤 Uploaded ${sent} saved clip${sent > 1 ? 's' : ''}`); await refresh(); }
}
window.addEventListener('online', () => flushOutbox());

const motionPath = videoPath => videoPath.replace(/\.[^./]+$/, '.motion.json');
// Upload the recorded video and create the clip. Returns the new clip's id.
async function uploadClip(fields, blob = S.rec.blob, mot = S.rec.motion){
  if (!blob || !blob.size) throw new Error('Nothing recorded');
  if (blob.size > MAX_MB * 1024 * 1024) throw new Error(`Video is over ${MAX_MB} MB. Record a shorter clip.`);
  const type = blob.type || 'video/webm';
  const ext = type.includes('mp4') ? 'mp4' : type.includes('quicktime') ? 'mov' : 'webm';
  const path = `${myId()}/${crypto.randomUUID()}.${ext}`;  // must start with my user id (storage rule)
  const up = await db.storage.from('clips').upload(path, blob, {contentType: type});
  if (up.error) throw up.error;
  const {rider, ...cols} = fields;
  const ins = rider   // filmed a friend: the database checks you're friends and files it under them (017)
    ? await db.rpc('post_for_friend', {p_rider: rider, p_trick: cols.trick_id, p_grab: cols.grab, p_resort: cols.resort,
                                       p_video_path: path, p_combo: cols.combo || []}).then(r => ({...r, data: r.data && {id: r.data}}))
    : await db.from('clips').insert({...cols, video_path: path}).select('id').single();
  if (ins.error){ await db.storage.from('clips').remove([path]); throw ins.error; }
  // The motion log sits next to the video (abc.mp4 -> abc.motion.json). Best effort: storage
  // refuses JSON until supabase/015_motion.sql has run, and the clip is already posted either way.
  if (mot) await db.storage.from('clips').upload(motionPath(path),
    new Blob([JSON.stringify(mot)], {type: 'application/json'}), {contentType: 'application/json'}).catch(() => {});
  runTrickAI(ins.data.id, blob, trickById(cols.trick_id));   // in the background: the clip is already posted
  logEvent('clip_posted', rider ? 'for_friend' : trickById(cols.trick_id).category);
  return ins.data.id;
}

// ---------- trick AI (runs on the filming phone) ----------
// A JavaScript copy of the laptop AI in sendit-ai/src (spin.py v0.1, spin3d.py v0.5, landed.py v2, verdict.py).
// Input: world = one entry per video frame, each 33 body points [x, y, z] in metres from MediaPipe (null = rider not found).
// It only says a spin when two different counters agree, and says "can't tell" instead of guessing.
const TrickAI = (() => {
  const LS = 11, RS = 12, LH = 23, RH = 24, D = 180 / Math.PI;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const norm = a => Math.hypot(a[0], a[1], a[2]);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const wrap = t => ((t + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  const median = xs => { const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  // 3x3 matrices as rows. R @ S.T
  const mulT = (R, S) => R.map(r => S.map(s => dot(r, s)));
  const ok = p => p && [LS, RS, LH, RH].every(i => p[i] && p[i].every(Number.isFinite));

  // The body's own compass each frame: columns across (left->right), up (hips->shoulders), facing
  function bodyFrames(world){
    return world.map(p => {
      if (!ok(p)) return null;
      const across = add(sub(p[RS], p[LS]), sub(p[RH], p[LH]));
      const up = sub(mul(add(p[LS], p[RS]), .5), mul(add(p[LH], p[RH]), .5));
      const x = mul(across, 1 / (norm(across) || 1));
      let u = sub(up, mul(x, dot(up, x))); const n = norm(u);
      if (n < 1e-6) return null;
      u = mul(u, 1 / n); const f = cross(x, u);
      return [[x[0], u[0], f[0]], [x[1], u[1], f[1]], [x[2], u[2], f[2]]];
    });
  }
  function rotationVector(R){
    const angle = Math.acos(Math.min(1, Math.max(-1, (R[0][0] + R[1][1] + R[2][2] - 1) / 2)));
    if (angle < 1e-6) return [0, 0, 0];
    if (Math.PI - angle < 1e-3){
      const ax = [0, 1, 2].map(i => Math.sqrt(Math.max(0, (R[i][i] + 1) / 2)));
      return mul(ax, angle / (norm(ax) || 1));
    }
    const s = 2 * Math.sin(angle);
    return mul([(R[2][1] - R[1][2]) / s, (R[0][2] - R[2][0]) / s, (R[1][0] - R[0][1]) / s], angle);
  }
  function quaternion(R){
    const w = Math.sqrt(Math.max(0, 1 + R[0][0] + R[1][1] + R[2][2])) / 2;
    const x = Math.sign(R[2][1] - R[1][2] || 1) * Math.sqrt(Math.max(0, 1 + R[0][0] - R[1][1] - R[2][2])) / 2;
    const y = Math.sign(R[0][2] - R[2][0] || 1) * Math.sqrt(Math.max(0, 1 - R[0][0] + R[1][1] - R[2][2])) / 2;
    const z = Math.sign(R[1][0] - R[0][1] || 1) * Math.sqrt(Math.max(0, 1 - R[0][0] - R[1][1] + R[2][2])) / 2;
    return [w, x, y, z];
  }
  // Main direction of a set of turn vectors (largest eigenvector of V^T V, by power iteration)
  function mainAxis(V){
    const M = [0, 1, 2].map(i => [0, 1, 2].map(j => V.reduce((s, v) => s + v[i] * v[j], 0)));
    let a = [1, 1, 1].map((v, i) => v + i * .1);
    for (let k = 0; k < 200; k++){ const b = M.map(r => dot(r, a)), n = norm(b); if (n < 1e-12) break; a = mul(b, 1 / n); }
    if (V.reduce((s, v) => s + dot(v, a), 0) < 0) a = mul(a, -1);
    return a;
  }
  // v0.5: twist around the 3D spin axis, relative to the first frame; short gaps filled at the rider's own speed
  function spinTwist(world, lag = 4, maxGap = 10, minSeen = .5){
    const frames = bodyFrames(world), idx = frames.map((R, i) => R ? i : -1).filter(i => i >= 0);
    if (idx.length < 3) return {deg: 0, tilt: NaN, axis: 'unknown', seen: idx.length / Math.max(1, frames.length), confident: false};
    let V = [];
    for (let k = 0; k + lag < idx.length; k++){
      const v = rotationVector(mulT(frames[idx[k + lag]], frames[idx[k]])); if (norm(v) > 10 / D) V.push(v);
    }
    if (V.length < 2) V = idx.slice(1).map((b, k) => rotationVector(mulT(frames[b], frames[idx[k]])));
    const axis = mainAxis(V), R0 = frames[idx[0]];
    const tw = idx.map(i => { const q = quaternion(mulT(frames[i], R0)); return wrap(2 * Math.atan2(dot(q.slice(1), axis), q[0])); });
    const gaps = idx.slice(1).map((b, k) => b - idx[k]), deltas = tw.slice(1).map((t, k) => wrap(t - tw[k]));
    let total = 0;
    gaps.forEach((g, i) => {
      let d = deltas[i];
      if (g > 1 && g <= maxGap){
        const near = []; for (let j = Math.max(0, i - 4); j < Math.min(deltas.length, i + 5); j++) if (j !== i && gaps[j] === 1) near.push(deltas[j]);
        if (near.length){ const want = median(near) * g; let best = d;
          for (let t = -3; t <= 3; t++){ const c = d + 2 * Math.PI * t; if (Math.abs(c - want) < Math.abs(best - want)) best = c; } d = best; }
      }
      total += d;
    });
    const tilt = Math.acos(Math.min(1, Math.abs(axis[1]))) * D, seen = idx.length / frames.length;
    return {deg: total * D, tilt, axis: tilt < 25 ? 'flat' : tilt < 65 ? 'off-axis' : 'flip', seen,
            confident: seen >= minSeen && Math.max(...gaps) <= maxGap * 2};
  }
  // v0.1: the shoulder + hip line seen from above, unwrapped
  function flatTotal(world){
    const a = world.filter(ok).map(p => { const c = add(sub(p[RS], p[LS]), sub(p[RH], p[LH])); return Math.atan2(c[2], c[0]); });
    let t = 0; for (let i = 1; i < a.length; i++) t += wrap(a[i] - a[i - 1]);
    return t * D;
  }
  const nearest = d => Math.round(Math.abs(d) / 180) * 180;
  // landed.py v2: riding away leaned much more than riding in = fell
  function landed(world, tail = .3, extra = 15, head = .25){
    const lean = world.map(p => { if (!ok(p)) return NaN;
      const t = sub(mul(add(p[LS], p[RS]), .5), mul(add(p[LH], p[RH]), .5)); return Math.atan2(Math.hypot(t[0], t[2]), -t[1]) * D; });
    const n = lean.length, startAll = lean.slice(0, Math.max(3, Math.floor(n * head))), endAll = lean.slice(Math.floor(n * (1 - tail)));
    const s = startAll.filter(Number.isFinite), e = endAll.filter(Number.isFinite);
    if (s.length < 2 || e.length < 3) return {landed: null, sure: 0};
    const diff = median(e) - median(s);
    return {landed: diff < extra, sure: +(Math.min(1, Math.abs(diff - extra) / 30) * e.length / Math.max(1, endAll.length)).toFixed(2), diff};
  }
  // The one answer the app shows. category 'Rails' -> the AI stays out of it.
  function judge(world, category){
    if (category === 'Rails') return null;
    const s = spinTwist(world), v05 = Math.abs(s.deg), v01 = Math.abs(flatTotal(world)), L = landed(world);
    let spin = null, note = null;
    if (!s.confident) note = s.seen < .5 ? 'rider too small or out of frame' : 'lost the rider mid-air';
    else if (nearest(v05) !== nearest(v01)) note = 'spin unclear from this angle';
    else spin = Math.min(2160, nearest(v05));
    // "both counters agree" was right 67-75% of the time on Connor's labels, so that's the most it claims
    const parts = [spin != null ? .7 * s.seen : null, L.landed != null ? L.sure : null].filter(x => x != null);
    const sure = parts.length ? +(parts.reduce((a, b) => a + b, 0) / parts.length).toFixed(2) : 0;
    if (spin == null && L.landed == null) note = note || "couldn't see the rider";
    return {spin, axis: spin != null && s.axis !== 'unknown' ? s.axis : null, landed: L.landed, sure, note,
            seen: +s.seen.toFixed(2), raw: {v05: Math.round(v05), v01: Math.round(v01), tilt: Math.round(s.tilt)}};
  }
  return {judge, spinTwist, flatTotal, landed, nearest};
})();

// Body points from the recorded video, on the phone. MediaPipe's pose model (same one the laptop AI uses)
// loads the first time it's needed (~9 MB, then cached). 15 frames a second is enough for spins up to ~1440.
const AI_LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const AI_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
let poseP = null, poseClock = 0;   // the model wants ever-increasing timestamps, across clips too
function poseFinder(){
  const make = async delegate => { const v = await import(AI_LIB + '/vision_bundle.mjs'), fs = await v.FilesetResolver.forVisionTasks(AI_LIB + '/wasm');
    return v.PoseLandmarker.createFromOptions(fs, {baseOptions: {modelAssetPath: AI_MODEL, delegate}, runningMode: 'VIDEO', numPoses: 1}); };
  return poseP || (poseP = make('GPU').catch(() => make('CPU')).catch(e => { poseP = null; throw e; }));
}
async function poseFromVideo(blob, fps = 15, maxFrames = 330){
  const finder = await poseFinder(), url = URL.createObjectURL(blob), v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  const once = ev => new Promise((ok, no) => { v.addEventListener(ev, ok, {once: true}); v.addEventListener('error', no, {once: true}); });
  try {
    await once('loadeddata');
    if (!isFinite(v.duration)){ v.currentTime = 1e6; await once('seeked'); }   // recorded WebM has no length until you seek to the end
    const dur = Math.min(v.duration || 0, MAX_SECONDS + 1), world = [];
    for (let i = 0, t = 0; t < dur && i < maxFrames; i++, t = i / fps){
      v.currentTime = t; await once('seeked');
      const r = finder.detectForVideo(v, poseClock += 1 + Math.round(1000 / fps));
      world.push(r.worldLandmarks && r.worldLandmarks[0] ? r.worldLandmarks[0].map(p => [p.x, p.y, p.z]) : null);
      await new Promise(ok => setTimeout(ok));     // let the app breathe between frames
    }
    return world;
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); }
}
// After a clip posts: look at it and save ONE guess (022), quietly. Riders never see it: it's only compared with
// how the clip gets judged, on rider #001's AI scorecard. Never blocks posting, never changes votes or points.
async function runTrickAI(clipId, blob, trick){
  if (!blob || !trick || trick.category === 'Rails' || !db) return;
  try {
    const g = TrickAI.judge(await poseFromVideo(blob), trick.category); if (!g) return;
    const row = {clip_id: clipId, spin: g.spin, axis: g.axis, landed: g.landed, sure: g.sure, note: g.note, seen: g.seen, ver: 'web-0.5'};
    const r = await db.from('clip_ai').insert(row);   // fails quietly until supabase/022 is pasted
  } catch (e) { console.warn('trick AI skipped:', e && e.message); }
}

// Rank-up (BRAND-DECISIONS.md): the pass taps the reader, the gate light goes green with the beep, then the SAME pass
// turns into the next tier as a scan line sweeps across it. No new card. The first green pass starts from a blank one.
// First tap skips to the end; the button closes it.
function showRankUp(r, from = null){
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches, me = S.me;
  const oldKey = from && from.tier.key !== r.tier.key ? from.tier.key : null;
  const old = oldKey ? passSVG(me, {tier: oldKey, cls: 'g-old'}) : passSVG({...me, points: 0}, {tier: 'green', cls: 'g-old', photo: ''}).replace('class="pass g-old', 'style="filter:grayscale(1) brightness(1.5)" class="pass g-old');
  $('overlay').innerHTML = `<div class="gate" id="splash" data-act="rankup-tap" role="dialog" aria-label="${oldKey ? 'Rank up' : 'Your pass'}: ${esc(r.label)}">
    <div class="g-word" id="g-word">${oldKey ? 'tap in.' : 'your pass.'}</div>
    <div class="g-card">${old}${passSVG(me, {cls: 'g-new'})}<span class="g-scan"></span></div>
    <div class="g-reader" aria-hidden="true"><span class="g-light"></span></div>
    <div class="g-sub" id="g-sub">&nbsp;</div>
    <button class="btn primary g-go ru-go" data-act="close-splash" id="g-go" hidden>let's go</button>
  </div>`;
  loadGate();
  const el = $('splash'), at = (ms, fn) => setTimeout(() => { if ($('splash') === el && !el.classList.contains('done')) fn(); }, still ? 0 : ms);
  const finish = () => {
    el.classList.remove('step1'); el.classList.add('lit', 'step2', 'done');
    $('g-word').textContent = oldKey ? `${r.label}.` : `${r.label}. you're in.`;
    $('g-sub').textContent = r.nextLabel ? `${r.toNext} pts to ${r.nextLabel}` : 'top of the mountain';
    $('g-go').hidden = false;
  };
  el._finish = finish;
  if (still){ el.classList.add('lit'); sfx('gate'); return finish(); }
  at(450, () => el.classList.add('step1'));                                  // the pass dips to the reader
  at(900, () => { el.classList.add('lit'); sfx('gate'); buzz([30, 40, 90]); });   // beep, green light
  at(1150, () => { el.classList.remove('step1'); el.classList.add('step2'); }); // scan line turns it into the next tier
  at(2150, finish);
}

const VOTE_WAIT = 3000, pendingVotes = {};   // clipId -> {timer, send}
async function vote(clipId, landed, reason){
  const J = S.judge;
  // Celebrate first, save second: the stamp shows on the tap, then the vote waits a few seconds so Undo can take it back
  J.voted[clipId] = landed; J.reasonFor = null;
  logEvent('vote', landed ? 'landed' : reason || 'bailed');
  refreshReelItem(clipId);
  if (navigator.vibrate) navigator.vibrate(landed ? [15, 50, 25] : 60);   // Android buzz; iPhones ignore it
  sfx(landed ? 'landed' : 'bailed');
  const send = async () => {
    delete pendingVotes[clipId];
    const r = await db.from('votes').insert({clip_id: clipId, landed, reason: reason || null});
    if (r.error){ delete J.voted[clipId]; toast('Vote failed: ' + r.error.message); refreshReelItem(clipId); return; }
    J.count++;
    S.myVotes.add(clipId);
    if (S.firstRun){ if (J.count >= S.firstRun.need) setTimeout(firstPass, 900); return; }
    maybeBreak();
    loadAll().then(() => render()).catch(() => {});  // update badges quietly
  };
  pendingVotes[clipId] = {timer: setTimeout(send, VOTE_WAIT), send};
  toastUndo(landed ? 'Voted Landed' : 'Voted Bailed', () => undoVote(clipId), VOTE_WAIT);
  setTimeout(() => nextReel(clipId), 1000);   // long enough to see the stamp land
  setTimeout(() => {   // then it becomes a normal clip (name, fire, comments) you can scroll back to
    if (!(clipId in J.voted)) return;   // undone
    delete J.voted[clipId];
    const el = $('reel-' + clipId), c = findClip(clipId);
    if (el && c && S.tab === 'feed' && S.feed.mode === 'clips'){ el.outerHTML = feedItem(c); const f = $('clip-' + clipId); if (f && reelObserver) reelObserver.observe(f); }
  }, 1700);
}
// Undo inside VOTE_WAIT: nothing was saved, so put the clip back to "judge this" and scroll to it
function undoVote(clipId){
  const p = pendingVotes[clipId]; if (!p) return;
  clearTimeout(p.timer); delete pendingVotes[clipId]; delete S.judge.voted[clipId];
  const el = $('reel-' + clipId) || $('clip-' + clipId), c = findClip(clipId);
  if (!el || !c) return;
  el.outerHTML = reelItem(c);
  const fresh = $('reel-' + clipId); if (reelObserver) reelObserver.observe(fresh);
  fresh.scrollIntoView({behavior: 'smooth'});
}
// Leaving the app mid-wait still saves the vote
const flushVotes = () => Object.values(pendingVotes).forEach(p => { clearTimeout(p.timer); p.send(); });
addEventListener('pagehide', flushVotes);

// Update one clip's fire + comment buttons and its comment box in place. render() rebuilds the whole page,
// every video included, and that reload is what made tapping fire or comments feel laggy.
function patchClip(id, {keepText = true} = {}){
  const c = findClip(id), liked = S.myLikes.has(id), open = S.openComments === id;
  document.querySelectorAll(`[data-act="like"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle('lit', liked); b.setAttribute('aria-pressed', liked);
    b.innerHTML = ICON.fire + (c ? count(c.likes) : 0);

  document.querySelectorAll(`[data-act="comments"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle('lit', open); b.setAttribute('aria-expanded', open);
    b.innerHTML = ICON.chat + (c ? count(c.comments) : 0);
  });
  document.querySelectorAll(`article[id="clip-${id}"]`).forEach(card => {
    const old = card.querySelector(':scope > .comments');
    if (!open){ if (old) old.remove(); return; }
    const tmp = document.createElement('div'); tmp.innerHTML = commentsPanel(id);
    const panel = tmp.firstElementChild, typed = old && old.querySelector('input');
    if (keepText && typed && typed.value) panel.querySelector('input').value = typed.value;
    if (old) old.replaceWith(panel); else { panel.classList.add('opening'); card.appendChild(panel); }
  });
}

// Crop to the pass's photo window (76 × 96), shrink, JPEG: about 40 KB
async function passPhotoBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error("That photo didn't open. Try another one.")); i.src = url; });
    const W = 304, H = 384, k = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = W / k, h = H / k;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, (img.naturalWidth - w) / 2, (img.naturalHeight - h) / 2, w, h, 0, 0, W, H);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .85));
  } finally { URL.revokeObjectURL(url); }
}
async function setPassPhoto(file){
  if (!file) return;
  toast('Putting it on your pass…');
  let blob; try { blob = await passPhotoBlob(file); } catch (err){ toast(err.message); return; }

  try {
    const up = await db.storage.from('passes').upload(path, blob, {contentType: 'image/jpeg'}); if (up.error) throw up.error;
    const r = await db.from('profiles').update({pass_photo: path, pass_photo_at: new Date().toISOString()}).eq('id', myId());
    if (r.error){ await db.storage.from('passes').remove([path]); throw r.error; }

async function submitPost(){
  const fields = {trick_id: $('post-trick').value, grab: $('post-grab').value, resort: $('post-resort').value};
  if (S.postCombo.length) fields.combo = [...S.postCombo];   // only sent for combos, so plain posts work without 014
  const rider = S.postRider && acceptedFriends().map(f => f.other).find(p => p && p.id === S.postRider);
  if (rider) fields.rider = rider.id;
  const blob = S.rec.blob, mot = S.rec.motion;
  S.busy = true; const b = $('post-btn'); b.disabled = true; b.textContent = 'Uploading…';
  try {
    if (!navigator.onLine) throw new Error('offline');
    await uploadClip(fields, blob);
    resetRecorder(); S.postCombo = []; offerSave(blob, fields.trick_id);
    if (rider){   // stay on the camera: you're probably filming the next run too
      toast(`Sent to @${rider.username}. It shows up once they tap Keep.`, 4000);
      render(true); return;
    }
    toast('Posted. Riders are judging it now.');
    S.tab = 'feed'; S.feed.mode = 'clips'; await refresh(true); window.scrollTo(0, 0);
  } catch (err){
    if (looksOffline(err) && blob){
      try {
        await queueClip({kind: 'post', fields, blob, motion: mot});
        resetRecorder(); S.postCombo = []; S.tab = 'feed'; S.feed.mode = 'clips'; render(true); window.scrollTo(0, 0); offerSave(blob, fields.trick_id);
        toast("No signal. Saved on your phone, and it uploads when you're back online.", 5000);
        return;
      } catch (e) { /* couldn't save it either: fall through to the error */ }
    }
    console.error(err); toast('Post failed: ' + err.message, 5000);
    b.disabled = false; b.textContent = 'Post';
  } finally { S.busy = false; }
}

// ----- friends & duels -----
async function addFriend(id){
  const r = await db.from('friendships').insert({addressee: id});
  if (!r.error) logEvent('friend_add');
  if (r.error) toast(/duplicate|unique/i.test(r.error.message) ? 'You two are already connected' : 'Could not add: ' + r.error.message);
  else toast('Friend request sent');
  await refresh(true);
}
async function acceptFriend(id){
  const r = await db.from('friendships').update({status: 'accepted'}).eq('requester', id).eq('addressee', myId());
  if (r.error) toast('Could not accept: ' + r.error.message); else toast('You\'re friends now. Challenge them!');
  await refresh(true);
}
async function removeFriend(id){
  const f = S.friends.find(x => x.other && x.other.id === id); if (!f) return;
  const r = await db.from('friendships').delete().eq('requester', f.requester).eq('addressee', f.addressee);
  if (r.error) toast('Could not remove: ' + r.error.message);
  await refresh(true);
}
async function challenge(id){
  const r = await db.rpc('start_duel', {p_opponent: id});
  if (r.error){ toast(r.error.message); return; }
  S.tab = 'duels'; S.duelTrick = null; S.duelSport = null;
  await refresh(true);
  await openDuel(r.data);
  toast('Duel on! You set first.');
}
async function openDuel(id){
  if (S.tab === 'record') resetRecorder();
  S.tab = 'duels'; S.duelId = id; S.watchMove = null;
  render(true); window.scrollTo(0, 0);
  try { await loadDuelMoves(id); } catch (err){ toast(err.message); }
  render(true);
}
async function duelMove(duelId, landed, trickId, clipId){
  const r = await db.rpc('duel_move', {p_duel: duelId, p_landed: landed, p_trick: trickId || null, p_clip: clipId || null});
  if (r.error){ toast(r.error.message, 5000); return false; }
  return true;
}
function startDuelRecording(kind){
  const d = S.duels.find(x => x.id === S.duelId); if (!d) return;
  const trickId = kind === 'set' ? $('duel-trick').value : d.trick_id;
  resetRecorder();
  S.rec.context = {duelId: d.id, kind, trickId, otherName: d.other.username};
  S.tab = 'record'; render(true); window.scrollTo(0, 0);
}
async function sendDuelClip(){
  const ctx = S.rec.context, b = $('duel-send');
  const fields = {trick_id: ctx.trickId, grab: 'No grab', resort: S.me.home_resort || RESORTS[0]}, blob = S.rec.blob, mot = S.rec.motion;
  S.busy = true; b.disabled = true; b.textContent = 'Uploading…';
  try {
    if (!navigator.onLine) throw new Error('offline');
    const clipId = await uploadClip(fields, blob);
    if (await duelMove(ctx.duelId, true, ctx.kind === 'set' ? ctx.trickId : null, clipId)){
      toast(ctx.kind === 'set' ? `Sent! ${ctx.otherName} has to match it.` : 'Matched! Their turn to set.');
      resetRecorder(); await refresh(true); await openDuel(ctx.duelId);
    } else { b.disabled = false; b.textContent = 'Landed: send it'; }
  } catch (err){
    if (looksOffline(err) && blob){
      try {
        await queueClip({kind: 'duel', fields, blob, motion: mot, duelId: ctx.duelId, trick: ctx.kind === 'set' ? ctx.trickId : null});
        const dId = ctx.duelId; resetRecorder(); await openDuel(dId);
        toast("No signal. Your attempt is saved and sends when you're back online.", 5000);
        return;
      } catch (e) { /* fall through */ }
    }
    toast('Upload failed: ' + err.message, 5000); b.disabled = false; b.textContent = 'Landed: send it';
  } finally { S.busy = false; }
}
async function bail(){
  const d = S.duels.find(x => x.id === S.duelId); if (!d) return;
  const trick = d.phase === 'set' ? ($('duel-trick') || {}).value : null;
  if (await duelMove(d.id, false, trick, null)){
    toast(d.phase === 'set' ? 'Bailed. Their turn to set.' : 'Letter taken. Shake it off.');
    await refresh(true);
  }
}

async function submitAuth(){
  const email = $('auth-email').value.trim(), password = $('auth-pass').value;
  const username = $('auth-user') ? $('auth-user').value.trim() : '';
  if (S.authMode === 'signup' && !/^[A-Za-z0-9_.-]{3,24}$/.test(username)){
    toast('Username: 3–24 letters, numbers, _ . or -'); return;
  }
  // Only disable the button. Calling render() here would rebuild the form and empty its boxes.
  const btn = document.querySelector('#auth-form button[type=submit]');
  S.busy = true; btn.disabled = true;
  try {
    if (S.authMode === 'signup'){
      if (!S.signupMt){ toast('Pick your home mountain (or other).'); return; }
      const taken = await db.from('profiles').select('id').eq('username', username).maybeSingle();
      if (taken.data){ toast('That username is taken. Try another.'); return; }
      // The confirmation email links back to wherever this page is running (laptop or online)
      const r = await db.auth.signUp({email, password,
        options: {data: {username, src: store.get('signup-src', '') || null}, emailRedirectTo: location.origin + location.pathname}});
      if (r.error) throw r.error;
      store.set('signup-mt', S.signupMt);
      if (!r.data.session){
        S.authMode = 'signin'; render();
        $('auth-email').value = email;
        toast('Check your email and click the confirmation link, then sign in here.', 8000);
      }
    } else {
      const r = await db.auth.signInWithPassword({email, password});
      if (r.error) throw r.error;
    }
  } catch (err){
    const msg = /not confirmed/i.test(err.message) ? 'Confirm your email first (check your inbox).'
      : /invalid login/i.test(err.message) ? 'Wrong email or password.'
      : err.message;
    toast(msg, 5000);
  } finally {
    S.busy = false;
    const b = document.querySelector('#auth-form button[type=submit]'); if (b) b.disabled = false;
  }
}

// Forgot password: Supabase emails a link back to this page, which then fires PASSWORD_RECOVERY.
// Same message either way, so nobody can use this to find out who has an account.
async function sendReset(b){
  const email = $('auth-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)){ toast('Type your email above, then tap Forgot password.'); $('auth-email').focus(); return; }
  b.disabled = true;
  const r = await db.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  b.disabled = false;
  if (r.error && /rate|too many|seconds/i.test(r.error.message)){ toast('Too many reset emails right now. Try again in a few minutes.', 6000); return; }
  toast('If that email has an account, a reset link is on its way. Check spam too.', 8000);
}
function showNewPassword(){
  $('overlay').innerHTML = `<div class="modal"><form class="card form" id="newpass-form">
    <div class="rank-word t-plat" style="font-size:32px">New password</div>
    <div class="field"><label class="label" for="newpass">Pick a new password</label>
      <input id="newpass" type="password" autocomplete="new-password" required minlength="8">
      <span class="hint">At least 8 characters.</span></div>
    <button class="btn primary" type="submit">Save password</button>
  </form></div>`;
  setTimeout(() => { const f = $('newpass'); if (f) f.focus(); }, 50);
}
async function saveNewPassword(){
  const btn = document.querySelector('#newpass-form button[type=submit]');
  btn.disabled = true;
  const r = await db.auth.updateUser({password: $('newpass').value});
  if (r.error){ btn.disabled = false; toast(/different/i.test(r.error.message) ? 'Pick a password you haven\'t used here before.' : 'Couldn\'t save: ' + r.error.message, 6000); return; }
  $('overlay').innerHTML = '';
  toast('Password saved. You\'re signed in.', 5000);
}

    case 'forgot': return sendReset(b);
    case 'join': {
      S.authMode = b.dataset.mode; render(true);
      $('auth-top').scrollIntoView({behavior: 'smooth', block: 'start'});
      setTimeout(() => { const f = $('auth-user') || $('auth-email'); if (f) f.focus({preventScroll: true}); }, 450);
      return;
    }
    case 'close-splash': return closeSplash();
    case 'ob-sport': setRides(b.dataset.k); return S.me.home_resort ? finishOnboarding('') : onboardResort();
    case 'ob-resort': return finishOnboarding(b.dataset.k);
    case 'reward-collect': { sfx('collect'); $('overlay').innerHTML = ''; const r = S.rewardRankUp; S.rewardRankUp = null; if (r) showRankUp(r.to, r.from); return; }
    case 'rankup-tap': { const el = $('splash'); if (!el) return; if (el.classList.contains('done')) return closeSplash(); return el._finish && el._finish(); }
    case 'play': { const v = b.tagName === 'VIDEO' ? b : b.querySelector('video'); if (v) v.paused ? v.play().catch(() => {}) : v.pause(); return; }
    case 'flush': toast(navigator.onLine ? "Uploading saved clips…" : "Still no signal. They'll send automatically."); return flushOutbox();
    case 'close-modal': $('overlay').innerHTML = ''; return;
    case 'install-go': return installGo();
    case 'save-go': return saveGo(b);
    case 'share-ready': return shareReady();
    case 'save-later': return hideSave();
    case 'save-never': store.set('save-ask', 'off'); toast('Okay. Turn it back on in ⚙ settings.'); return hideSave();
    case 'install-later': store.set('install-later', String(Date.now() + 3 * 864e5)); return hideInstall();   // ask again in 3 days
    case 'judge-done': $('overlay').innerHTML = ''; return openTab('feed');
    // judging
    case 'askreason': { const was = S.judge.reasonFor; S.judge.reasonFor = id; refreshReelItem(was); return refreshReelItem(id); }
    case 'noreason': { const was = S.judge.reasonFor; S.judge.reasonFor = null; return refreshReelItem(was); }
    case 'vote': b.disabled = true; return vote(id, b.dataset.y === '1', b.dataset.reason);
    case 'skip': return nextReel(id);
    // feed
    case 'delete': return deleteClip(id);
    case 'give-clip': return giveClip(id, b.dataset.k);
    case 'share-card': return shareCard(id);
    case 'session-card': return sessionCard();
    case 'like': return toggleLike(id);
    case 'comments': return toggleComments(id);
    case 'delcomment': return deleteComment(id, b.dataset.clip);
    case 'profile': return openProfile(id);
    case 'me': S.passMenu = false; S.clipFilter = 'all'; return openProfile(myId());
    case 'pass-photo': return $('pass-file').click();
    case 'pass-photo-clear': return clearPassPhoto();
    case 'pass-menu': S.passMenu = !S.passMenu; return render(true);
    case 'report-pass': S.passMenu = false; return report({profile_id: id}, 'inappropriate');
    case 'block': return blockUser(id, b.dataset.name);
    case 'unblock': return unblockUser(id);
    case 'founder-clip': return founderRemoveClip(id);
    case 'founder-photo': return founderRemovePhoto(id);
    case 'founder-keep': return founderKeep(b.dataset.k, id);
    case 'reports-q': return loadReports();
    case 'share-video': return shareClipVideo(id);
    case 'clip-filter': S.clipFilter = b.dataset.k; return render(true);
    case 'feed-scope': S.feed.scope = b.dataset.k; store.set('feed-scope', S.feed.scope); render(true); { const r = $('reel'); if (r) r.scrollTop = 0; } return;
    case 'signup-mt': S.signupMt = b.dataset.k;
      document.querySelectorAll('[data-act="signup-mt"]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      return;
    case 'ach-all': S.achAll = true; return render(true);

      return render(true);

      const v = b.querySelector('video'); if (!v) return;

      return;
    }

      S.menuFor = S.menuFor === id ? null : id;
      const item = document.querySelector(`.feed-item[id="clip-${id}"]`);
      if (!item) return render(true);
      document.querySelectorAll('.feed-item > .clip-menu').forEach(m => m.remove());

    case 'filmed-keep': return answerFilmed(id, true);
    case 'filmed-all': S.filmedAll = true; return render();
    case 'filmed-nope': return answerFilmed(id, false);
    case 'feedback': S.feedbackOpen = !S.feedbackOpen; return render(true);
    case 'feedback-send': return sendFeedback(b);
    case 'delete-account': S.confirmDelete = !S.confirmDelete; return render(true);
    case 'delete-account-yes': return deleteAccount(b);

      S.feed.mode = b.dataset.k; if (b.dataset.k === 'judge') startJudge();
      render(true); return window.scrollTo(0, 0);

      S.sport = b.dataset.k; store.set('sport', S.sport);
      if (S.sports !== 'both'){ S.sports = S.sport; store.set('sports', S.sports); }   // a skier switching to snowboard now rides snowboard

    case 'cam-flip': if (S.rec.mode === 'recording') return; S.rec.facing = S.rec.facing === 'environment' ? 'user' : 'environment'; return openCamera();
    case 'cam-close': resetRecorder(true); return render(true);
    case 'rec-start': return startRecording();
    case 'rec-stop': if (S.rec.recorder && S.rec.recorder.state === 'recording') S.rec.recorder.stop(); return;

      if (await duelMove(ctx.duelId, false, ctx.kind === 'set' ? ctx.trickId : null, null)) toast('Logged as a bail.');

    case 'forfeit':
      if (!confirm('Forfeit this duel? You lose rating like a normal loss.')) return;
      { const r = await db.rpc('forfeit_duel', {p_duel: S.duelId}); if (r.error) toast(r.error.message); }
      return refresh(true);
  }
});
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (['post-cat','post-trick','post-grab'].includes(id)) syncPost();
  if (id === 'post-rider'){
    S.postRider = e.target.value;
    $('post-rider-hint').innerHTML = riderHint(acceptedFriends().map(f => f.other).find(p => p && p.id === S.postRider));
  }
  if (id === 'post-combo-add' && e.target.value){ S.postCombo.push(e.target.value); syncPost(); }
  if (id === 'duel-trick') S.duelTrick = e.target.value;
  if (id === 'save-pref'){ store.set('save-ask', e.target.value); toast('Saved'); }
  if (id === 'sound-pref'){ SFX.on = e.target.value === 'on'; store.set('sound', e.target.value); if (SFX.on) sfx('collect'); toast('Saved'); }
  if (id === 'ride-pref'){ setRides(e.target.value); toast('Saved'); render(true); }
  if (id === 'board-resort'){ S.board.resort = e.target.value; try { await loadBoard(); } catch (err){ toast(err.message); } render(true); }
  if (id === 'home-resort'){
    const r = await db.from('profiles').update({home_resort: e.target.value || null}).eq('id', myId());
    if (r.error) toast('Could not save: ' + r.error.message);
    else { toast('Home mountain saved'); await refresh(true); }
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'post-form' && !S.busy) submitPost();
  else if (f.id === 'auth-form' && !S.busy) submitAuth();
  else if (f.id === 'newpass-form') saveNewPassword();
  else if (f.classList.contains('comment-form')) sendComment(f.dataset.clip, f.querySelector('input'));
  else if (f.id === 'crew-join' && !S.busy){
    const code = $('crew-code').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(code)){ toast('Invite codes are 6 letters and numbers.'); return; }
    S.busy = true;
    const r = await db.rpc('join_crew', {p_code: code});
    S.busy = false;
    if (r.error){ toast(r.error.message); return; }
    S.crewPrefill = null; await loadCrew(); toast(`Welcome to ${S.crew.mine ? S.crew.mine.name : 'the crew'}!`); render(true);
  }
  else if (f.id === 'crew-create' && !S.busy){
    const name = $('crew-name').value.trim(), tag = $('crew-tag').value.trim().toUpperCase();
    if (name.length < 3){ toast('Crew names need at least 3 characters.'); return; }
    if (!/^[A-Z0-9]{2,4}$/.test(tag)){ toast('The tag is 2–4 letters or numbers, like CUF.'); return; }
    S.busy = true;
    const r = await db.rpc('create_crew', {p_name: name, p_tag: tag});
    S.busy = false;
    if (r.error){ toast(r.error.message); return; }
    await loadCrew(); toast(`${name} is live. Send your invite code to your friends.`); render(true);
  }
  else if (f.id === 'friend-search'){
    const q = $('friend-q').value.trim(); S.search.q = q;
    if (q.length < 2){ toast('Type at least 2 letters'); return; }
    const r = await db.from('profiles').select(PROFILE_BITS).ilike('username', `%${q.replace(/[%_,()]/g, '')}%`).neq('id', myId()).limit(10);
    if (r.error){ toast(r.error.message); return; }
    S.search.results = r.data; render(true);
  }
});

// ---------- installable app: keep a copy on the phone so it opens with no signal ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- where riders come from (?src=ig, tt, poster...): the first tag seen rides along with sign-up ----------
// Saved in the account's sign-up info (auth.users raw_user_meta_data->>'src'), so no table change is needed.
{
  const q = new URLSearchParams(location.search), src = q.get('src');
  if (src && /^[\w-]{1,24}$/.test(src)){
    if (!store.get('signup-src', '')) store.set('signup-src', src.toLowerCase());
    q.delete('src');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }
}
// ---------- crew invite links (?crew=CODE): remember the code through sign-up ----------
{
  const code = new URLSearchParams(location.search).get('crew');
  if (code && /^[A-Za-z0-9]{6}$/.test(code)){
    store.set('pending-crew', code.toUpperCase());
    history.replaceState(null, '', location.pathname);
  }
}
// ---------- app invites (?from=USERNAME): after sign-up, offer to add the friend who sent it ----------
{
  const from = new URLSearchParams(location.search).get('from');
  if (from && /^[\w.-]{2,24}$/.test(from)){
    store.set('pending-from', from);
    history.replaceState(null, '', location.pathname);
  }
}
async function offerInviter(){
  const from = store.get('pending-from', '');
  if (!from) return;
  store.set('pending-from', '');
  if (from.toLowerCase() === S.me.username.toLowerCase()) return;
  const r = await db.from('profiles').select(PROFILE_BITS).eq('username', from).maybeSingle();
  if (r.error || !r.data) return;   // renamed or deleted: nothing to offer
  if (S.friends.some(f => f.other && f.other.id === r.data.id)) return;
  S.squad = 'friends'; S.search = {...(S.search || {}), q: from, results: [r.data]};
  if (store.get('pending-clip', '')) return;   // a clip link wins; they can add them from the clip
  await openTab('duels');
  toast(`@${from} invited you. Tap Add to be friends.`, 5000);
}
// ---------- clip links (?clip=ID): open that exact clip, even after signing up first ----------
{
  const id = new URLSearchParams(location.search).get('clip');
  if (id && /^[0-9a-f-]{36}$/i.test(id)){
    store.set('pending-clip', id.toLowerCase());
    history.replaceState(null, '', location.pathname);
  }
}
async function shareClipLink(id){
  const c = findClip(id); if (!c) return;
  const who = c.user_id === myId() ? 'my' : '@' + (c.profiles ? c.profiles.username : 'a rider') + "'s";
  const url = `${location.origin}${location.pathname}?clip=${c.id}`, name = clipName(c);
  const text = c.status === 'pending' ? `Did ${who === 'my' ? 'I' : who.slice(0, -2)} land this ${name}? Judge it on Stomped.`
    : c.status === 'verified' ? `Watch ${who} ${name}. Verified on Stomped.` : `Watch ${who} ${name} on Stomped.`;
  if (navigator.share){ try { await navigator.share({title: `${name} on Stomped`, text, url}); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Link copied. Paste it to your friends.'); }
  catch (e) { toast(url, 6000); }
}
async function openPendingClip(){
  const id = store.get('pending-clip', '');
  if (!id) return;
  store.set('pending-clip', '');
  const r = await db.from('clips').select(CLIP_SELECT).eq('id', id).maybeSingle();
  if (r.error){ toast("Couldn't open that clip. Check your signal and tap the link again.", 4500); return; }
  if (!r.data || !shownClip(r.data)){ toast("That clip was removed, so it can't be shown.", 4500); return; }
  await loadFilmers([r.data]);
  S.feed.pin = findClip(id) || r.data;
  await openTab('feed');
  try { await loadFeed(); } catch (e) {}
  render(true);
  const el = $('clip-' + id); if (el) el.scrollIntoView({block: 'start'});
}
function offerPendingCrew(){
  const code = store.get('pending-crew', '');
  if (!code || !S.crew.ready) return;
  store.set('pending-crew', '');
  if (S.crew.mine) return;
  S.crewPrefill = code; S.tab = 'duels'; render(true);
  toast('You were invited to a crew. Tap Join.', 5000);
}

// ---------- start ----------
// Supabase warns against awaiting its own calls inside this callback, so hand off with setTimeout.
db.auth.onAuthStateChange((event, session) => {
  setTimeout(async () => {
    const was = S.session && S.session.user.id, now = session && session.user.id;
    S.session = session;
    if (!now){ S.me = null; seenStatus = null; S.tab = 'lodge'; S.splashDone = false; render(true); return; }
    if (event === 'PASSWORD_RECOVERY') S.splashDone = true;   // the new-password box beats the rank splash
    if (was !== now){ S.tab = 'lodge'; await refresh(true); if (S.me){ await applySignupMt(); const setup = showOnboarding(); if (!setup) showSplash(); flushOutbox(); offerPendingCrew(); openPendingClip(); if (!setup){ offerInviter(); setTimeout(offerInstall, 6000); } } }
    if (event === 'PASSWORD_RECOVERY') showNewPassword();
  }, 0);
});
</script>
