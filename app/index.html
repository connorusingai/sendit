// Same rule for everyone, so votes (and the training data behind the trick AI) mean the same thing.
const landedRule = () => `<details class="card rule"><summary>What counts as landed?</summary><ul>
  <li><b>Landed:</b> they land on their feet and ride away in control.</li>
  <li><b>Landed:</b> the spin matches the trick named. A 360 is one full turn.</li>
  <li><b>Nope, fell:</b> they fall, sit down, or put a hand down to stop falling.</li>
  <li><b>Nope, wrong trick:</b> the spin is short or it's a different trick.</li>
  <li><b>Nope, can't see:</b> the landing is cut off or too blurry to tell.</li></ul></details>`;

// Base "Next to land" (Connor 10/25): 3 tricks you haven't landed yet, starting just under your best trick's points,
// so it's a step up and not the bunny-hill list. Tap = film it with the trick already picked.
function nextToLand(){
  const sport = S.sport, done = tricksFor(sport).filter(t => S.landed.has(t.id));
  const best = done.reduce((m, t) => Math.max(m, t.pts), 0);
  const open = tricksFor(sport).filter(t => !S.landed.has(t.id)).sort((a, b) => a.pts - b.pts);
  if (!open.length) return '';
  let from = open.findIndex(t => t.pts >= best * 0.6);
  if (from < 0) from = open.length;                                   // everything left is easier: show the hardest 3
  from = Math.max(0, Math.min(from, open.length - 3));
  const picks = open.slice(from, from + 3);
  return `<div class="b2-crew b2-next">
    <div class="b2-lbl"><span>Next to land · ${SPORTS[sport].label}</span><button data-act="book" data-id="${S.me.id}" data-name="${esc(S.me.username)}">All ›</button></div>
    ${picks.map(t => `<button class="b2-item" data-act="book-record" data-id="${t.id}">
      <span class="b2-mini">${ic(t.id === S.totd ? 'fire' : 'flag', 22)}</span>
      <span class="b2-who">${esc(t.name)}<i>${esc(t.category)} · ${t.pts} pts${t.id === S.totd ? ' · 2× today' : ''}</i></span>
      <span class="b2-try">${ic('cam', 15)} Try</span></button>`).join('')}
  </div>`;
}

function fitBase(){   // Base fills exactly the space between the header and the tab bar, then the snow field meets his boots
  const L = document.querySelector('.lodge'), rider = $('base-rider'); if (!L || !rider) return;
  const top = L.getBoundingClientRect().top + scrollY, tabs = $('tabbar').getBoundingClientRect().height;
  const pad = parseFloat(getComputedStyle(document.querySelector('.app')).paddingBottom) || 0;
  L.style.minHeight = Math.max(440, innerHeight - top - Math.max(tabs + 10, pad)) + 'px';
  const r = rider.getBoundingClientRect(); baseScene.ground(r.bottom - r.height*.045);
}
function closeGear(){ const sh = $('gear-sheet'); if (sh) sh.classList.remove('open'); document.body.classList.remove('base-editing'); }

const baseScene = (() => {   // night sky, snowy mountains, rows of pines, falling snow; painted once, only the snow moves
  const cv = $('base-bg'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let W = 0, H = 0, dpr = 1, raf = 0, t0 = performance.now(), feet = null;
/* ---------- 4: snowy pines at night ---------- */
let pinesLayer = null, flakes = [];
function drawPine(g, x, base, h, body, snow, snowA){
  const tiers = 6, w0 = h * 0.46;
  g.fillStyle = body; g.fillRect(x - h*0.025, base - h*0.1, h*0.05, h*0.12);
  for (let i = 0; i < tiers; i++){
    const f = i / tiers, w = w0 * (1 - f*0.78), yb = base - h*0.08 - f*h*0.78, yt = yb - h*0.3;
    g.fillStyle = body; g.beginPath(); g.moveTo(x - w/2, yb); g.lineTo(x, yt); g.lineTo(x + w/2, yb);
    g.quadraticCurveTo(x, yb - h*0.04, x - w/2, yb); g.fill();
    g.fillStyle = snow; g.globalAlpha = snowA; g.beginPath();            // snow resting on the upper edge of each tier
    g.moveTo(x - w/2, yb); g.lineTo(x, yt); g.lineTo(x + w/2, yb);
    g.lineTo(x + w*0.36, yb - h*0.03); g.lineTo(x, yt + h*0.07); g.lineTo(x - w*0.36, yb - h*0.03); g.closePath(); g.fill();
    g.globalAlpha = 1;
  }
}
function buildPines(){
  const c = document.createElement('canvas'); c.width = W*dpr; c.height = H*dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); const r = rnd(7);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#04060c'); sky.addColorStop(.55, '#0c1628'); sky.addColorStop(1, '#16233a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const moon = g.createRadialGradient(W*.72, H*.2, 0, W*.72, H*.2, H*.35);       // moonlight haze behind the trees
  moon.addColorStop(0, 'rgba(170,195,235,.22)'); moon.addColorStop(1, 'rgba(170,195,235,0)');
  g.fillStyle = moon; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(225,235,250,.85)'; g.beginPath(); g.arc(W*.72, H*.2, Math.min(W,H)*.035, 0, 7); g.fill();
  const off = feet == null ? 0 : feet - H*.72;                      // the snow field sits under the rider's boots on any phone
  g.save(); g.translate(0, off);
  const range = (base, amp, n, body, cap, seed) => {              // jagged ridge; snow caps on every peak
    const rr = rnd(seed), pts = [];
    for (let i = 0; i <= n; i++) pts.push([i/n*(W + 80) - 40, base - amp*(.45 + .55*rr())*(i % 2 ? 1 : .5)]);
    g.fillStyle = body; g.beginPath(); g.moveTo(-40, H); pts.forEach(q => g.lineTo(q[0], q[1])); g.lineTo(W + 40, H); g.fill();
    g.fillStyle = cap;
    for (let i = 1; i < pts.length - 1; i += 2){
      const [x, y] = pts[i], L = pts[i - 1], R = pts[i + 1], k = .3;
      const lx = x + (L[0] - x)*k, ly = y + (L[1] - y)*k, rx = x + (R[0] - x)*k, ry = y + (R[1] - y)*k;
      g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.lineTo(rx, ry);
      g.lineTo(x + (rx - x)*.45, y + (ry - y)*.7); g.lineTo(x + (lx - x)*.1, y + (ly - y)*.85); g.lineTo(x + (lx - x)*.55, y + (ly - y)*.65); g.closePath(); g.fill();
    }
  };
  range(H*.5, H*.2, 7, '#18263f', 'rgba(210,224,245,.8)', 21);
  range(H*.56, H*.12, 9, '#122036', 'rgba(185,203,230,.6)', 33);
  // three depths: far ridge of small foggy pines, middle row, big dark pines framing the sides
  const layers = [
    {n: Math.ceil(W/16), y: H*.56, h: [H*.08, H*.14], body: '#1b2a44', snow: '#6d84a8', a: .5, fog: 'rgba(22,35,58,.55)'},
    {n: Math.ceil(W/46), y: H*.66, h: [H*.2, H*.31], body: '#0f1a2c', snow: '#9fb4d3', a: .7, fog: 'rgba(22,35,58,.45)'},
  ];
  for (const L of layers){
    for (let i = 0; i < L.n; i++){ const x = (i + r()*.8) / L.n * (W + 40) - 20; drawPine(g, x, L.y + r()*H*.03, L.h[0] + r()*(L.h[1]-L.h[0]), L.body, L.snow, L.a); }
    g.fillStyle = L.fog; g.fillRect(0, L.y - H*.02, W, H);
  }
  const ground = g.createLinearGradient(0, H*.66, 0, H);
  ground.addColorStop(0, '#2a3a55'); ground.addColorStop(1, '#121b2b');
  g.fillStyle = ground; g.beginPath(); g.moveTo(0, H*.7); g.quadraticCurveTo(W*.5, H*.64, W, H*.71); g.lineTo(W, H + Math.abs(off) + 20); g.lineTo(0, H + Math.abs(off) + 20); g.fill();
  const near = [[-W*.06, H*.98, H*.62], [W*.13, H*1.02, H*.44], [W*1.04, H*.97, H*.6], [W*.86, H*1.03, H*.4]];
  for (const [x, b, h] of near) drawPine(g, x, b, h, '#05080e', '#d6e2f2', .85);
  g.restore();
  pinesLayer = c;
  const fr = rnd(3); flakes = [];
  for (let i = 0; i < Math.round(W*H/2600); i++){ const z = fr(); flakes.push({x: fr()*W, y: fr()*H, z, s: .6 + z*2.2, v: 12 + z*38, ph: fr()*6}); }
}
function drawPinesFrame(t){
  ctx.drawImage(pinesLayer, 0, 0, W, H);
  ctx.fillStyle = '#eaf1fb';
  for (const f of flakes){
    if (!reduce){ f.y += f.v * 0.016; if (f.y > H + 4){ f.y = -4; f.x = Math.random()*W; } }

  }

}
  function resize(){
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); buildPines();

    start(){ if (raf) return; if (W !== innerWidth || H !== innerHeight) resize(); raf = requestAnimationFrame(frame); },
    stop(){ cancelAnimationFrame(raf); raf = 0; },
    ground(y){ if (feet !== null && Math.abs(y - feet) < 3) return; feet = y; if (W) buildPines(); },
  };
})();

      <button class="${F.mode === 'clips' ? 'on' : ''}" data-act="feed-mode" data-k="clips" role="tab" aria-selected="${F.mode === 'clips'}">Clips</button>
      <button class="${F.mode === 'judge' ? 'on' : ''}" data-act="feed-mode" data-k="judge" role="tab" aria-selected="${F.mode === 'judge'}">Judge${jq ? ` <span class="cnt">${jq}</span>` : ''}</button></div></div>`;
    if (F.mode === 'judge'){
      const done = `<div class="rank-word t-gold" style="font-size:44px">All judged ✓</div>
        <p class="sub" style="margin-top:10px">${J.list.length ? "That's every clip waiting on you." : 'No clips need your vote right now.'} Your vote counts ×${trickTierOf(S.me.points).w}.</p>
        <button class="btn primary" data-act="feed-mode" data-k="clips">Watch clips</button>`;
      return `<div class="feedwrap">${bar}<div class="reel feedreel judge-reel" id="reel">${J.list.map(reelItem).join('')}
        <div class="reel-end"><div>${done}${landedRule()}</div></div></div></div>`;
    }
    const pinId = F.pin && F.pin.id;
    const waiting = S.clips.filter(c => c.user_id === myId() && c.status === 'pending');   // your own clips still being judged come first
    const seen = new Set(), list = [...waiting, ...F.rows].filter(c => !seen.has(c.id) && seen.add(c.id)
      && (c.id === pinId || !needsMyVote(c)));
    let end;
    if (!F.loaded) end = '<p class="sub">Loading…</p>';
    else if (F.more) end = '<p class="sub">Loading more…</p>';
    else if (list.length) end = `<p class="hint">You're all caught up.</p>`;
    else end = emptyFeed();
    return `<div class="feedwrap">${bar}<div class="reel feedreel" id="reel">
      ${list.map(c => c.id === pinId && judgeable(c) ? reelItem(c) : feedItem(c)).join('')}
      ${!F.loaded && !list.length ? SKEL_FEED : ''}
      <div class="reel-end"><div>${end}</div></div></div></div>`;
  },

  record(){
    const R = S.rec, ctx = R.context;
    const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    const title = ctx ? (ctx.kind === 'set' ? 'Duel: set your trick' : 'Duel: match it') : 'Record';
    const ctxLine = ctx ? `<p class="sub">${ctx.kind === 'set' ? 'Setting' : 'Matching'} <b style="color:var(--ink)">${esc(trickById(ctx.trickId).name)}</b> vs ${esc(ctx.otherName)}. Land it on camera.</p>`
                        : `<p class="sub">Clips are filmed in the app, so nobody can post old or downloaded videos.</p>`;
    let body;
    if (!canRecord) body = `<div class="cam"><div class="cam-empty"><div>
        <strong class="rank-word t-silver" style="font-size:28px">Camera not available</strong>
        <p>This browser can't record here. The camera needs the app to be opened over a secure (https) link. That comes when Stomped goes online.</p></div></div></div>`;
    else if (R.mode === 'review') body = `<div class="cam"><video src="${R.url}" controls playsinline loop autoplay muted></video></div>
      ${ctx ? duelReviewForm(ctx) : postForm()}`;
    else if (R.mode === 'live' || R.mode === 'recording') body = `<div class="cam">
        <video id="rec-live" autoplay muted playsinline></video>
        <div class="timer ${R.mode === 'recording' ? 'live' : ''}" id="rec-timer">${R.mode === 'recording' ? '● 0.0s' : `max ${MAX_SECONDS}s`}</div>
        <div class="controls">
          <button class="cam-side" data-act="cam-close" aria-label="Close camera">✕</button>
          <button class="shutter ${R.mode === 'recording' ? 'stop' : ''}" data-act="${R.mode === 'recording' ? 'rec-stop' : 'rec-start'}" aria-label="Record or stop"></button>
          <button class="cam-side" data-act="cam-flip" aria-label="Flip camera">⟲</button>
        </div></div>`;
    else body = `${ctx ? '' : sportSwitch(S.sport, 'sport') + '<div style="height:12px"></div>'}
      <div class="cam"><div class="cam-empty"><div style="display:grid;gap:14px;justify-items:center">
        <button class="big-cam" data-act="cam-open" aria-label="Open camera">${ICON.cam}</button>
        <strong class="rank-word t-legend" style="font-size:30px">Tap to film</strong>
        <span>Up to ${MAX_SECONDS} seconds. Have a friend film you, or prop your phone up.</span></div></div></div>
      ${ctx ? '<button class="linkish" data-act="rec-cancel" style="margin-top:12px">Cancel duel attempt</button>' : ''}`;
    return `<h2>${title}</h2>${ctxLine}${body}`;
  },

  duels(){
    if (S.duelId) return duelDetail();
    const mine = S.duels.filter(d => d.status === 'active');
    const done = S.duels.filter(d => d.status === 'done').slice(0, 5);
    const incoming = S.friends.filter(f => f.status === 'pending' && f.incoming);
    const sent = S.friends.filter(f => f.status === 'pending' && !f.incoming);
    const friends = acceptedFriends();
    const results = S.search.results;
    const myTurn = mine.filter(d => d.turn === myId()).length;
    const tab = (k, label, n) => `<button class="${S.squad === k ? 'on' : ''}" data-act="squad" data-k="${k}">${label}${n ? ` <span class="cnt">${n}</span>` : ''}</button>`;
    const head = `<h2>Squad</h2><div class="seg squad-seg" role="tablist" aria-label="Squad">${tab('friends', 'Friends', incoming.length)}${
      tab('ranks', 'Ranks', 0)}${tab('crew', 'Crew', 0)}${tab('duels', 'Duels', myTurn)}</div>`;

    if (S.squad === 'ranks') return `${head}${boardHtml()}`;
    if (S.squad === 'crew') return `${head}${crewCard() || '<div class="card empty"><strong>Crews are coming</strong>Not switched on yet.</div>'}`;

    if (S.squad === 'friends') return `${head}
    <button class="btn small" style="margin-bottom:10px" data-act="invite">${ic('send', 15)} Invite friends to Stomped</button>
    <form class="inline-form" id="friend-search">
      <input id="friend-q" placeholder="Find riders by username" value="${esc(S.search.q)}" autocomplete="off" aria-label="Search usernames">
      <button class="btn small" type="submit">Search</button></form>
    ${results ? `<div class="card" style="margin-top:10px">${results.length ? results.map(p => friendRow(p, 'search')).join('')
        : '<div class="empty" style="padding:16px">Nobody by that name yet.</div>'}</div>` : ''}
    ${incoming.length ? `<div class="label" style="margin:16px 0 8px">Requests</div>
      <div class="card">${incoming.map(f => friendRow(f.other, 'incoming')).join('')}</div>` : ''}
    <div class="label" style="margin:16px 0 8px">Your friends · ${friends.length}</div>
    <div class="card">${friends.length ? friends.map(f => friendRow(f.other, 'friend')).join('')
      : `<div class="empty" style="padding:18px"><strong>No friends yet</strong>Search their username above, or send them the app with Invite.</div>`}</div>
    ${sent.length ? `<p class="hint" style="margin-top:8px">Waiting on: ${sent.map(f => esc(f.other.username)).join(', ')}</p>` : ''}`;

    return `${head}

    <div class="card">${mine.length ? mine.map(d => {
        const myL = d.challenger === myId() ? d.letters_challenger : d.letters_opponent;
        const theirL = d.challenger === myId() ? d.letters_opponent : d.letters_challenger;
        return `<button class="duel-row" data-act="open-duel" data-id="${d.id}">
          <div class="avatar" ${avStyle(d.other.username)}>${esc(initials(d.other.username))}</div>
          <div><b>vs ${esc(d.other.username)}</b><div class="hint" style="display:flex;gap:10px;align-items:center;margin-top:4px">
            You ${lettersHtml(myL, true)} Them ${lettersHtml(theirL, true)}</div></div>
          ${d.turn === myId() ? '<span class="your-turn">Your turn</span>' : '<span class="hint">Their turn</span>'}</button>`;
      }).join('') : `<div class="empty"><strong>No duels yet</strong>${friends.length ? 'Pick a friend. You set a trick, they have to land it. Miss and you take a letter: spell S-K-I and you lose.' : 'A duel is Game of S.K.I. with a friend: land a trick, they have to match it. Add a friend to start one.'}</div>`}</div>
    ${!mine.length && friends.length ? `<div class="card" style="margin-top:10px">${friends.map(f => friendRow(f.other, 'friend')).join('')}</div>` : ''}
    ${!friends.length ? `<button class="btn primary" style="margin-top:10px;width:100%" data-act="squad" data-k="friends">${ic('wave', 16)} Add a friend</button>` : ''}

    ${done.length ? `<h3>Recent duels</h3><div class="card"><ul class="board">${done.map(d => {
        const won = d.winner === myId();
        return `<li data-act="open-duel" data-id="${d.id}"><span class="n">${won ? 'W' : 'L'}</span>
          <div class="avatar" ${avStyle(d.other.username)}>${esc(initials(d.other.username))}</div>
          <div><b>${esc(d.other.username)}</b><div class="hint">${won ? 'You won' : 'You lost'}</div></div>
          <span class="score" style="color:var(--${won ? 'good' : 'bad'})">${won ? '+' : '−'}${d.rating_change || 0}</span></li>`;
      }).join('')}</ul></div>` : ''}`;
  },

  ranks(){
    const me = S.me, b = S.board;
    const verified = S.clips.filter(c => c.user_id === me.id && c.status === 'verified').length;
    const doneDuels = S.duels.filter(d => d.status === 'done'), wins = doneDuels.filter(d => d.winner === me.id).length;
    // Rank, conditions, Trick of the Day and today's session moved here when the Feed went full screen
    const top = WIDE.matches ? sessionStrip() : wxCard() + totdStrip() + sessionStrip();   // your rank is already the big card below
    return `${top}<h2>Ranks</h2><p class="sub">Every verified trick adds points. Each tier has three divisions: fill the bar to earn the next star.</p>
    <div class="stack">
      ${rankCard('Trick rank', me.points, TRICK_TIERS, 'pts', `${verified} verified`)}
      ${rankCard('Duel rank', me.rating, TIERS, 'rating', `${wins}W · ${doneDuels.length - wins}L`)}
    </div>
    <button class="card book-link" data-act="book" data-id="${me.id}" data-name="${esc(me.username)}">
      <span class="book-ic">${ic('book', 30)}</span>
      <div style="flex:1"><div class="label">Trick Book</div><div class="hint">Your checklist of every trick and the grabs you've done on each.</div></div>
      <span class="count t-gold rank-word">${S.tricks.filter(t => ridesSports().includes(sportOf(t))).filter(t => S.landed.has(t.id)).length}/${S.tricks.filter(t => ridesSports().includes(sportOf(t))).length}</span></button>
    <h3>The road to Legend</h3>
    ${ladder(me.points, TRICK_TIERS)}
    <h3>Leaderboard</h3>
    ${boardHtml()}
    <section class="card form" id="profile-card" style="margin-top:20px">
      <div class="label">Your profile</div>
      <div class="hint">Signed in as <b>${esc(me.username)}</b> · ${esc(S.session.user.email)}</div>
      <div class="field"><label class="label" for="ride-pref">I ride</label>
        <select id="ride-pref">${[...Object.entries(SPORTS).map(([k, sp]) => [k, sp.label]), ['both', 'Both']].map(([k, l]) =>
          `<option value="${k}" ${S.sports === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="home-resort">Home mountain</label>
        <select id="home-resort"><option value="">Not set</option>${RESORTS.map(r =>
          `<option ${me.home_resort === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="btns"><button class="btn" data-act="profile" data-id="${me.id}">View my page</button>
        <button class="btn" data-act="feedback">Send feedback</button>
        <button class="btn" data-act="signout">Sign out</button></div>
      ${S.feedbackOpen ? `<div class="card fb"><b>What's on your mind?</b>
        <div class="field"><label class="label" for="fb-kind">Type</label>
          <select id="fb-kind"><option value="bug">Something broke</option><option value="confusing">Something's confusing</option>
            <option value="idea">I have an idea</option><option value="love">I love this part</option></select></div>
        <div class="field"><label class="label" for="fb-body">Tell us</label>
          <textarea id="fb-body" rows="3" maxlength="1000" placeholder="e.g. The camera froze after I tapped record"></textarea></div>
        <div class="btns"><button class="btn" data-act="feedback">Cancel</button>
          <button class="btn primary" data-act="feedback-send">Send</button></div></div>` : ''}
      <div class="legal"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> ·
        <button class="linkish" data-act="delete-account" style="align-self:auto">Delete my account</button></div>
      ${S.confirmDelete ? `<div class="card danger"><b>Delete your account?</b>
        <p class="hint">Your profile, clips, videos, votes, comments, friends and duels are deleted for good. This can't be undone.</p>
        <div class="btns"><button class="btn" data-act="delete-account">Keep my account</button>
          <button class="btn bad" data-act="delete-account-yes">Delete everything</button></div></div>` : ''}
    </section>`;
  },

  book(){
    const B = S.book;
    if (!B) return SKEL_PAGE;
    const mine = B.id === myId(), all = tricksFor(B.sport);
    const done = all.filter(t => B.landed.has(t.id));
    const banked = done.reduce((n, t) => n + t.pts, 0);
    return `<button class="linkish back" data-act="book-back">← Back</button>
    <h2>${mine ? 'Your' : esc(B.name) + '’s'} Trick Book</h2>
    <p class="sub">A trick pays full points the first time it's verified, and each new grab on it adds a little more. Tick them all off to climb.</p>
    ${sportSwitch(B.sport, 'book-sport')}
    <section class="card me-card" style="margin-top:14px">
      <div class="row"><span class="rank-word t-gold" style="font-size:40px">${done.length} / ${all.length}</span>
        <span class="hint">${SPORTS[B.sport].label} tricks landed</span></div>
      <div class="bar"><i style="width:${Math.max(3, done.length / all.length * 100)}%"></i></div>
      <div class="hint">${all.length - done.length} to go · worth up to ${all.filter(t => !B.landed.has(t.id)).reduce((n, t) => n + t.pts, 0)} more base points</div>
    </section>
    <div class="stack" style="margin-top:14px">${SPORTS[B.sport].cats.map(cat => {
      const list = tricksFor(B.sport, cat); if (!list.length) return '';
      const n = list.filter(t => B.landed.has(t.id)).length;
      return `<div class="card"><div class="book-cat"><span class="label">${cat}</span><span class="ring" style="--p:${Math.round(n / list.length * 100)}" aria-label="${n} of ${list.length}"><i>${n}/${list.length}</i></span></div>
        ${list.map(t => {
          const got = B.landed.has(t.id);
          return `<div class="book-row ${got ? 'done' : ''}">
            <span class="check ${got ? 'on' : ''}" aria-label="${got ? 'Landed' : 'Not yet'}">${got ? '✓' : ''}</span>
            <div><b>${esc(t.name)}</b>${isTotd(t.id) ? ` <span class="pill totd">${ic('fire', 12)} Today 2×</span>` : ''}<div class="hint mono">${t.pts} pts</div>${got ? `<div class="chips">${
              [...B.landed.get(t.id)].filter(g => g !== 'No grab').map(g => `<span class="chip">${esc(g)}</span>`).join('')}${
              mine ? `<span class="chip next">+${Math.round(t.pts * .2)} per new grab</span>` : ''}</div>` : ''}</div>
            <div style="display:flex;gap:6px">
              <button class="btn small" data-act="book-tip" data-id="${t.id}" aria-expanded="${S.bookTip === t.id}" aria-label="Tips for ${esc(t.name)}">${ic('bulb', 16)}</button>
              ${mine && !got ? `<button class="btn small" data-act="book-record" data-id="${t.id}">${ic('cam', 15)} Try it</button>` : ''}</div>
          </div>${S.bookTip === t.id ? `<div class="tips"><div class="label">How to land it</div>
            <ul>${tipsFor(t).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}`;
        }).join('')}</div>`;
    }).join('')}</div>`;
  },

  profile(){
    const P = S.profile;
    if (!P || !P.data) return SKEL_PAGE;
    const u = P.data, mine = u.id === myId();
    const verified = P.clips.filter(c => c.status === 'verified');
    const fire = P.clips.reduce((n, c) => n + count(c.likes), 0);
    const best = verified.reduce((a, c) => (!a || c.points_awarded > a.points_awarded ? c : a), null);
    const tr = rankInfo(u.points, TRICK_TIERS), dr = rankInfo(u.rating, TIERS);
    const f = S.friends.find(x => x.other && x.other.id === u.id);
    const duel = !mine && activeDuelWith(u.id);
    const friendBit = mine ? `<div class="prof-acts"><button class="btn small" data-act="invite">${ic('send', 15)} Invite</button><button class="btn small" data-act="squad-go" data-k="ranks">${ic('trophy', 15)} Leaderboard</button>
        <button class="btn small" data-act="squad-go" data-k="friends">Friends · ${acceptedFriends().length}</button></div>`
      : f && f.status === 'accepted' ? `<div class="prof-acts"><span class="pill ok">Friends</span>${duel
          ? `<button class="btn small" data-act="open-duel" data-id="${duel.id}">View duel</button>`
          : `<button class="btn small primary" data-act="challenge" data-id="${u.id}">Challenge</button>`}</div>`
      : f ? '<span class="pill wait" style="display:inline-block;margin-top:6px">Request pending</span>'
      : `<button class="btn small" style="margin-top:8px" data-act="add-friend" data-id="${u.id}">+ Add friend</button>`;
    return `<button class="linkish back" data-act="back">← Back</button>
    <div class="prof-head">${badgeSVG(tr.tier.key, 72, tr.div, {glow: true})}
      <div><h2>${esc(u.username)}</h2><div class="hint">${u.home_resort ? ic('mountain', 13) + ' ' + esc(u.home_resort) : 'No home mountain yet'}</div>${friendBit}</div></div>
    <section class="card prof-rank">
      <div class="row">${rankWord(tr, 26)}<span class="mono hint">${u.points} pts</span></div>
      <div class="bar"><i style="width:${Math.max(4, tr.pct)}%"></i></div>
      <div class="row"><span class="hint">${tr.nextLabel ? `${tr.toNext} pts to ${esc(tr.nextLabel)}` : 'Top rank'}</span>
        <span class="duel-rank">${badgeSVG(dr.tier.key, 20, dr.div)}<span class="hint">Duels · ${esc(dr.label)}</span></span></div>
    </section>
    ${ladder(u.points, TRICK_TIERS)}
    ${achievementsHtml(P.landed || new Map())}
    <div class="stats">
      <div class="stat"><b>${(P.landed || new Map()).size}</b><span>Tricks landed</span></div>
      <div class="stat"><b>${verified.length}</b><span>Verified clips</span></div>
      <div class="stat"><b>${fire}</b><span>${ic('fire', 12)} Fire</span></div>
    </div>
    <button class="btn" style="width:100%;margin-bottom:16px" data-act="book" data-id="${u.id}" data-name="${esc(u.username)}">${ic('book', 18)} ${mine ? 'My' : esc(u.username) + '’s'} Trick Book</button>
    ${best ? `<div class="label" style="margin-bottom:8px">Best trick · <span style="color:var(--accent)">${esc(trickById(best.trick_id).name)} +${best.points_awarded}</span></div>` : ''}
    <div class="label" style="margin-block:14px 8px">${mine ? 'Your clips' : 'Clips'}</div>
    ${P.clips.length ? `<div class="grid">${P.clips.map(c => `
      <button class="tile" data-act="playtile" aria-label="Play ${esc(trickById(c.trick_id).name)}">
        ${c.video_path ? `<video src="${esc(videoUrl(c.video_path))}#t=0.1" muted playsinline loop preload="metadata"></video>` : ''}
        <em>${c.status === 'verified' ? '+' + c.points_awarded : c.status === 'pending' ? 'judging' : '✕'}</em>
        <span>${esc(trickById(c.trick_id).name)}</span></button>`).join('')}</div>`
      : `<div class="card empty"><strong>No clips yet</strong>${mine ? 'Record your first trick.' : 'Nothing verified yet.'}</div>`}`;
  },
};

// The leaderboard: shown in Squad > Ranks and on the Ranks page. Every row opens that rider's profile.
function boardHtml(){
  const b = S.board, me = S.me;
  return `<div class="filters">
      <div class="seg" role="group" aria-label="Who">
        <button class="${b.scope === 'friends' ? 'on' : ''}" data-act="scope" data-k="friends">Friends</button>
        <button class="${b.scope === 'global' ? 'on' : ''}" data-act="scope" data-k="global">Everyone</button>${S.crew.ready ? `
        <button class="${b.scope === 'crews' ? 'on' : ''}" data-act="scope" data-k="crews">Crews</button>` : ''}</div>
      <div class="seg" role="group" aria-label="Time period">
        <button class="${b.period === 'all' ? 'on' : ''}" data-act="period" data-k="all">All time</button>
        <button class="${b.period === 'week' ? 'on' : ''}" data-act="period" data-k="week">Week</button></div>
    </div>
    ${b.scope === 'crews' ? crewBoard() : `<div class="card">${b.rows.length ? `<ol class="board">${b.rows.map((u, i) => `
      <li class="${u.id === me.id ? 'you' : ''}" data-act="profile" data-id="${u.id}"><span class="n">${i + 1}</span>
        ${badgeSVG(trickTierOf(u.points).key, 34)}
        <div><b>${esc(u.username)}</b><div class="hint">${esc(rankInfo(u.points, TRICK_TIERS).label)}${u.home_resort ? ' · ' + esc(u.home_resort) : ''}</div></div>
        <span class="score">${u.score} <small class="hint">pts</small></span></li>`).join('')}</ol>`
      : `<div class="empty"><strong>Nobody yet</strong>${b.scope === 'friends' ? 'Add friends in Squad › Friends.' : 'Be the first on the board.'}</div>`}</div>`}`;
}

function crewBoard(){
  const rows = S.board.rows, mine = S.crew.mine;
  return `<div class="card">${rows.length ? `<ol class="board">${rows.map((c, i) => `
    <li class="${mine && c.id === mine.id ? 'you' : ''}" data-act="tab" data-tab="duels"><span class="n">${i + 1}</span>
      <span class="crew-tag sm">${esc(c.tag)}</span>
      <div><b>${esc(c.name)}</b><div class="hint">${c.members} rider${c.members === 1 ? '' : 's'}</div></div>
      <span class="score">${c.score} <small class="hint">pts</small></span></li>`).join('')}</ol>`
    : `<div class="empty"><strong>No crews yet</strong>Start one in Squad › Crew.</div>`}</div>`;
}
function crewCard(){
  const C = S.crew;
  if (!C.ready) return '';
  if (!C.mine) return `<div class="card crew-card">
    <b class="crew-pitch">Ride as a team</b><p class="hint" style="margin:4px 0 12px">Your whole crew's points add up on one leaderboard. Got a code from a friend or your ski club? Drop it in.</p>
    <form class="inline-form" id="crew-join">
      <input id="crew-code" placeholder="Invite code" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="Crew invite code" value="${esc(S.crewPrefill || '')}">

// Judge like Tinder: drag a clip right for Landed, left for Bailed. Up and down still scroll to the next clip.
{
  let sw = null;
  document.addEventListener('pointerdown', e => {
    const it = e.target.closest && e.target.closest('.reel-item.judging[data-id]');
    if (!it || e.target.closest('button') || it.dataset.id in S.judge.voted || S.judge.reasonFor) return;
    sw = {it, x: e.clientX, y: e.clientY, dx: 0, on: false};
  });
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on){
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }   // that's a scroll, not a swipe
      if (Math.abs(dx) < 12) return;
      sw.on = true;
    }
    sw.dx = dx;
    sw.it.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    sw.it.style.setProperty('--yes', Math.max(0, Math.min(1, dx / 110)));
    sw.it.style.setProperty('--no', Math.max(0, Math.min(1, -dx / 110)));
  });
  const end = () => {
    if (!sw) return;
    const {it, dx, on} = sw; sw = null;
    if (!on) return;
    it.style.transition = 'transform .22s ease-out'; it.style.transform = '';
    it.style.setProperty('--yes', 0); it.style.setProperty('--no', 0);
    setTimeout(() => { it.style.transition = ''; }, 240);
    if (Math.abs(dx) > 100) vote(it.dataset.id, dx > 0, null);   // far enough = it counts
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}
let reelObserver;
function watchReel(){
  if (reelObserver) reelObserver.disconnect();
  const reel = $('reel'); if (!reel) return;
  // Play the clip that's on screen; pause the rest.
  reelObserver = new IntersectionObserver(entries => {
    for (const e of entries){
      const v = e.target.querySelector('video'); if (!v) continue;
      if (e.isIntersecting && e.intersectionRatio > .6) v.play().catch(() => {}); else v.pause();
      if (e.isIntersecting && e.target.dataset.near) feedMore();
    }
  }, {root: reel, threshold: [0, .6, 1]});
  const items = [...reel.querySelectorAll('.reel-item')];
  items.slice(-3).forEach(el => { el.dataset.near = 1; });   // 3 clips from the end: fetch the next page so the scroll never stops
  items.forEach(el => reelObserver.observe(el));
}

function pickMime(){
  const options = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return options.find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function openCamera(){
  const R = S.rec;
  try {
    stopStream();
    R.stream = await navigator.mediaDevices.getUserMedia({
      // 60 fps when the phone allows it: twice the frames means the trick AI loses the rider less.
      // Phones that can't do 60 quietly fall back to 30.
      video: {facingMode: {ideal: R.facing}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 60}}, audio: false});
    R.mode = 'live'; render(true);
  } catch (err){
    toast(err.name === 'NotAllowedError' ? 'Camera blocked. Allow camera access in your browser settings.' : 'Camera error: ' + err.message, 5000);
  }
}
function attachStream(){ const v = $('rec-live'); if (v && S.rec.stream){ v.srcObject = S.rec.stream; v.play().catch(() => {}); } }
function stopStream(){ const R = S.rec; if (R.stream){ R.stream.getTracks().forEach(t => t.stop()); R.stream = null; } }
// ---------- motion log ----------
// While recording, log the phone's spin rate (gyroscope) and acceleration, for the trick AI.
// Filmed on a selfie stick, the phone spins with the rider, so the gyro measures the trick itself;
// filmed by a friend, it records how the camera moved. Either way the video is unchanged, and
// phones without sensors (or that say no) simply post without a motion file.
const motion = {
  rows: [], t0: 0, on: false,
  // iPhones ask permission once, and only from a tap, so this runs on the record button.
  async allowed(){
    if (typeof DeviceMotionEvent === 'undefined') return false;
    if (typeof DeviceMotionEvent.requestPermission !== 'function') return true;
    try { return (await DeviceMotionEvent.requestPermission()) === 'granted'; } catch (e){ return false; }
  },
  onEvent(e){
    const r = e.rotationRate, a = e.accelerationIncludingGravity;
    if (!r || !a || r.alpha == null || a.x == null) return;
    const f = v => Math.round(v * 10) / 10;
    motion.rows.push([Math.round(performance.now() - motion.t0), f(r.alpha), f(r.beta), f(r.gamma), f(a.x), f(a.y), f(a.z)]);
  },
  start(){ this.rows = []; this.t0 = performance.now(); this.on = true; window.addEventListener('devicemotion', this.onEvent); },
  // Returns the log, or null when the phone sent too little to be worth keeping.
  stop(){
    if (!this.on) return null;
    this.on = false; window.removeEventListener('devicemotion', this.onEvent);
    if (this.rows.length < 20) return null;
    return {v: 1, cols: ['ms', 'rot_alpha', 'rot_beta', 'rot_gamma', 'acc_x', 'acc_y', 'acc_z'],
      units: 'deg/s, m/s² (acc includes gravity)', facing: S.rec.facing,
      orientation: (screen.orientation && screen.orientation.angle) || 0, rows: this.rows};
  },
};

async function startRecording(){
  const R = S.rec, mime = pickMime();
  if (!R.stream || R.starting) return;
  R.starting = true; R.useMotion = R.useMotion != null ? R.useMotion : await motion.allowed(); R.starting = false;
  if (!R.stream) return;
  R.chunks = []; R.motion = null;
  // 1.5 Mbit/s keeps a 20 s clip near 4 MB (the free database holds about 1 GB of video) and is still sharp at 720p.
  // Set the bitrate even when no type matched, or some phones pick 5+ Mbit/s on their own.
  R.recorder = new MediaRecorder(R.stream, {videoBitsPerSecond: 1500000, ...(mime ? {mimeType: mime} : {})});
  R.recorder.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.recorder.onstop = () => {
    const type = (R.recorder.mimeType || mime || 'video/webm').split(';')[0];
    R.blob = new Blob(R.chunks, {type});
    if (R.url) URL.revokeObjectURL(R.url);
    R.url = URL.createObjectURL(R.blob);
    R.motion = motion.stop();
    clearInterval(R.tick); clearTimeout(R.stopTimer);
    stopStream(); R.mode = 'review'; render(true);
  };
  R.recorder.start();   // one piece at the end: Safari has written broken MP4s when asked for small timed pieces
  if (R.useMotion) motion.start();
  R.startedAt = Date.now(); R.mode = 'recording';
  // Update just the button and timer, so the live preview keeps running
  const shutter = document.querySelector('.shutter'); shutter.classList.add('stop'); shutter.dataset.act = 'rec-stop';
  const timer = $('rec-timer'); timer.classList.add('live');
  R.tick = setInterval(() => { timer.textContent = `● ${((Date.now() - R.startedAt) / 1000).toFixed(1)}s / ${MAX_SECONDS}s`; }, 100);
  R.stopTimer = setTimeout(() => { if (R.recorder && R.recorder.state === 'recording') R.recorder.stop(); }, MAX_SECONDS * 1000);
}
function resetRecorder(keepContext){
  const R = S.rec;
  if (R.recorder && R.recorder.state === 'recording'){ R.recorder.onstop = null; R.recorder.stop(); }
  clearInterval(R.tick); clearTimeout(R.stopTimer); stopStream(); motion.stop();
  if (R.url) URL.revokeObjectURL(R.url);
  Object.assign(R, {mode: 'idle', recorder: null, chunks: [], blob: null, url: null, motion: null});
  if (!keepContext) R.context = null;
}

function syncCombo(firstId){

// ---------- offline outbox ----------
// No signal on the hill? Clips wait on the phone (in IndexedDB, the browser's own storage)
// and upload by themselves when the connection comes back.
const outbox = {
  _db: null,
  open(){
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('sendit', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('outbox', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async run(mode, fn){
    const dbh = await this.open();
    return new Promise((res, rej) => {
      const tx = dbh.transaction('outbox', mode), req = fn(tx.objectStore('outbox'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  },
  add(item){ return this.run('readwrite', s => s.put(item)); },
  all(){ return this.run('readonly', s => s.getAll()); },
  remove(id){ return this.run('readwrite', s => s.delete(id)); },
};
const looksOffline = err => !navigator.onLine || /fetch|network|load failed|timed? ?out/i.test(String(err && err.message));
async function queueClip(item){
  await outbox.add({id: crypto.randomUUID(), recordedAt: new Date().toISOString(), ...item});
  await updateOutboxChip();
}
async function updateOutboxChip(){
  let n = 0; try { n = (await outbox.all()).length; } catch (e) {}
  const chip = $('outbox-chip'); if (!chip) return;
  chip.hidden = !n || !S.me; chip.textContent = `📤 ${n} waiting`;
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !navigator.onLine || !S.me) return;
  flushing = true;
  let sent = 0;
  try {
    for (const it of await outbox.all()){
      try {
        const clipId = await uploadClip(it.fields, it.blob, it.motion);
        if (it.kind === 'duel') await duelMove(it.duelId, true, it.trick, clipId);
        await outbox.remove(it.id); sent++;
      } catch (err){
        if (looksOffline(err)) break;                 // still no signal: try again later
        await outbox.remove(it.id);                   // a real error (e.g. duel moved on): don't retry forever
        toast(`Couldn't upload a saved clip: ${err.message}`, 5000);
      }
    }
  } catch (e) { /* storage unavailable (private browsing) */ }
  flushing = false;
  await updateOutboxChip();
  if (sent){ toast(`📤 Uploaded ${sent} saved clip${sent > 1 ? 's' : ''}`); await refresh(); }
}
window.addEventListener('online', () => flushOutbox());

const motionPath = videoPath => videoPath.replace(/\.[^./]+$/, '.motion.json');
// Upload the recorded video and create the clip. Returns the new clip's id.
async function uploadClip(fields, blob = S.rec.blob, mot = S.rec.motion){
  if (!blob || !blob.size) throw new Error('Nothing recorded');
  if (blob.size > MAX_MB * 1024 * 1024) throw new Error(`Video is over ${MAX_MB} MB. Record a shorter clip.`);
  const type = blob.type || 'video/webm';
  const ext = type.includes('mp4') ? 'mp4' : type.includes('quicktime') ? 'mov' : 'webm';
  const path = `${myId()}/${crypto.randomUUID()}.${ext}`;  // must start with my user id (storage rule)
  const up = await db.storage.from('clips').upload(path, blob, {contentType: type});
  if (up.error) throw up.error;
  const {rider, ...cols} = fields;
  const ins = rider   // filmed a friend: the database checks you're friends and files it under them (017)
    ? await db.rpc('post_for_friend', {p_rider: rider, p_trick: cols.trick_id, p_grab: cols.grab, p_resort: cols.resort,
                                       p_video_path: path, p_combo: cols.combo || []}).then(r => ({...r, data: r.data && {id: r.data}}))
    : await db.from('clips').insert({...cols, video_path: path}).select('id').single();
  if (ins.error){ await db.storage.from('clips').remove([path]); throw ins.error; }
  // The motion log sits next to the video (abc.mp4 -> abc.motion.json). Best effort: storage
  // refuses JSON until supabase/015_motion.sql has run, and the clip is already posted either way.
  if (mot) await db.storage.from('clips').upload(motionPath(path),
    new Blob([JSON.stringify(mot)], {type: 'application/json'}), {contentType: 'application/json'}).catch(() => {});
  return ins.data.id;
}

// Android Chrome: we catch its install offer and fire it from our own button.
// iPhone: no website is allowed to trigger it, so we show the 2 taps (Share, then Add to Home Screen).

let installEvt = null;

const UA = navigator.userAgent;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true || store.get('installed', '') === '1';
const isIOS = () => /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/.test(UA);
function inAppBrowser(){   // '' when it's a real browser
  const m = UA.match(/Instagram|FBAN|FBAV|FB_IAB|Snapchat|musical_ly|BytedanceWebview|TikTok|LinkedInApp/);
  return m ? ({FBAN: 'Facebook', FBAV: 'Facebook', FB_IAB: 'Facebook', musical_ly: 'TikTok', BytedanceWebview: 'TikTok', LinkedInApp: 'LinkedIn'}[m[0]] || m[0]) : '';
}
const realBrowser = () => isIOS() ? 'Safari' : 'Chrome';
const SHARE_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function offerInstall(){
  if (!S.me || isInstalled() || !(isIOS() || isAndroid()) || $('install-sheet')) return;
  if (Date.now() < +store.get('install-later', '0')) return;
  const app = inAppBrowser();
  let body, go = '';
  if (app) body = `<p>You're in ${app}'s browser, which can't do it. Tap <b>•••</b> at the top, then <b>Open in ${realBrowser()}</b>, and sign in there.</p>`;
  else if (isAndroid() && installEvt){ body = '<p>One tap. It opens full screen, like a real app.</p>'; go = '<button class="btn primary" data-act="install-go">Add it</button>'; }
  else if (isAndroid()) body = '<ol><li>Tap <b>⋮</b> at the top right</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>)</li></ol>';
  else body = `<ol><li>Tap ${SHARE_IC} <b>Share</b> (on the newest iPhones it's under <b>•••</b>)</li><li>Scroll down, tap <b>Add to Home Screen</b></li></ol>`;

  sh.innerHTML = `<h3>Put Stomped on your home screen</h3>${body}

  document.body.appendChild(sh);

function patchClip(id, {keepText = true} = {}){
  const c = findClip(id), liked = S.myLikes.has(id), open = S.openComments === id;
  document.querySelectorAll(`[data-act="like"][data-id="${id}"]`).forEach(b => {

    b.classList.toggle('lit', open); b.setAttribute('aria-expanded', open);

  document.querySelectorAll(`article[id="clip-${id}"]`).forEach(card => {
    const old = card.querySelector(':scope > .comments');
    if (!open){ if (old) old.remove(); return; }
    const tmp = document.createElement('div'); tmp.innerHTML = commentsPanel(id);
    const panel = tmp.firstElementChild, typed = old && old.querySelector('input');
    if (keepText && typed && typed.value) panel.querySelector('input').value = typed.value;
    if (old) old.replaceWith(panel); else { panel.classList.add('opening'); card.appendChild(panel); }
  });
}

async function toggleComments(id){
  const prev = S.openComments;
  S.openComments = prev === id ? null : id;
  if (prev && prev !== id) patchClip(prev);
  patchClip(id);
  if (S.openComments !== id) return;
  try { await loadComments(id); } catch (err){ toast(err.message); }
  if (S.openComments !== id) return;   // closed again while loading
  patchClip(id);
  const input = $('comment-' + id); if (input) input.focus({preventScroll: true});
}
async function sendComment(clipId, input){
  const body = input.value.trim(); if (!body) return;
  input.disabled = true;
  const r = await db.from('comments').insert({clip_id: clipId, body});
  if (r.error){ toast('Comment failed: ' + r.error.message); input.disabled = false; return; }
  await loadComments(clipId);
  const c = findClip(clipId); if (c) c.comments = [{count: S.comments[clipId].length}];
  patchClip(clipId, {keepText: false});
  const last = document.querySelector(`article[id="clip-${clipId}"] .comments .comment:last-of-type`);
  if (last) last.classList.add('new');
  const again = $('comment-' + clipId); if (again) again.focus({preventScroll: true});
}
async function deleteComment(id, clipId){
  const r = await db.from('comments').delete().eq('id', id);
  if (r.error){ toast('Delete failed: ' + r.error.message); return; }
  await loadComments(clipId);
  const c = findClip(clipId); if (c) c.comments = [{count: S.comments[clipId].length}];
  patchClip(clipId);
}

// ---------- reports, removing your clips, deleting your account (supabase/011_beta.sql) ----------
const notInstalled = err => /reports|hide_my_clip|delete_my_account/.test(err.message || '') && /exist|find|schema cache/.test(err.message || '');
async function report(target, reason, clipId){
  S.menuFor = null;
  const r = await db.from('reports').insert({...target, reason});
  if (r.error){
    toast(r.error.code === '23505' ? 'You already reported this.' : notInstalled(r.error) ? "Reporting isn't switched on yet." : 'Report failed: ' + r.error.message);
    return render(true);
  }
  // Out of your sight right away, whatever anyone else decides
  if (target.clip_id){ S.clips = S.clips.filter(c => c.id !== target.clip_id); S.feed.rows = S.feed.rows.filter(c => c.id !== target.clip_id); }
  if (target.comment_id && S.comments[clipId]) S.comments[clipId] = S.comments[clipId].filter(m => m.id !== target.comment_id);
  toast('Thanks, reported. You won\'t see it again.');
  render(true);
}
async function removeClip(id){
  if (!confirm('Remove this clip? The video is deleted for good. Your points stay.')) return;
  const r = await db.rpc('hide_my_clip', {p_clip: id});
  if (r.error){ toast(notInstalled(r.error) ? "Removing verified clips isn't switched on yet." : 'Remove failed: ' + r.error.message); return; }
  if (r.data) await db.storage.from('clips').remove([r.data, motionPath(r.data)]);
  S.menuFor = null; toast('Clip removed');
  await refresh(true);
}
async function deleteAccount(b){
  b.disabled = true; b.textContent = 'Deleting…';
  try {
    // Videos live in file storage, outside the tables, so delete them first
    const files = mustOk(await db.storage.from('clips').list(myId(), {limit: 1000}));
    if (files.length) mustOk(await db.storage.from('clips').remove(files.map(f => `${myId()}/${f.name}`)));
    mustOk(await db.rpc('delete_my_account'));
    S.confirmDelete = false;
    toast('Your account is deleted.', 5000);
    await db.auth.signOut();
  } catch (err){
    b.disabled = false; b.textContent = 'Delete everything';
    toast(notInstalled(err) ? "Account deletion isn't switched on yet." : 'Delete failed: ' + err.message, 5000);
  }
}

async function submitPost(){
  const fields = {trick_id: $('post-trick').value, grab: $('post-grab').value, resort: $('post-resort').value};
  if (S.postCombo.length) fields.combo = [...S.postCombo];   // only sent for combos, so plain posts work without 014
  const rider = S.postRider && acceptedFriends().map(f => f.other).find(p => p && p.id === S.postRider);
  if (rider) fields.rider = rider.id;
  const blob = S.rec.blob, mot = S.rec.motion;
  S.busy = true; const b = $('post-btn'); b.disabled = true; b.textContent = 'Uploading…';
  try {
    if (!navigator.onLine) throw new Error('offline');
    await uploadClip(fields, blob);
    resetRecorder(); S.postCombo = [];
    if (rider){   // stay on the camera: you're probably filming the next run too
      toast(`Sent to @${rider.username}. It shows up once they tap Keep.`, 4000);
      render(true); return;
    }
    toast('Posted. Riders are judging it now.');
    S.tab = 'feed'; S.feed.mode = 'clips'; await refresh(true); window.scrollTo(0, 0);
  } catch (err){
    if (looksOffline(err) && blob){
      try {
        await queueClip({kind: 'post', fields, blob, motion: mot});
        resetRecorder(); S.postCombo = []; S.tab = 'feed'; S.feed.mode = 'clips'; render(true); window.scrollTo(0, 0);
        toast("No signal. Saved on your phone, and it uploads when you're back online.", 5000);
        return;
      } catch (e) { /* couldn't save it either: fall through to the error */ }
    }
    console.error(err); toast('Post failed: ' + err.message, 5000);
    b.disabled = false; b.textContent = 'Post';
  } finally { S.busy = false; }
}

async function duelMove(duelId, landed, trickId, clipId){
  const r = await db.rpc('duel_move', {p_duel: duelId, p_landed: landed, p_trick: trickId || null, p_clip: clipId || null});
  if (r.error){ toast(r.error.message, 5000); return false; }

function startDuelRecording(kind){
  const d = S.duels.find(x => x.id === S.duelId); if (!d) return;
  const trickId = kind === 'set' ? $('duel-trick').value : d.trick_id;
  resetRecorder();
  S.rec.context = {duelId: d.id, kind, trickId, otherName: d.other.username};
  S.tab = 'record'; render(true); window.scrollTo(0, 0);
}
async function sendDuelClip(){
  const ctx = S.rec.context, b = $('duel-send');
  const fields = {trick_id: ctx.trickId, grab: 'No grab', resort: S.me.home_resort || RESORTS[0]}, blob = S.rec.blob, mot = S.rec.motion;
  S.busy = true; b.disabled = true; b.textContent = 'Uploading…';
  try {
    if (!navigator.onLine) throw new Error('offline');
    const clipId = await uploadClip(fields, blob);
    if (await duelMove(ctx.duelId, true, ctx.kind === 'set' ? ctx.trickId : null, clipId)){
      toast(ctx.kind === 'set' ? `Sent! ${ctx.otherName} has to match it.` : 'Matched! Their turn to set.');
      resetRecorder(); await refresh(true); await openDuel(ctx.duelId);
    } else { b.disabled = false; b.textContent = 'Landed: send it'; }
  } catch (err){
    if (looksOffline(err) && blob){
      try {
        await queueClip({kind: 'duel', fields, blob, motion: mot, duelId: ctx.duelId, trick: ctx.kind === 'set' ? ctx.trickId : null});
        const dId = ctx.duelId; resetRecorder(); await openDuel(dId);
        toast("No signal. Your attempt is saved and sends when you're back online.", 5000);
        return;
      } catch (e) { /* fall through */ }
    }
    toast('Upload failed: ' + err.message, 5000); b.disabled = false; b.textContent = 'Landed: send it';
  } finally { S.busy = false; }
}
async function bail(){
  const d = S.duels.find(x => x.id === S.duelId); if (!d) return;
  const trick = d.phase === 'set' ? ($('duel-trick') || {}).value : null;
  if (await duelMove(d.id, false, trick, null)){
    toast(d.phase === 'set' ? 'Bailed. Their turn to set.' : 'Letter taken. Shake it off.');
    await refresh(true);
  }
}

async function submitAuth(){
  const email = $('auth-email').value.trim(), password = $('auth-pass').value;
  const username = $('auth-user') ? $('auth-user').value.trim() : '';
  if (S.authMode === 'signup' && !/^[A-Za-z0-9_.-]{3,24}$/.test(username)){
    toast('Username: 3–24 letters, numbers, _ . or -'); return;
  }
  // Only disable the button. Calling render() here would rebuild the form and empty its boxes.
  const btn = document.querySelector('#auth-form button[type=submit]');
  S.busy = true; btn.disabled = true;
  try {
    if (S.authMode === 'signup'){
      const taken = await db.from('profiles').select('id').eq('username', username).maybeSingle();
      if (taken.data){ toast('That username is taken. Try another.'); return; }
      // The confirmation email links back to wherever this page is running (laptop or online)
      const r = await db.auth.signUp({email, password,
        options: {data: {username}, emailRedirectTo: location.origin + location.pathname}});
      if (r.error) throw r.error;
      if (!r.data.session){
        S.authMode = 'signin'; render();
        $('auth-email').value = email;
        toast('Check your email and click the confirmation link, then sign in here.', 8000);
      }
    } else {
      const r = await db.auth.signInWithPassword({email, password});
      if (r.error) throw r.error;
    }
  } catch (err){
    const msg = /not confirmed/i.test(err.message) ? 'Confirm your email first (check your inbox).'
      : /invalid login/i.test(err.message) ? 'Wrong email or password.'
      : err.message;
    toast(msg, 5000);
  } finally {
    S.busy = false;
    const b = document.querySelector('#auth-form button[type=submit]'); if (b) b.disabled = false;
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'tab': return openTab(b.dataset.tab, b.dataset.focus);
    case 'rider': return openGear();
    case 'authmode': S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; return render(true);
    case 'join': {
      S.authMode = b.dataset.mode; render(true);
      $('auth-top').scrollIntoView({behavior: 'smooth', block: 'start'});
      setTimeout(() => { const f = $('auth-user') || $('auth-email'); if (f) f.focus({preventScroll: true}); }, 450);
      return;
    }
    case 'close-splash': return closeSplash();
    case 'ob-sport': setRides(b.dataset.k); return onboardResort();
    case 'ob-resort': return finishOnboarding(b.dataset.k);
    case 'reward-collect': { $('overlay').innerHTML = ''; const r = S.rewardRankUp; S.rewardRankUp = null; if (r) showRankUp(r); return; }
    case 'play': { const v = b.tagName === 'VIDEO' ? b : b.querySelector('video'); if (v) v.paused ? v.play().catch(() => {}) : v.pause(); return; }
    case 'mute': {
      const v = b.closest('.player, .feed-item').querySelector('video'); v.muted = !v.muted;
      b.setAttribute('aria-label', v.muted ? 'Turn sound on' : 'Turn sound off');
      b.innerHTML = `<svg viewBox="0 0 24 24">${SPEAKER}${v.muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>'}</svg>`;
      if (!v.muted && v.paused) v.play().catch(() => {});
      return;
    }
    case 'flush': toast(navigator.onLine ? "Uploading saved clips…" : "Still no signal. They'll send automatically."); return flushOutbox();
    case 'close-modal': $('overlay').innerHTML = ''; return;
    case 'install-go': return installGo();
    case 'install-later': store.set('install-later', String(Date.now() + 3 * 864e5)); return hideInstall();   // ask again in 3 days
    case 'judge-done': $('overlay').innerHTML = ''; return openTab('feed');
    // judging
    case 'askreason': { const was = S.judge.reasonFor; S.judge.reasonFor = id; refreshReelItem(was); return refreshReelItem(id); }
    case 'noreason': { const was = S.judge.reasonFor; S.judge.reasonFor = null; return refreshReelItem(was); }
    case 'vote': b.disabled = true; return vote(id, b.dataset.y === '1', b.dataset.reason);
    case 'skip': return nextReel(id);
    // feed
    case 'delete': return deleteClip(id);
    case 'share-card': return shareCard(id);
    case 'session-card': return sessionCard();
    case 'like': return toggleLike(id);
    case 'comments': return toggleComments(id);
    case 'delcomment': return deleteComment(id, b.dataset.clip);
    case 'profile': return openProfile(id);
    case 'me': return openProfile(myId());
    case 'ach-all': S.achAll = true; return render(true);
    case 'back': return openTab(S.prevTab || 'feed');
    case 'book':
      if (S.tab !== 'book') S.bookBack = S.tab;
      if (S.tab === 'record') resetRecorder();
      S.tab = 'book'; S.book = null; render(true); window.scrollTo(0, 0);
      try { await loadBook(id, b.dataset.name); } catch (err){ toast(err.message); }
      return render(true);
    case 'crew-invite': {
      const c = S.crew.mine; if (!c) return;
      const url = `${location.origin}${location.pathname}?crew=${c.code}`, text = `Join my crew ${c.name} on Stomped. Code: ${c.code}`;
      if (navigator.share){ try { await navigator.share({title: `${c.name} on Stomped`, text, url}); } catch (e) {} return; }
      try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Crew invite copied. Paste it to your friends.'); }
      catch (e) { toast(`Code: ${c.code}`, 6000); }
      return;
    }
    case 'crew-leave': {
      const c = S.crew.mine; if (!c) return;
      const alone = S.crew.members.length <= 1;
      if (!confirm(alone ? `Leave ${c.name}? You're the last one in it, so the crew will be deleted.` : `Leave ${c.name}?`)) return;
      const r = await db.rpc('leave_crew'); if (r.error){ toast(r.error.message); return; }
      await loadCrew(); toast(`You left ${c.name}.`); return render(true);
    }
    case 'crew-board': S.board.scope = 'crews'; S.squad = 'ranks'; return openTab('duels');
    case 'squad-go': S.squad = b.dataset.k; store.set('squad', S.squad); return openTab('duels');
    case 'squad':
      S.squad = b.dataset.k; store.set('squad', S.squad); S.duelId = null;
      if (S.squad === 'ranks'){ try { await loadBoard(); } catch (err){ toast(err.message); } }
      return render(true);
    case 'invite': {
      const url = `${location.origin}${location.pathname}?from=${encodeURIComponent(S.me.username)}`;
      const text = `Get on Stomped with me: film tricks, riders judge them, rank up. I'm @${S.me.username}.`;
      if (navigator.share){ try { await navigator.share({title: 'Stomped', text, url}); } catch (e) {} return; }
      try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Invite link copied. Paste it to your friends.'); }
      catch (e) { toast(url, 6000); }
      return;
    }
    case 'book-back': return openTab(S.bookBack || 'ranks');
    case 'book-sport': S.book.sport = b.dataset.k; return render(true);
    case 'book-tip': S.bookTip = S.bookTip === id ? null : id; return render(true);
    case 'book-record': S.postPreset = id; S.sport = sportOf(trickById(id)); store.set('sport', S.sport); return openTab('record');
    case 'totdpost': { const k = b.dataset.k || S.sport; if (!S.totds[k]) return; S.sport = k; store.set('sport', k); S.postPreset = S.totds[k]; return openTab('record'); }
    case 'playtile': {
      const v = b.querySelector('video'); if (!v) return;
      if (v.paused){ document.querySelectorAll('.tile video').forEach(o => o.pause()); v.muted = false; v.play(); } else v.pause();
      return;
    }
    // ranks
    case 'clip-menu': {
      S.menuFor = S.menuFor === id ? null : id;
      const item = document.querySelector(`.feed-item[id="clip-${id}"]`);
      if (!item) return render(true);
      document.querySelectorAll('.feed-item > .clip-menu').forEach(m => m.remove());
      const c = findClip(id); if (S.menuFor === id && c) item.insertAdjacentHTML('beforeend', clipMenu(c, c.user_id === myId()));
      return;
    }
    case 'share-link': return shareClipLink(id);
    case 'report': return report({clip_id: id}, b.dataset.k);
    case 'report-comment': return report({comment_id: id}, 'inappropriate', b.dataset.clip);
    case 'remove-clip': return removeClip(id);
    case 'filmed-keep': return answerFilmed(id, true);
    case 'filmed-nope': return answerFilmed(id, false);
    case 'feedback': S.feedbackOpen = !S.feedbackOpen; return render(true);
    case 'feedback-send': return sendFeedback(b);
    case 'delete-account': S.confirmDelete = !S.confirmDelete; return render(true);
    case 'delete-account-yes': return deleteAccount(b);
    case 'feed-mode':
      if (S.feed.mode === b.dataset.k) return;
      S.feed.mode = b.dataset.k; if (b.dataset.k === 'judge') startJudge();
      render(true); return window.scrollTo(0, 0);
    case 'feed-more':
      S.feed.limit += FEED_PAGE; b.disabled = true; b.textContent = 'Loading…';
      try { await loadFeed(); } catch (err){ toast(err.message); }
      return render(true);
    case 'scope': S.board.scope = b.dataset.k; try { await loadBoard(); } catch (err){ toast(err.message); } return render(true);
    case 'period': S.board.period = b.dataset.k; try { await loadBoard(); } catch (err){ toast(err.message); } return render(true);
    case 'signout': resetRecorder(); return db.auth.signOut();
    // record
    case 'sport':
      S.sport = b.dataset.k; store.set('sport', S.sport);
      if (S.sports !== 'both'){ S.sports = S.sport; store.set('sports', S.sports); }   // a skier switching to snowboard now rides snowboard
      if (S.rec.mode === 'review'){ const box = $('post-form'); if (box){ box.outerHTML = postForm(); syncPost(); } return; }
      return render(true);
    case 'cam-open': return openCamera();
    case 'cam-flip': if (S.rec.mode === 'recording') return; S.rec.facing = S.rec.facing === 'environment' ? 'user' : 'environment'; return openCamera();
    case 'cam-close': resetRecorder(true); return render(true);
    case 'rec-start': return startRecording();
    case 'rec-stop': if (S.rec.recorder && S.rec.recorder.state === 'recording') S.rec.recorder.stop(); return;
    case 'retake': resetRecorder(true); return openCamera();

    case 'rec-cancel': { const dId = S.rec.context && S.rec.context.duelId; resetRecorder(); return dId ? openDuel(dId) : render(true); }
    // friends & duels
    case 'add-friend': return addFriend(id);
    case 'accept-friend': return acceptFriend(id);
    case 'remove-friend': return removeFriend(id);
    case 'challenge': return challenge(id);
    case 'open-duel': return openDuel(id);

    case 'duel-bail': case 'duel-miss': return bail();

      { const r = await db.rpc('forfeit_duel', {p_duel: S.duelId}); if (r.error) toast(r.error.message); }
      return refresh(true);
  }
});

  if (id === 'duel-trick') S.duelTrick = e.target.value;
  if (id === 'ride-pref'){ setRides(e.target.value); toast('Saved'); render(true); }
  if (id === 'board-resort'){ S.board.resort = e.target.value; try { await loadBoard(); } catch (err){ toast(err.message); } render(true); }
  if (id === 'home-resort'){
    const r = await db.from('profiles').update({home_resort: e.target.value || null}).eq('id', myId());
    if (r.error) toast('Could not save: ' + r.error.message);
    else { toast('Home mountain saved'); await refresh(true); }
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'post-form' && !S.busy) submitPost();
  else if (f.id === 'auth-form' && !S.busy) submitAuth();
  else if (f.classList.contains('comment-form')) sendComment(f.dataset.clip, f.querySelector('input'));
  else if (f.id === 'crew-join' && !S.busy){
    const code = $('crew-code').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(code)){ toast('Invite codes are 6 letters and numbers.'); return; }
    S.busy = true;
    const r = await db.rpc('join_crew', {p_code: code});
    S.busy = false;
    if (r.error){ toast(r.error.message); return; }
    S.crewPrefill = null; await loadCrew(); toast(`Welcome to ${S.crew.mine ? S.crew.mine.name : 'the crew'}!`); render(true);
  }
  else if (f.id === 'crew-create' && !S.busy){
    const name = $('crew-name').value.trim(), tag = $('crew-tag').value.trim().toUpperCase();
    if (name.length < 3){ toast('Crew names need at least 3 characters.'); return; }
    if (!/^[A-Z0-9]{2,4}$/.test(tag)){ toast('The tag is 2–4 letters or numbers, like CUF.'); return; }
    S.busy = true;
    const r = await db.rpc('create_crew', {p_name: name, p_tag: tag});
    S.busy = false;
    if (r.error){ toast(r.error.message); return; }
    await loadCrew(); toast(`${name} is live. Send your invite code to your friends.`); render(true);
  }
  else if (f.id === 'friend-search'){
    const q = $('friend-q').value.trim(); S.search.q = q;
    if (q.length < 2){ toast('Type at least 2 letters'); return; }
    const r = await db.from('profiles').select(PROFILE_BITS).ilike('username', `%${q.replace(/[%_,()]/g, '')}%`).neq('id', myId()).limit(10);
    if (r.error){ toast(r.error.message); return; }
    S.search.results = r.data; render(true);
  }
});

// ---------- installable app: keep a copy on the phone so it opens with no signal ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- snow ----------
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const snow = $('snow');
  for (let i = 0; i < 36; i++){
    const f = document.createElement('i'), size = 1.5 + Math.random() * 3;
    f.style.cssText = `left:${Math.random() * 100}vw;width:${size}px;height:${size}px;opacity:${.2 + Math.random() * .5};` +
      `--drift:${(Math.random() - .5) * 80}px;animation-duration:${9 + Math.random() * 12}s;animation-delay:${-Math.random() * 20}s`;
    snow.appendChild(f);
  }
}

// ---------- crew invite links (?crew=CODE): remember the code through sign-up ----------
{
  const code = new URLSearchParams(location.search).get('crew');
  if (code && /^[A-Za-z0-9]{6}$/.test(code)){
    store.set('pending-crew', code.toUpperCase());
    history.replaceState(null, '', location.pathname);
  }
}
// ---------- app invites (?from=USERNAME): after sign-up, offer to add the friend who sent it ----------
{
  const from = new URLSearchParams(location.search).get('from');
  if (from && /^[\w.-]{2,24}$/.test(from)){
    store.set('pending-from', from);
    history.replaceState(null, '', location.pathname);
  }
}
async function offerInviter(){
  const from = store.get('pending-from', '');
  if (!from) return;
  store.set('pending-from', '');
  if (from.toLowerCase() === S.me.username.toLowerCase()) return;
  const r = await db.from('profiles').select(PROFILE_BITS).eq('username', from).maybeSingle();
  if (r.error || !r.data) return;   // renamed or deleted: nothing to offer
  if (S.friends.some(f => f.other && f.other.id === r.data.id)) return;
  S.squad = 'friends'; S.search = {...(S.search || {}), q: from, results: [r.data]};
  if (store.get('pending-clip', '')) return;   // a clip link wins; they can add them from the clip
  await openTab('duels');
  toast(`@${from} invited you. Tap Add to be friends.`, 5000);
}
// ---------- clip links (?clip=ID): open that exact clip, even after signing up first ----------
{
  const id = new URLSearchParams(location.search).get('clip');
  if (id && /^[0-9a-f-]{36}$/i.test(id)){
    store.set('pending-clip', id.toLowerCase());
    history.replaceState(null, '', location.pathname);
  }
}
async function shareClipLink(id){
  const c = findClip(id); if (!c) return;
  const who = c.user_id === myId() ? 'my' : '@' + (c.profiles ? c.profiles.username : 'a rider') + "'s";
  const url = `${location.origin}${location.pathname}?clip=${c.id}`, name = clipName(c);
  const text = c.status === 'pending' ? `Did ${who === 'my' ? 'I' : who.slice(0, -2)} land this ${name}? Judge it on Stomped.`
    : c.status === 'verified' ? `Watch ${who} ${name}. Verified on Stomped.` : `Watch ${who} ${name} on Stomped.`;
  if (navigator.share){ try { await navigator.share({title: `${name} on Stomped`, text, url}); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Link copied. Paste it to your friends.'); }
  catch (e) { toast(url, 6000); }
}
async function openPendingClip(){
  const id = store.get('pending-clip', '');
  if (!id) return;
  store.set('pending-clip', '');
  const r = await db.from('clips').select(CLIP_SELECT).eq('id', id).maybeSingle();
  if (r.error){ toast("Couldn't open that clip. Check your signal and tap the link again.", 4500); return; }
  if (!r.data || !shownClip(r.data)){ toast("That clip was removed, so it can't be shown.", 4500); return; }
  await loadFilmers([r.data]);
  S.feed.pin = findClip(id) || r.data;
  await openTab('feed');
  try { await loadFeed(); } catch (e) {}
  render(true);
  const el = $('clip-' + id); if (el) el.scrollIntoView({block: 'start'});
}
function offerPendingCrew(){
  const code = store.get('pending-crew', '');
  if (!code || !S.crew.ready) return;
  store.set('pending-crew', '');
  if (S.crew.mine) return;
  S.crewPrefill = code; S.tab = 'duels'; render(true);
  toast('You were invited to a crew. Tap Join.', 5000);
}

// Supabase warns against awaiting its own calls inside this callback, so hand off with setTimeout.
db.auth.onAuthStateChange((event, session) => {
  setTimeout(async () => {
    const was = S.session && S.session.user.id, now = session && session.user.id;
    S.session = session;
    if (!now){ S.me = null; seenStatus = null; S.tab = 'lodge'; S.splashDone = false; render(true); return; }
    if (was !== now){ S.tab = 'lodge'; await refresh(true); if (S.me){ const setup = showOnboarding(); if (!setup) showSplash(); flushOutbox(); offerPendingCrew(); openPendingClip(); if (!setup){ offerInviter(); setTimeout(offerInstall, 6000); } } }
  }, 0);
});
