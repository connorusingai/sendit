<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sendit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F2F6FA; --ink:#0F1C2B; --muted:#5A6A7B;
  --line:#D3DDE7; --accent:#F2621C; --accent-ink:#FFFFFF; --accent-soft:#FDE6DA;
  --good:#1B8F52; --good-soft:#DDF3E6; --bad:#C93636; --bad-soft:#F8E0E0;
  --trail-green:#1E9E5A; --trail-blue:#1F5FD1; --trail-black:#111418; --trail-edge:transparent;
  --poster-a:#A9CBEA; --poster-b:#EAF2F9; --slope:#FFFFFF; --poster-ink:#0F1C2B;
  --shadow:0 1px 2px rgba(15,28,43,.06),0 4px 14px rgba(15,28,43,.06);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#09131F; --surface:#112033; --surface-2:#0D1A2A; --ink:#E3ECF5; --muted:#8FA2B7;
    --line:#21364F; --accent:#FF7A3A; --accent-ink:#1A0A02; --accent-soft:#3A2012;
    --good:#43C983; --good-soft:#12301F; --bad:#F06868; --bad-soft:#3A1717;
    --trail-green:#2FB56C; --trail-blue:#4C86EE; --trail-black:#05070A; --trail-edge:#8FA2B7;
    --poster-a:#1C3858; --poster-b:#0F2238; --slope:#D8E4EF; --poster-ink:#E3ECF5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09131F; --surface:#112033; --surface-2:#0D1A2A; --ink:#E3ECF5; --muted:#8FA2B7;
  --line:#21364F; --accent:#FF7A3A; --accent-ink:#1A0A02; --accent-soft:#3A2012;
  --good:#43C983; --good-soft:#12301F; --bad:#F06868; --bad-soft:#3A1717;
  --trail-green:#2FB56C; --trail-blue:#4C86EE; --trail-black:#05070A; --trail-edge:#8FA2B7;
  --poster-a:#1C3858; --poster-b:#0F2238; --slope:#D8E4EF; --poster-ink:#E3ECF5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer}
.me-chip b{font-family:var(--mono);font-size:13px}
.proto{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);
  border-radius:8px;padding:8px 10px;margin-block:0 14px}

h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.3px;
  margin:6px 0 2px;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* rank medals: hexagon badges with a metal sheen */
.sym{display:inline-block;flex:none;vertical-align:middle}
.medal{width:14px;height:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.m-bronze{background:linear-gradient(145deg,#E3A06A,#A0592A 60%,#7A3F19)}
.m-silver{background:linear-gradient(145deg,#F2F5F8,#A9B4BF 60%,#7D8893)}
.m-gold{background:linear-gradient(145deg,#FFE27A,#E0A718 60%,#A87400)}
.m-plat{background:linear-gradient(145deg,#D8FBF6,#6FCFC4 60%,#3C958B)}
.m-diamond{background:linear-gradient(145deg,#D9ECFF,#6FA8FF 55%,#3D5BE0)}
.m-legend{background:linear-gradient(145deg,#FFC08A,#F2621C 50%,#B0217A)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);flex:none}
.avatar.you{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.who{min-width:0;flex:1}
.who .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.who .meta{font-size:12px;color:var(--muted)}
.poster{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;
  background:linear-gradient(170deg,var(--poster-a),var(--poster-b));}
.poster::before{content:"";position:absolute;inset:0;background:var(--slope);opacity:.9;
  clip-path:polygon(0 72%,38% 52%,62% 58%,100% 30%,100% 100%,0 100%)}
.poster .kick{position:absolute;left:44%;top:46%;width:18%;height:14%;background:var(--slope);
  clip-path:polygon(0 100%,100% 0,100% 100%);opacity:.95}
.poster .tname{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:900;
  font-size:34px;line-height:.95;text-transform:uppercase;color:var(--poster-ink);mix-blend-mode:normal}
.poster .play{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:rgba(15,28,43,.72);color:#fff;border-radius:6px;padding:4px 7px;text-transform:uppercase}
video.clip{display:block;width:100%;max-width:100%;aspect-ratio:16/10;background:#000;object-fit:cover}
.card-foot{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trick{font-weight:700;font-size:15px}
.trick small{font-weight:500;color:var(--muted)}
.pts{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .y{background:var(--good)} .meter .n{background:var(--bad)}
.hint{font-size:12px;color:var(--muted)}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
select,input[type=file],input[type=email],input[type=password],input:not([type]){width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--surface-2);border-radius:10px;padding:12px 14px}
.preview .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--accent)}
.stamp{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.stamp span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

/* ranks */
.me-card{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.me-card{gap:10px}
.rank-line{display:flex;align-items:center;gap:12px}
.medal.big{width:34px;height:39px}
.rank-name{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:28px 34px 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board li.you{background:var(--accent-soft)}
.board .n{font-family:var(--mono);font-weight:700;color:var(--muted);text-align:right}
.board .score{font-family:var(--mono);font-weight:700;text-align:right}

/* duels */
.letters{display:flex;gap:6px}
.letters b{width:30px;height:34px;display:grid;place-items:center;border-radius:6px;font-family:var(--display);
  font-weight:900;font-size:22px;border:1.5px dashed var(--line);color:var(--line)}
.letters b.hit{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 14px}
.vs .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vs .side.r{align-items:flex-end}
.vs .mid{font-family:var(--display);font-weight:900;font-size:22px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.log li.hot{border-left-color:var(--accent);color:var(--ink)}
.turn{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.turn .what{font-weight:700}
.opp-list{display:flex;flex-direction:column}
.opp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.opp:first-child{border-top:0}
.opp:hover{background:var(--surface-2)}
.opp .odds{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);
  font-size:10px;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;
  max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:.4}}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Send<span>it</span></div>
    <button class="me-chip" data-act="tab" data-tab="ranks" id="me-chip" aria-label="Your rank" hidden></button>
  </header>
  <main id="view"><p class="sub">Loading…</p></main>
</div>
<div class="tabs" id="tabbar" hidden><nav id="tabs" style="grid-template-columns:repeat(4,1fr)"></nav></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------- connection ----------
// The publishable key is meant to be public. The real security is the rules in
// supabase/001_schema.sql, which the database enforces no matter what this page does.
const SUPABASE_URL = 'https://kyabslzotdtcwtjcygew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sP394lJIxwiubaTzlkwSrg_poXVTb27';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- catalog ----------
// Trick names and points come from the database; these are just menu choices.
const CATS = ['Park','Rails','Pipe','Moguls','Backcountry'];
const GRABS = ['No grab','Mute','Safety','Japan','Tail','Critical'];
const RESORTS = ['Eldora','Winter Park','Copper','Arapahoe Basin','Breckenridge','Keystone'];
const REASONS = [['fell','Fell'],['wrong_trick','Wrong trick'],['cant_see',"Can't see"]];
const MAX_MB = 50; // Supabase free plan limit per file
const TIERS = [
  {min:1800,name:'Legend',key:'legend'},{min:1600,name:'Diamond',key:'diamond'},
  {min:1400,name:'Platinum',key:'plat'},{min:1200,name:'Gold',key:'gold'},
  {min:1000,name:'Silver',key:'silver'},{min:0,name:'Bronze',key:'bronze'},
];
const TRICK_TIERS = [
  {min:5000,name:'Legend',key:'legend',w:2.25},{min:3500,name:'Diamond',key:'diamond',w:2},
  {min:2000,name:'Platinum',key:'plat',w:1.75},{min:1000,name:'Gold',key:'gold',w:1.5},
  {min:500,name:'Silver',key:'silver',w:1.25},{min:0,name:'Bronze',key:'bronze',w:1},
];
const tierOf = r => TIERS.find(t => r >= t.min);
const trickTierOf = p => TRICK_TIERS.find(t => p >= t.min);

// ---------- state ----------
const S = {
  tab: 'feed', session: null, me: null,
  tricks: [], clips: [], myVotes: new Set(), leaders: [],
  authMode: 'signin', reasonFor: null, busy: false,
};
let seenStatus = null; // my clip id -> status, so we notice when one gets verified

// ---------- helpers ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
const sym = key => `<span class="sym medal m-${key}"></span>`;
const tierTag = t => `<span class="tier">${sym(t.key)}${t.name}</span>`;
const $ = id => document.getElementById(id);
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60); return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}
let toastTimer;
function toast(msg, ms = 2800){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const trickById = id => S.tricks.find(t => t.id === id) || {id, name: id, category: '', pts: 0};
const points = (trickId, grab) => Math.round(trickById(trickId).pts * (grab && grab !== 'No grab' ? 1.2 : 1));
const videoUrl = path => db.storage.from('clips').getPublicUrl(path).data.publicUrl;
const myId = () => S.session && S.session.user.id;
const mustOk = r => { if (r.error) throw r.error; return r.data; };

// ---------- loading from the database ----------
async function loadAll(){
  if (!S.tricks.length) S.tricks = mustOk(await db.from('tricks').select('*').order('pts'));
  const [me, clips, votes] = await Promise.all([
    db.from('profiles').select('*').eq('id', myId()).single(),
    db.from('clips').select('*, profiles!clips_user_id_fkey(username, points)').order('created_at', {ascending: false}).limit(60),
    db.from('votes').select('clip_id'),  // the database only returns MY votes
  ]);
  const before = S.me;
  S.me = mustOk(me);
  S.clips = mustOk(clips);
  S.myVotes = new Set(mustOk(votes).map(v => v.clip_id));
  noticeResults(before);
}
async function loadLeaders(){
  S.leaders = mustOk(await db.from('profiles').select('id, username, points, rating, home_resort')
    .order('points', {ascending: false}).limit(50));
}

// Toast when one of my clips gets decided while the app is open.
function noticeResults(before){
  const mine = S.clips.filter(c => c.user_id === myId());
  if (seenStatus){
    for (const c of mine){
      if (seenStatus[c.id] !== 'pending' || c.status === 'pending') continue;
      const name = trickById(c.trick_id).name;
      if (c.status === 'verified'){
        const up = before && trickTierOf(S.me.points) !== trickTierOf(before.points);
        toast(up ? `Rank up! You reached ${trickTierOf(S.me.points).name} trick rank`
                 : `✅ Verified! ${name} earned +${c.points_awarded} pts`, 4000);
      } else toast(`The community didn't verify your ${name}`, 4000);
    }
  }
  seenStatus = Object.fromEntries(mine.map(c => [c.id, c.status]));
}

// ---------- views ----------
function clipCard(c, {judge = false} = {}){
  const t = trickById(c.trick_id), mine = c.user_id === myId();
  const who = judge ? 'Anonymous skier' : (c.profiles ? c.profiles.username : 'Skier');
  const whoPts = !judge && c.profiles ? sym(trickTierOf(c.profiles.points).key) : '';
  const media = c.video_path
    ? `<video class="clip" src="${esc(videoUrl(c.video_path))}" controls playsinline muted preload="metadata"></video>`
    : `<div class="poster" role="img" aria-label="${esc(t.name)}"><div class="kick"></div>
         <span class="play">No video</span><div class="tname">${esc(t.name)}</div></div>`;
  let status;
  if (c.status === 'verified') status = `<span class="pill ok">Verified</span>`;
  else if (c.status === 'rejected') status = `<span class="pill no">Not verified</span>`;
  else status = `<span class="pill wait">Being judged</span>`;

  let actions = '';
  if (judge && S.reasonFor === c.id) actions = `
    <div class="label">What went wrong?</div>
    <div class="btns" style="grid-template-columns:1fr 1fr 1fr">${REASONS.map(([k, label]) =>
      `<button class="btn bad" data-act="vote" data-id="${c.id}" data-y="0" data-reason="${k}">${label}</button>`).join('')}</div>
    <button class="linkish" data-act="noreason">Cancel</button>`;
  else if (judge) actions = `<div class="btns">
      <button class="btn bad" data-act="askreason" data-id="${c.id}">Not landed</button>
      <button class="btn good" data-act="vote" data-id="${c.id}" data-y="1">Landed</button></div>`;
  else if (mine && c.status === 'pending')
    actions = `<button class="linkish" data-act="delete" data-id="${c.id}">Delete this clip</button>`;

  return `<article class="card">
    <div class="card-head">
      <div class="avatar ${mine && !judge ? 'you' : ''}">${judge ? '?' : esc(initials(who))}</div>
      <div class="who"><div class="name">${esc(who)} ${whoPts}</div>
        <div class="meta">${esc(c.resort || '')} · ${ago(c.created_at)}</div></div>
      ${status}
    </div>
    ${media}
    <div class="card-foot">
      <div class="row"><div class="trick">${esc(t.name)} <small>· ${esc(c.grab)} · ${esc(t.category)}</small></div>
        <div class="pts">+${c.status === 'verified' ? c.points_awarded : points(c.trick_id, c.grab)} pts</div></div>
      ${actions}
    </div>
  </article>`;
}

const judgeQueue = () => S.clips.filter(c => c.status === 'pending' && c.user_id !== myId() && !S.myVotes.has(c.id));

const views = {
  auth(){
    const up = S.authMode === 'signup';
    return `<h2>${up ? 'Join Sendit' : 'Sign in'}</h2>
      <p class="sub">${up ? 'Film a trick, get it verified by other skiers, and rank up from Bronze to Legend.'
                          : 'Welcome back.'}</p>
      <form class="card form" id="auth-form">
        ${up ? `<div class="field"><label class="label" for="auth-user">Username</label>
          <input id="auth-user" autocomplete="username" required minlength="3" maxlength="24"
            pattern="[A-Za-z0-9_.\\-]{3,24}" title="3–24 letters, numbers, _ . or -"></div>` : ''}
        <div class="field"><label class="label" for="auth-email">Email</label>
          <input id="auth-email" type="email" autocomplete="email" required></div>
        <div class="field"><label class="label" for="auth-pass">Password</label>
          <input id="auth-pass" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" required minlength="8">
          ${up ? '<span class="hint">At least 8 characters.</span>' : ''}</div>
        <button class="btn primary" type="submit" ${S.busy ? 'disabled' : ''}>${up ? 'Create account' : 'Sign in'}</button>
        <button class="linkish" type="button" data-act="authmode">${up ? 'Already have an account? Sign in' : 'New here? Create an account'}</button>
      </form>`;
  },
  feed(){
    return `<h2>Feed</h2><p class="sub">A trick only earns points after other skiers verify it.</p>
      <div class="stack">${S.clips.length ? S.clips.map(c => clipCard(c)).join('')
        : `<div class="card empty"><strong>No clips yet</strong>Be the first. Tap Post.</div>`}</div>`;
  },
  judge(){
    const me = trickTierOf(S.me.points), q = judgeQueue();
    return `<h2>Judge clips</h2>
      <p class="sub">You won't see who posted a clip, so judge the trick, not the skier. Your vote counts ×${me.w} at ${me.name} trick rank.</p>
      <div class="stack">${q.length ? q.map(c => clipCard(c, {judge: true})).join('')
        : `<div class="card empty"><strong>All caught up</strong>No clips are waiting for your vote.</div>`}</div>`;
  },
  post(){
    return `<h2>Post a trick</h2><p class="sub">Pick the trick you landed. Other skiers will judge it.</p>
    <form class="card form" id="post-form">
      <div class="field"><label class="label" for="post-video">Clip</label>
        <input type="file" id="post-video" accept="video/mp4,video/quicktime,video/webm" required>
        <span class="hint">Up to ${MAX_MB} MB, about 15 seconds of phone video.</span></div>
      <div class="two">
        <div class="field"><label class="label" for="post-cat">Category</label>
          <select id="post-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="post-grab">Grab</label>
          <select id="post-grab">${GRABS.map(g => `<option>${g}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label class="label" for="post-trick">Trick</label><select id="post-trick"></select></div>
      <div class="field"><label class="label" for="post-resort">Resort</label>
        <select id="post-resort">${RESORTS.map(r => `<option ${S.me.home_resort === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="preview"><div><div class="label">Worth</div><span class="hint">A grab adds 20%</span></div>
        <div><span class="big" id="post-pts">0</span> <span class="label">pts</span></div></div>
      <button class="btn primary" type="submit" id="post-btn" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Uploading…' : 'Post for judging'}</button>
    </form>`;
  },
  ranks(){
    const me = S.me, verified = S.clips.filter(c => c.user_id === me.id && c.status === 'verified').length;
    return `<h2>Ranks</h2><p class="sub">Every verified trick adds points, and reaching a points total ranks you up.</p>
    <div class="stack">
      ${rankCard('Trick rank', me.points, TRICK_TIERS, 'pts', `${verified} verified trick${verified === 1 ? '' : 's'}`)}
      ${rankCard('Duel rank', me.rating, TIERS, 'rating', 'Duels coming soon')}
    </div>
    <div class="label" style="margin-block:20px 10px">Leaderboard · Tricks</div>
    <div class="card"><ol class="board">${S.leaders.map((u, i) => `
      <li class="${u.id === me.id ? 'you' : ''}"><span class="n">${i + 1}</span>
        <div class="avatar ${u.id === me.id ? 'you' : ''}">${esc(initials(u.username))}</div>
        <div><b>${esc(u.username)}</b><div class="hint">${tierTag(trickTierOf(u.points))}${u.home_resort ? ' · ' + esc(u.home_resort) : ''}</div></div>
        <span class="score">${u.points} <small class="hint">pts</small></span></li>`).join('')}</ol></div>
    <section class="card form" style="margin-top:20px">
      <div class="label">Your profile</div>
      <div class="hint">Signed in as <b>${esc(me.username)}</b> · ${esc(S.session.user.email)}</div>
      <div class="field"><label class="label" for="home-resort">Home mountain</label>
        <select id="home-resort"><option value="">Not set</option>${RESORTS.map(r =>
          `<option ${me.home_resort === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <button class="btn" data-act="signout">Sign out</button>
    </section>`;
  },
};

function rankCard(title, val, table, unit, extra){
  const t = table.find(x => val >= x.min), i = table.indexOf(t), next = i > 0 ? table[i - 1] : null;
  const pct = next ? (val - t.min) / (next.min - t.min) * 100 : 100;
  return `<section class="card me-card">
    <div class="row"><div class="label">${title}</div><span class="hint">${extra}</span></div>
    <div class="rank-line"><span class="sym medal big m-${t.key}"></span>
      <div><div class="rank-name">${t.name}</div><div class="mono hint">${val} ${unit}</div></div></div>
    <div class="bar"><i style="width:${Math.max(3, pct)}%"></i></div>
    <div class="hint">${next ? `${next.min - val} ${unit} to ${next.name}` : 'Top rank'}</div>
  </section>`;
}

// ---------- post form ----------
function syncPost(){
  const cat = $('post-cat'); if (!cat) return;
  const sel = $('post-trick'), prev = sel.value;
  sel.innerHTML = S.tricks.filter(t => t.category === cat.value).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  $('post-pts').textContent = points(sel.value, $('post-grab').value);
}

// ---------- render ----------
const TABS = [
  ['feed','Feed','<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ['judge','Judge','<path d="M5 12l4 4L19 6"/>'],
  ['post','Post','<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'],
  ['ranks','Ranks','<path d="M4 20h16M7 20V11M12 20V5M17 20v-6"/>'],
];
function render(){
  const signedIn = !!(S.session && S.me);
  $('tabbar').hidden = !signedIn; $('me-chip').hidden = !signedIn;
  if (!signedIn){ $('view').innerHTML = views.auth(); return; }
  $('me-chip').innerHTML = `${sym(trickTierOf(S.me.points).key)}<b>${S.me.points}</b><span class="hint">pts</span>`;
  const judgeCount = judgeQueue().length;
  $('tabs').innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}" aria-label="${label}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}
      ${id === 'judge' && judgeCount ? `<span class="badge">${judgeCount}</span>` : ''}</button>`).join('');
  // Don't rebuild the post form while it's being filled in
  if (S.tab === 'post' && $('post-form')) return;
  $('view').innerHTML = views[S.tab]();
  syncPost();
}

async function refresh(){
  try { await loadAll(); if (S.tab === 'ranks') await loadLeaders(); }
  catch (err){ console.error(err); toast('Could not reach the server: ' + err.message); }
  render();
}

// Check for new clips and results every 20 s, unless a video is playing.
setInterval(() => {
  if (!S.me || S.busy || S.tab === 'post') return;
  if ([...document.querySelectorAll('video')].some(v => !v.paused)) return;
  refresh();
}, 20000);

// ---------- actions ----------
async function vote(clipId, landed, reason){
  const r = await db.from('votes').insert({clip_id: clipId, landed, reason: reason || null});
  if (r.error){ toast('Vote failed: ' + r.error.message); return; }
  S.reasonFor = null;
  toast(landed ? 'Voted landed' : 'Voted not landed');
  await refresh();
}

async function deleteClip(id){
  const c = S.clips.find(x => x.id === id); if (!c) return;
  if (!confirm('Delete this clip? This cannot be undone.')) return;
  const r = await db.from('clips').delete().eq('id', id);
  if (r.error){ toast('Delete failed: ' + r.error.message); return; }
  if (c.video_path) await db.storage.from('clips').remove([c.video_path]);
  toast('Clip deleted');
  await refresh();
}

async function submitPost(){
  const file = $('post-video').files[0];
  if (!file){ toast('Pick a video first'); return; }
  if (file.size > MAX_MB * 1024 * 1024){ toast(`That video is over ${MAX_MB} MB. Trim it and try again.`); return; }
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
  const type = file.type || (ext === 'mov' ? 'video/quicktime' : ext === 'webm' ? 'video/webm' : 'video/mp4');
  const path = `${myId()}/${crypto.randomUUID()}.${ext}`;  // must start with my user id (storage rule)
  const clip = {trick_id: $('post-trick').value, grab: $('post-grab').value, resort: $('post-resort').value, video_path: path};

  S.busy = true; $('post-btn').disabled = true; $('post-btn').textContent = 'Uploading…';
  try {
    const up = await db.storage.from('clips').upload(path, file, {contentType: type});
    if (up.error) throw up.error;
    const ins = await db.from('clips').insert(clip);
    if (ins.error){ await db.storage.from('clips').remove([path]); throw ins.error; }
    S.tab = 'feed'; $('view').innerHTML = '';
    toast('Posted. Skiers are judging it now.');
    await refresh(); window.scrollTo(0, 0);
  } catch (err){
    console.error(err); toast('Post failed: ' + err.message, 5000);
    const b = $('post-btn'); if (b){ b.disabled = false; b.textContent = 'Post for judging'; }
  } finally { S.busy = false; }
}

async function submitAuth(){
  const email = $('auth-email').value.trim(), password = $('auth-pass').value;
  const username = $('auth-user') ? $('auth-user').value.trim() : '';
  if (S.authMode === 'signup' && !/^[A-Za-z0-9_.-]{3,24}$/.test(username)){
    toast('Username: 3–24 letters, numbers, _ . or -'); return;
  }
  // Only disable the button. Calling render() here would rebuild the form and empty its boxes.
  const btn = document.querySelector('#auth-form button[type=submit]');
  S.busy = true; btn.disabled = true;
  try {
    if (S.authMode === 'signup'){
      const taken = await db.from('profiles').select('id').eq('username', username).maybeSingle();
      if (taken.data){ toast('That username is taken. Try another.'); return; }
      const r = await db.auth.signUp({email, password, options: {data: {username}}});
      if (r.error) throw r.error;
      if (!r.data.session){
        S.authMode = 'signin'; render();
        $('auth-email').value = email;
        toast('Check your email and click the confirmation link, then sign in here.', 8000);
      }
    } else {
      const r = await db.auth.signInWithPassword({email, password});
      if (r.error) throw r.error;
    }
  } catch (err){
    const msg = /not confirmed/i.test(err.message) ? 'Confirm your email first (check your inbox).'
      : /invalid login/i.test(err.message) ? 'Wrong email or password.'
      : err.message;
    toast(msg, 5000);
  } finally {
    S.busy = false;
    const b = document.querySelector('#auth-form button[type=submit]'); if (b) b.disabled = false;
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'tab'){
    S.tab = b.dataset.tab; S.reasonFor = null; $('view').innerHTML = '';
    if (S.tab === 'ranks'){ try { await loadLeaders(); } catch (err){ toast(err.message); } }
    render(); window.scrollTo(0, 0);
  }
  else if (act === 'authmode'){ S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; render(); }
  else if (act === 'askreason'){ S.reasonFor = b.dataset.id; render(); }
  else if (act === 'noreason'){ S.reasonFor = null; render(); }
  else if (act === 'vote'){ b.disabled = true; await vote(b.dataset.id, b.dataset.y === '1', b.dataset.reason); }
  else if (act === 'delete'){ await deleteClip(b.dataset.id); }
  else if (act === 'signout'){ await db.auth.signOut(); }
});
document.addEventListener('change', async e => {
  if (['post-cat','post-trick','post-grab'].includes(e.target.id)) syncPost();
  if (e.target.id === 'home-resort'){
    const r = await db.from('profiles').update({home_resort: e.target.value || null}).eq('id', myId());
    if (r.error) toast('Could not save: ' + r.error.message);
    else { toast('Home mountain saved'); await refresh(); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'post-form' && !S.busy) submitPost();
  if (e.target.id === 'auth-form' && !S.busy) submitAuth();
});

// ---------- start ----------
// Supabase warns against awaiting its own calls inside this callback, so hand off with setTimeout.
db.auth.onAuthStateChange((event, session) => {
  setTimeout(async () => {
    const was = S.session && S.session.user.id, now = session && session.user.id;
    S.session = session;
    if (!now){ S.me = null; seenStatus = null; S.tab = 'feed'; render(); return; }
    if (was !== now){ S.tab = 'feed'; await refresh(); }
  }, 0);
});
</script>
