<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080C">
<title>Sendit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Night park: dark on purpose, like a session under the park lights. */
:root{
  color-scheme:dark;
  --bg:#06080C; --surface:#10151E; --surface-2:#171F2C; --raise:#1C2636;
  --ink:#EEF3F8; --muted:#8595A9; --line:#222D3E;
  --accent:#FF6B1A; --accent-hot:#FF8A3D; --accent-ink:#160700; --accent-soft:rgba(255,107,26,.14);
  --ice:#5CE1FF; --ice-soft:rgba(92,225,255,.12);
  --good:#3BE08A; --good-soft:rgba(59,224,138,.14); --bad:#FF5470; --bad-soft:rgba(255,84,112,.14);
  --glow:0 0 0 1px rgba(255,107,26,.5),0 0 22px rgba(255,107,26,.35);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.45);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background:
    radial-gradient(70% 45% at 8% -8%, rgba(92,225,255,.16), transparent 70%),
    radial-gradient(60% 40% at 95% -12%, rgba(255,107,26,.18), transparent 70%),
    var(--bg);
  background-attachment:fixed}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
a{color:var(--ice)}

/* falling snow */
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),105vh,0)}}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 0 12px;
  background:linear-gradient(var(--bg) 70%, transparent)}
.brand{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1;
  text-transform:uppercase;font-style:italic;transform:skewX(-6deg)}
.brand span{color:var(--accent);text-shadow:0 0 18px rgba(255,107,26,.7)}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer}
.me-chip:hover{border-color:var(--accent)}
.me-chip b{font-family:var(--mono);font-size:13px}

h2{font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;letter-spacing:.3px;
  margin:8px 0 2px;line-height:1;text-wrap:balance;font-style:italic}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* rank medals: hexagons with a moving sheen */
.sym{display:inline-block;flex:none;vertical-align:middle}
.medal{position:relative;width:14px;height:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);overflow:hidden}
.medal.big{width:44px;height:50px;filter:drop-shadow(0 0 10px rgba(255,255,255,.15))}
.medal.big::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);
  transform:translateX(-60%)}
@media (prefers-reduced-motion:no-preference){ .medal.big::after{animation:sheen 3.2s ease-in-out infinite} }
@keyframes sheen{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
.m-bronze{background:linear-gradient(145deg,#F0B07A,#A0592A 60%,#6A3514)}
.m-silver{background:linear-gradient(145deg,#FFFFFF,#A9B4BF 60%,#6E7984)}
.m-gold{background:linear-gradient(145deg,#FFE88A,#E8AE1C 60%,#9E6C00)}
.m-plat{background:linear-gradient(145deg,#E4FFFB,#6FE0D3 60%,#2F8A80)}
.m-diamond{background:linear-gradient(145deg,#E3F2FF,#6FB4FF 55%,#3552E6)}
.m-legend{background:linear-gradient(145deg,#FFD0A0,#FF6B1A 50%,#C0218A)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}

/* cards */
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface) 140px);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:var(--raise);border:1px solid var(--line);flex:none;font-family:var(--mono)}
.avatar.you{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 14px rgba(255,107,26,.5)}
.who{min-width:0;flex:1}
.who .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.who .meta{font-size:12px;color:var(--muted)}
.linkname{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left}
.linkname:hover{color:var(--accent)}
.poster{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(170deg,#12304D,#0A1524)}
.poster::before{content:"";position:absolute;inset:0;background:#DCE8F3;opacity:.9;
  clip-path:polygon(0 72%,38% 52%,62% 58%,100% 30%,100% 100%,0 100%)}
.poster .tname{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:36px;line-height:.95;text-transform:uppercase;color:#0A1524}
.poster .play{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 7px;text-transform:uppercase}
video.clip{display:block;width:100%;aspect-ratio:16/10;background:#000;object-fit:cover}
.card-foot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.trick{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;font-style:italic}
.trick small{font-family:var(--body);font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted);text-transform:none}
.pts{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);text-shadow:0 0 12px rgba(255,107,26,.5)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;border:1px solid}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:rgba(59,224,138,.4)}
.pill.no{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,84,112,.4)}
.pill.wait{background:var(--ice-soft);color:var(--ice);border-color:rgba(92,225,255,.4)}
.pill.totd{background:var(--accent-soft);color:var(--accent-hot);border-color:rgba(255,107,26,.5)}

/* like / comment bar */
.social{display:flex;align-items:center;gap:6px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--mono)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn.lit{color:var(--accent);border-color:rgba(255,107,26,.6);background:var(--accent-soft)}
.icon-btn.lit svg{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .icon-btn.pop svg{animation:pop .35s ease-out} }
@keyframes pop{40%{transform:scale(1.45) rotate(-8deg)}}
.comments{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.18)}
.comment{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.comment b{font-weight:700;margin-right:4px}
.comment .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.comment-form{display:flex;gap:8px}
.comment-form input{flex:1;min-width:0}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:12px 14px;
  font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--accent-hot),var(--accent));color:var(--accent-ink);border-color:transparent;
  box-shadow:0 6px 22px rgba(255,107,26,.35);text-transform:uppercase}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);color:#04160C;border-color:transparent}
.btn.bad{background:var(--bad);color:#1A0207;border-color:transparent}
.btn.small{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus,input:focus{border-color:var(--ice)}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;color:var(--accent);text-shadow:0 0 20px rgba(255,107,26,.55)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;align-self:flex-start}

/* Trick of the Day hero */
.totd-card{position:relative;border-radius:18px;padding:1.5px;margin-bottom:18px;
  background:linear-gradient(120deg,var(--accent),#C0218A 45%,var(--ice))}
.totd-in{border-radius:16.5px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
  background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.25), transparent 60%),#0B0F16}
.totd-name{font-family:var(--display);font-weight:900;font-style:italic;font-size:40px;line-height:.95;text-transform:uppercase}
.totd-x{grid-row:1 / span 3;grid-column:2;font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;font-style:italic;
  color:var(--accent);text-shadow:0 0 24px rgba(255,107,26,.8)}
.totd-in .btn{grid-column:1 / -1;margin-top:10px}

/* ranks */
.me-card{padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.rank-line{display:flex;align-items:center;gap:14px}
.rank-name{font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:1;font-style:italic}
.bar{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hot));box-shadow:0 0 12px rgba(255,107,26,.7)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;align-items:center;margin-block:20px 10px;flex-wrap:wrap}
.filters select{width:auto;flex:1;min-width:140px;padding:8px 10px}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--line);cursor:pointer}
.board li:hover{background:var(--raise)}
.board li:first-child{border-top:0}
.board li.you{background:var(--accent-soft)}
.board .n{font-family:var(--display);font-weight:900;font-size:22px;font-style:italic;color:var(--muted);text-align:right}
.board li:nth-child(1) .n{color:#FFD35A;text-shadow:0 0 12px rgba(255,211,90,.6)}
.board li:nth-child(2) .n{color:#D6DEE6}
.board li:nth-child(3) .n{color:#E0955A}
.board .score{font-family:var(--mono);font-weight:700;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:26px;font-style:italic;text-transform:uppercase;color:var(--ink)}

/* profile */
.prof-head{display:flex;align-items:center;gap:14px;margin-block:6px 16px}
.prof-head .avatar{width:64px;height:64px;font-size:20px}
.prof-head h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-style:italic}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.medals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.medals .card{padding:14px;display:flex;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;padding:0;cursor:pointer}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--display);font-weight:900;font-style:italic;
  font-size:15px;line-height:1;text-transform:uppercase;text-align:left;text-shadow:0 1px 6px #000}
.tile em{position:absolute;right:6px;top:5px;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);text-shadow:0 1px 4px #000}
.back{margin-top:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,13,19,.82);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(255,107,26,.8))}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--ice);color:#021218;
  font-size:10px;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:#0B0F16;color:var(--ink);border:1px solid var(--accent);box-shadow:var(--glow);
  padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translate(-50%,10px);opacity:.3}}
  .stack > *{animation:enter .35s ease-out both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}}
}
</style>

<div id="snow" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">Send<span>it</span></div>
    <button class="me-chip" data-act="tab" data-tab="ranks" id="me-chip" aria-label="Your rank" hidden></button>
  </header>
  <main id="view"><p class="sub">Loading…</p></main>
</div>
<div class="tabs" id="tabbar" hidden><nav id="tabs"></nav></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------- connection ----------
// The publishable key is meant to be public. The real security is the rules in
// supabase/001_schema.sql and 002_social.sql, which the database enforces no matter what this page does.
const SUPABASE_URL = 'https://kyabslzotdtcwtjcygew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sP394lJIxwiubaTzlkwSrg_poXVTb27';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- catalog ----------
// Trick names and points come from the database; these are just menu choices.
const CATS = ['Park','Rails','Pipe','Moguls','Backcountry'];
const GRABS = ['No grab','Mute','Safety','Japan','Tail','Critical'];
const RESORTS = ['Eldora','Winter Park','Copper','Arapahoe Basin','Breckenridge','Keystone'];
const REASONS = [['fell','Fell'],['wrong_trick','Wrong trick'],['cant_see',"Can't see"]];
const MAX_MB = 50; // Supabase free plan limit per file
const TIERS = [
  {min:1800,name:'Legend',key:'legend'},{min:1600,name:'Diamond',key:'diamond'},
  {min:1400,name:'Platinum',key:'plat'},{min:1200,name:'Gold',key:'gold'},
  {min:1000,name:'Silver',key:'silver'},{min:0,name:'Bronze',key:'bronze'},
];
const TRICK_TIERS = [
  {min:5000,name:'Legend',key:'legend',w:2.25},{min:3500,name:'Diamond',key:'diamond',w:2},
  {min:2000,name:'Platinum',key:'plat',w:1.75},{min:1000,name:'Gold',key:'gold',w:1.5},
  {min:500,name:'Silver',key:'silver',w:1.25},{min:0,name:'Bronze',key:'bronze',w:1},
];
const tierOf = r => TIERS.find(t => r >= t.min);
const trickTierOf = p => TRICK_TIERS.find(t => p >= t.min);
const CLIP_SELECT = '*, profiles!clips_user_id_fkey(username, points), likes(count), comments(count)';

// ---------- state ----------
const S = {
  tab: 'feed', prevTab: 'feed', session: null, me: null,
  tricks: [], clips: [], myVotes: new Set(), myLikes: new Set(), totd: null,
  board: {period: 'all', resort: '', rows: []},
  profile: null,            // {id, data, clips} while viewing someone's page
  openComments: null, comments: {},
  authMode: 'signin', reasonFor: null, busy: false, postPreset: null,
};
let seenStatus = null; // my clip id -> status, so we notice when one gets verified

// ---------- helpers ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
const sym = (key, big) => `<span class="sym medal ${big ? 'big ' : ''}m-${key}"></span>`;
const tierTag = t => `<span class="tier">${sym(t.key)}${t.name}</span>`;
const $ = id => document.getElementById(id);
const count = rel => (rel && rel[0] ? rel[0].count : 0);
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + 'm';
  const h = Math.round(m / 60); return h < 24 ? h + 'h' : Math.round(h / 24) + 'd';
}
let toastTimer;
function toast(msg, ms = 2800){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const trickById = id => S.tricks.find(t => t.id === id) || {id, name: id, category: '', pts: 0};
const basePoints = (trickId, grab) => Math.round(trickById(trickId).pts * (grab && grab !== 'No grab' ? 1.2 : 1));
const videoUrl = path => db.storage.from('clips').getPublicUrl(path).data.publicUrl;
const myId = () => S.session && S.session.user.id;
const mustOk = r => { if (r.error) throw r.error; return r.data; };

// Minutes until midnight in Denver, when the Trick of the Day changes.
function totdResetsIn(){
  const parts = new Intl.DateTimeFormat('en-US', {timeZone: 'America/Denver', hour: 'numeric', minute: 'numeric', hourCycle: 'h23'})
    .formatToParts(new Date());
  const get = type => Number(parts.find(p => p.type === type).value);
  const left = 24 * 60 - (get('hour') * 60 + get('minute'));
  return `${Math.floor(left / 60)}h ${left % 60}m`;
}

// ---------- loading from the database ----------
async function loadAll(){
  if (!S.tricks.length) S.tricks = mustOk(await db.from('tricks').select('*').order('pts'));
  const [me, clips, votes, likes, totd] = await Promise.all([
    db.from('profiles').select('*').eq('id', myId()).single(),
    db.from('clips').select(CLIP_SELECT).order('created_at', {ascending: false}).limit(60),
    db.from('votes').select('clip_id'),  // the database only returns MY votes
    db.from('likes').select('clip_id').eq('user_id', myId()),
    db.rpc('trick_of_day'),
  ]);
  const before = S.me;
  S.me = mustOk(me);
  S.clips = mustOk(clips);
  S.myVotes = new Set(mustOk(votes).map(v => v.clip_id));
  S.myLikes = new Set(mustOk(likes).map(l => l.clip_id));
  S.totd = mustOk(totd);
  noticeResults(before);
}
async function loadBoard(){
  S.board.rows = mustOk(await db.rpc('leaderboard', {p_period: S.board.period, p_resort: S.board.resort || null}));
}
async function loadProfile(id){
  const [p, clips] = await Promise.all([
    db.from('profiles').select('*').eq('id', id).single(),
    db.from('clips').select(CLIP_SELECT).eq('user_id', id).order('created_at', {ascending: false}).limit(60),
  ]);
  const all = mustOk(clips);
  S.profile = {id, data: mustOk(p), clips: id === myId() ? all : all.filter(c => c.status === 'verified')};
}
async function loadComments(clipId){
  S.comments[clipId] = mustOk(await db.from('comments').select('id, body, created_at, user_id, profiles(username)')
    .eq('clip_id', clipId).order('created_at'));
}

// Toast when one of my clips gets decided while the app is open.
function noticeResults(before){
  const mine = S.clips.filter(c => c.user_id === myId());
  if (seenStatus){
    for (const c of mine){
      if (seenStatus[c.id] !== 'pending' || c.status === 'pending') continue;
      const name = trickById(c.trick_id).name;
      if (c.status === 'verified'){
        const up = before && trickTierOf(S.me.points) !== trickTierOf(before.points);
        toast(up ? `🏅 Rank up! You reached ${trickTierOf(S.me.points).name}`
                 : `✅ Verified! ${name} earned +${c.points_awarded} pts`, 4500);
      } else toast(`The community didn't verify your ${name}`, 4500);
    }
  }
  seenStatus = Object.fromEntries(mine.map(c => [c.id, c.status]));
}

// ---------- pieces ----------
const ICON = {
  fire: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

function clipCard(c, {judge = false} = {}){
  const t = trickById(c.trick_id), mine = c.user_id === myId();
  const who = c.profiles ? c.profiles.username : 'Skier';
  const media = c.video_path
    ? `<video class="clip" src="${esc(videoUrl(c.video_path))}" controls playsinline muted preload="metadata"></video>`
    : `<div class="poster" role="img" aria-label="${esc(t.name)}"><span class="play">No video</span><div class="tname">${esc(t.name)}</div></div>`;
  let status;
  if (c.status === 'verified') status = `<span class="pill ok">Verified</span>`;
  else if (c.status === 'rejected') status = `<span class="pill no">Not verified</span>`;
  else status = `<span class="pill wait">Judging</span>`;

  const head = judge
    ? `<div class="avatar">?</div><div class="who"><div class="name">Anonymous skier</div>
         <div class="meta">${esc(c.resort || '')} · ${ago(c.created_at)} ago</div></div>`
    : `<button class="avatar linkname ${mine ? 'you' : ''}" data-act="profile" data-id="${c.user_id}" aria-label="${esc(who)}'s profile">${esc(initials(who))}</button>
       <div class="who"><div class="name"><button class="linkname" data-act="profile" data-id="${c.user_id}">${esc(who)}</button>
         ${c.profiles ? sym(trickTierOf(c.profiles.points).key) : ''}</div>
         <div class="meta">${esc(c.resort || '')} · ${ago(c.created_at)} ago</div></div>`;

  const shown = c.status === 'verified' ? c.points_awarded : basePoints(c.trick_id, c.grab) * (c.totd ? 2 : 1);
  let actions = '';
  if (judge && S.reasonFor === c.id) actions = `
    <div class="label">What went wrong?</div>
    <div class="btns" style="grid-template-columns:1fr 1fr 1fr">${REASONS.map(([k, label]) =>
      `<button class="btn bad small" data-act="vote" data-id="${c.id}" data-y="0" data-reason="${k}">${label}</button>`).join('')}</div>
    <button class="linkish" data-act="noreason">Cancel</button>`;
  else if (judge) actions = `<div class="btns">
      <button class="btn bad" data-act="askreason" data-id="${c.id}">Not landed</button>
      <button class="btn good" data-act="vote" data-id="${c.id}" data-y="1">Landed</button></div>`;
  else {
    const liked = S.myLikes.has(c.id), open = S.openComments === c.id;
    actions = `<div class="row">
      <div class="social">
        <button class="icon-btn ${liked ? 'lit' : ''}" data-act="like" data-id="${c.id}" aria-pressed="${liked}" aria-label="Fire">${ICON.fire}${count(c.likes)}</button>
        <button class="icon-btn ${open ? 'lit' : ''}" data-act="comments" data-id="${c.id}" aria-expanded="${open}" aria-label="Comments">${ICON.chat}${count(c.comments)}</button>
      </div>
      ${mine && c.status === 'pending' ? `<button class="linkish" data-act="delete" data-id="${c.id}">Delete</button>` : ''}
    </div>`;
  }

  return `<article class="card" id="clip-${c.id}">
    <div class="card-head">${head}${status}</div>
    ${media}
    <div class="card-foot">
      <div class="row"><div class="trick">${esc(t.name)} <small>· ${esc(c.grab)} · ${esc(t.category)}</small></div>
        <div class="pts">+${shown}</div></div>
      ${c.totd ? '<div><span class="pill totd">🔥 Trick of the Day · 2× points</span></div>' : ''}
      ${actions}
    </div>
    ${!judge && S.openComments === c.id ? commentsPanel(c.id) : ''}
  </article>`;
}

function commentsPanel(clipId){
  const list = S.comments[clipId];
  const body = !list ? '<div class="hint">Loading…</div>'
    : !list.length ? '<div class="hint">No comments yet. Say something nice.</div>'
    : list.map(m => `<div class="comment"><div><b>${esc(m.profiles ? m.profiles.username : 'Skier')}</b>${esc(m.body)}
        <span class="hint"> · ${ago(m.created_at)}</span></div>
        ${m.user_id === myId() ? `<button class="x" data-act="delcomment" data-id="${m.id}" data-clip="${clipId}" aria-label="Delete comment">×</button>` : ''}</div>`).join('');
  return `<div class="comments">${body}
    <form class="comment-form" data-clip="${clipId}">
      <input id="comment-${clipId}" maxlength="280" placeholder="Add a comment" autocomplete="off" aria-label="Comment">
      <button class="btn small primary" type="submit">Send</button>
    </form></div>`;
}

function totdCard(){
  if (!S.totd) return '';
  const t = trickById(S.totd);
  return `<section class="totd-card"><div class="totd-in">
    <div class="label" style="color:var(--accent-hot)">Trick of the Day · resets in ${totdResetsIn()}</div>
    <div class="totd-name">${esc(t.name)}</div>
    <div class="hint">${esc(t.category)} · worth <b class="mono" style="color:var(--ink)">${t.pts * 2}</b> pts today instead of ${t.pts}</div>
    <div class="totd-x">2×</div>
    <button class="btn primary" data-act="totdpost">Post your ${esc(t.name)}</button>
  </div></section>`;
}

function rankCard(title, val, table, unit, extra){
  const t = table.find(x => val >= x.min), i = table.indexOf(t), next = i > 0 ? table[i - 1] : null;
  const pct = next ? (val - t.min) / (next.min - t.min) * 100 : 100;
  return `<section class="card me-card">
    <div class="row"><div class="label">${title}</div><span class="hint">${extra}</span></div>
    <div class="rank-line">${sym(t.key, true)}
      <div><div class="rank-name">${t.name}</div><div class="mono hint">${val} ${unit}</div></div></div>
    <div class="bar"><i style="width:${Math.max(3, pct)}%"></i></div>
    <div class="hint">${next ? `${next.min - val} ${unit} to ${next.name}` : 'Top rank'}</div>
  </section>`;
}

const judgeQueue = () => S.clips.filter(c => c.status === 'pending' && c.user_id !== myId() && !S.myVotes.has(c.id));

// ---------- post form ----------
function syncPost(){
  const cat = $('post-cat'); if (!cat) return;
  if (S.postPreset){ cat.value = trickById(S.postPreset).category; }
  const sel = $('post-trick'), prev = S.postPreset || sel.value;
  sel.innerHTML = S.tricks.filter(t => t.category === cat.value)
    .map(t => `<option value="${t.id}">${esc(t.name)}${t.id === S.totd ? ' 🔥 2×' : ''}</option>`).join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  S.postPreset = null;
  const double = sel.value === S.totd;
  $('post-pts').textContent = basePoints(sel.value, $('post-grab').value) * (double ? 2 : 1);
  $('post-why').textContent = double ? '🔥 Trick of the Day: 2× points' : 'A grab adds 20%';
}

// ---------- render ----------
const TABS = [
  ['feed','Feed','<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ['judge','Judge','<path d="M5 12l4 4L19 6"/>'],
  ['post','Post','<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'],
  ['ranks','Ranks','<path d="M4 20h16M7 20V11M12 20V5M17 20v-6"/>'],
];
function render(){
  const signedIn = !!(S.session && S.me);
  $('tabbar').hidden = !signedIn; $('me-chip').hidden = !signedIn;
  if (!signedIn){ $('view').innerHTML = views.auth(); return; }
  $('me-chip').innerHTML = `${sym(trickTierOf(S.me.points).key)}<b>${S.me.points}</b><span class="hint">pts</span>`;
  const judgeCount = judgeQueue().length;
  $('tabs').innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}" aria-label="${label}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}
      ${id === 'judge' && judgeCount ? `<span class="badge">${judgeCount}</span>` : ''}</button>`).join('');
  // Don't rebuild the post form while it's being filled in
  if (S.tab === 'post' && $('post-form')) return;
  $('view').innerHTML = views[S.tab]();
  syncPost();
}

async function refresh(){
  try {
    await loadAll();
    if (S.tab === 'ranks') await loadBoard();
    if (S.tab === 'profile' && S.profile) await loadProfile(S.profile.id);
  } catch (err){ console.error(err); toast('Could not reach the server: ' + err.message); }
  render();
}

async function openTab(tab){
  S.tab = tab; S.reasonFor = null; S.openComments = null; $('view').innerHTML = '';
  if (tab === 'ranks'){ try { await loadBoard(); } catch (err){ toast(err.message); } }
  render(); window.scrollTo(0, 0);
}

// Check for new clips and results every 20 s, unless you're busy typing or watching.
setInterval(() => {
  if (!S.me || S.busy || S.tab === 'post') return;
  const a = document.activeElement;
  if (a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) return;
  if ([...document.querySelectorAll('video')].some(v => !v.paused)) return;
  refresh();
}, 20000);

// ---------- actions ----------
async function vote(clipId, landed, reason){
  const r = await db.from('votes').insert({clip_id: clipId, landed, reason: reason || null});
  if (r.error){ toast('Vote failed: ' + r.error.message); return; }
  S.reasonFor = null;
  toast(landed ? 'Voted landed' : 'Voted not landed');
  await refresh();
}

async function toggleLike(id, btn){
  const c = S.clips.find(x => x.id === id) || (S.profile && S.profile.clips.find(x => x.id === id));
  const liked = S.myLikes.has(id);
  // Update the screen right away, then tell the database
  if (liked) S.myLikes.delete(id); else S.myLikes.add(id);
  if (c){ c.likes = [{count: Math.max(0, count(c.likes) + (liked ? -1 : 1))}]; }
  render();
  if (!liked){ const b = document.querySelector(`[data-act="like"][data-id="${id}"]`); if (b) b.classList.add('pop'); }
  const r = liked ? await db.from('likes').delete().eq('clip_id', id).eq('user_id', myId())
                  : await db.from('likes').insert({clip_id: id});
  if (r.error){ toast('Could not save: ' + r.error.message); await refresh(); }
}

async function toggleComments(id){
  if (S.openComments === id){ S.openComments = null; render(); return; }
  S.openComments = id; render();
  try { await loadComments(id); } catch (err){ toast(err.message); }
  render();
  const input = $('comment-' + id); if (input) input.focus();
}

async function sendComment(clipId, input){
  const body = input.value.trim(); if (!body) return;
  input.disabled = true;
  const r = await db.from('comments').insert({clip_id: clipId, body});
  if (r.error){ toast('Comment failed: ' + r.error.message); input.disabled = false; return; }
  await loadComments(clipId);
  const c = S.clips.find(x => x.id === clipId); if (c) c.comments = [{count: S.comments[clipId].length}];
  render();
  const again = $('comment-' + clipId); if (again) again.focus();
}

async function deleteComment(id, clipId){
  const r = await db.from('comments').delete().eq('id', id);
  if (r.error){ toast('Delete failed: ' + r.error.message); return; }
  await loadComments(clipId);
  const c = S.clips.find(x => x.id === clipId); if (c) c.comments = [{count: S.comments[clipId].length}];
  render();
}

async function openProfile(id){
  if (S.tab !== 'profile') S.prevTab = S.tab;
  S.tab = 'profile'; S.openComments = null;
  S.profile = {id, data: null, clips: []}; render(); window.scrollTo(0, 0);
  try { await loadProfile(id); } catch (err){ toast(err.message); }
  render();
}

async function deleteClip(id){
  const c = S.clips.find(x => x.id === id); if (!c) return;
  if (!confirm('Delete this clip? This cannot be undone.')) return;
  const r = await db.from('clips').delete().eq('id', id);
  if (r.error){ toast('Delete failed: ' + r.error.message); return; }
  if (c.video_path) await db.storage.from('clips').remove([c.video_path]);
  toast('Clip deleted');
  await refresh();
}

async function submitPost(){
  const file = $('post-video').files[0];
  if (!file){ toast('Pick a video first'); return; }
  if (file.size > MAX_MB * 1024 * 1024){ toast(`That video is over ${MAX_MB} MB. Trim it and try again.`); return; }
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
  const type = file.type || (ext === 'mov' ? 'video/quicktime' : ext === 'webm' ? 'video/webm' : 'video/mp4');
  const path = `${myId()}/${crypto.randomUUID()}.${ext}`;  // must start with my user id (storage rule)
  const clip = {trick_id: $('post-trick').value, grab: $('post-grab').value, resort: $('post-resort').value, video_path: path};

  S.busy = true; $('post-btn').disabled = true; $('post-btn').textContent = 'Uploading…';
  try {
    const up = await db.storage.from('clips').upload(path, file, {contentType: type});
    if (up.error) throw up.error;
    const ins = await db.from('clips').insert(clip);
    if (ins.error){ await db.storage.from('clips').remove([path]); throw ins.error; }
    S.tab = 'feed'; $('view').innerHTML = '';
    toast('Posted. Skiers are judging it now.');
    await refresh(); window.scrollTo(0, 0);
  } catch (err){
    console.error(err); toast('Post failed: ' + err.message, 5000);
    const b = $('post-btn'); if (b){ b.disabled = false; b.textContent = 'Post for judging'; }
  } finally { S.busy = false; }
}

async function submitAuth(){
  const email = $('auth-email').value.trim(), password = $('auth-pass').value;
  const username = $('auth-user') ? $('auth-user').value.trim() : '';
  if (S.authMode === 'signup' && !/^[A-Za-z0-9_.-]{3,24}$/.test(username)){
    toast('Username: 3–24 letters, numbers, _ . or -'); return;
  }
  // Only disable the button. Calling render() here would rebuild the form and empty its boxes.
  const btn = document.querySelector('#auth-form button[type=submit]');
  S.busy = true; btn.disabled = true;
  try {
    if (S.authMode === 'signup'){
      const taken = await db.from('profiles').select('id').eq('username', username).maybeSingle();
      if (taken.data){ toast('That username is taken. Try another.'); return; }
      const r = await db.auth.signUp({email, password, options: {data: {username}}});
      if (r.error) throw r.error;
      if (!r.data.session){
        S.authMode = 'signin'; render();
        $('auth-email').value = email;
        toast('Check your email and click the confirmation link, then sign in here.', 8000);
      }
    } else {
      const r = await db.auth.signInWithPassword({email, password});
      if (r.error) throw r.error;
    }
  } catch (err){
    const msg = /not confirmed/i.test(err.message) ? 'Confirm your email first (check your inbox).'
      : /invalid login/i.test(err.message) ? 'Wrong email or password.'
      : err.message;
    toast(msg, 5000);
  } finally {
    S.busy = false;
    const b = document.querySelector('#auth-form button[type=submit]'); if (b) b.disabled = false;
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'tab') await openTab(b.dataset.tab);
  else if (act === 'authmode'){ S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; render(); }
  else if (act === 'askreason'){ S.reasonFor = id; render(); }
  else if (act === 'noreason'){ S.reasonFor = null; render(); }
  else if (act === 'vote'){ b.disabled = true; await vote(id, b.dataset.y === '1', b.dataset.reason); }
  else if (act === 'delete') await deleteClip(id);
  else if (act === 'like') await toggleLike(id, b);
  else if (act === 'comments') await toggleComments(id);
  else if (act === 'delcomment') await deleteComment(id, b.dataset.clip);
  else if (act === 'profile') await openProfile(id);
  else if (act === 'back') await openTab(S.prevTab || 'feed');
  else if (act === 'totdpost'){ S.postPreset = S.totd; await openTab('post'); }
  else if (act === 'period'){ S.board.period = b.dataset.k; try { await loadBoard(); } catch (err){ toast(err.message); } render(); }
  else if (act === 'playtile'){
    const v = b.querySelector('video'); if (!v) return;
    if (v.paused){ document.querySelectorAll('.tile video').forEach(o => o.pause()); v.muted = false; v.play(); } else v.pause();
  }
  else if (act === 'signout') await db.auth.signOut();
});
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (['post-cat','post-trick','post-grab'].includes(id)) syncPost();
  if (id === 'board-resort'){ S.board.resort = e.target.value; try { await loadBoard(); } catch (err){ toast(err.message); } render(); }
  if (id === 'home-resort'){
    const r = await db.from('profiles').update({home_resort: e.target.value || null}).eq('id', myId());
    if (r.error) toast('Could not save: ' + r.error.message);
    else { toast('Home mountain saved'); await refresh(); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'post-form' && !S.busy) submitPost();
  else if (f.id === 'auth-form' && !S.busy) submitAuth();
  else if (f.classList.contains('comment-form')) sendComment(f.dataset.clip, f.querySelector('input'));
});

// ---------- snow ----------
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const snow = $('snow');
  for (let i = 0; i < 36; i++){
    const f = document.createElement('i'), size = 1.5 + Math.random() * 3;
    f.style.cssText = `left:${Math.random() * 100}vw;width:${size}px;height:${size}px;opacity:${.2 + Math.random() * .5};` +
      `--drift:${(Math.random() - .5) * 80}px;animation-duration:${9 + Math.random() * 12}s;animation-delay:${-Math.random() * 20}s`;
    snow.appendChild(f);
  }
}

// ---------- start ----------
// Supabase warns against awaiting its own calls inside this callback, so hand off with setTimeout.
db.auth.onAuthStateChange((event, session) => {
  setTimeout(async () => {
    const was = S.session && S.session.user.id, now = session && session.user.id;
    S.session = session;
    if (!now){ S.me = null; seenStatus = null; S.tab = 'feed'; render(); return; }
    if (was !== now){ S.tab = 'feed'; await refresh(); }
  }, 0);
});
</script>
