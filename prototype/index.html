<title>Sendit Ski League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F2F6FA; --ink:#0F1C2B; --muted:#5A6A7B;
  --line:#D3DDE7; --accent:#F2621C; --accent-ink:#FFFFFF; --accent-soft:#FDE6DA;
  --good:#1B8F52; --good-soft:#DDF3E6; --bad:#C93636; --bad-soft:#F8E0E0;
  --trail-green:#1E9E5A; --trail-blue:#1F5FD1; --trail-black:#111418; --trail-edge:transparent;
  --poster-a:#A9CBEA; --poster-b:#EAF2F9; --slope:#FFFFFF; --poster-ink:#0F1C2B;
  --shadow:0 1px 2px rgba(15,28,43,.06),0 4px 14px rgba(15,28,43,.06);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#09131F; --surface:#112033; --surface-2:#0D1A2A; --ink:#E3ECF5; --muted:#8FA2B7;
    --line:#21364F; --accent:#FF7A3A; --accent-ink:#1A0A02; --accent-soft:#3A2012;
    --good:#43C983; --good-soft:#12301F; --bad:#F06868; --bad-soft:#3A1717;
    --trail-green:#2FB56C; --trail-blue:#4C86EE; --trail-black:#05070A; --trail-edge:#8FA2B7;
    --poster-a:#1C3858; --poster-b:#0F2238; --slope:#D8E4EF; --poster-ink:#E3ECF5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09131F; --surface:#112033; --surface-2:#0D1A2A; --ink:#E3ECF5; --muted:#8FA2B7;
  --line:#21364F; --accent:#FF7A3A; --accent-ink:#1A0A02; --accent-soft:#3A2012;
  --good:#43C983; --good-soft:#12301F; --bad:#F06868; --bad-soft:#3A1717;
  --trail-green:#2FB56C; --trail-blue:#4C86EE; --trail-black:#05070A; --trail-edge:#8FA2B7;
  --poster-a:#1C3858; --poster-b:#0F2238; --slope:#D8E4EF; --poster-ink:#E3ECF5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer}
.me-chip b{font-family:var(--mono);font-size:13px}
.proto{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);
  border-radius:8px;padding:8px 10px;margin-block:0 14px}

h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.3px;
  margin:6px 0 2px;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* rank medals: hexagon badges with a metal sheen */
.sym{display:inline-block;flex:none;vertical-align:middle}
.medal{width:14px;height:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.m-bronze{background:linear-gradient(145deg,#E3A06A,#A0592A 60%,#7A3F19)}
.m-silver{background:linear-gradient(145deg,#F2F5F8,#A9B4BF 60%,#7D8893)}
.m-gold{background:linear-gradient(145deg,#FFE27A,#E0A718 60%,#A87400)}
.m-plat{background:linear-gradient(145deg,#D8FBF6,#6FCFC4 60%,#3C958B)}
.m-diamond{background:linear-gradient(145deg,#D9ECFF,#6FA8FF 55%,#3D5BE0)}
.m-legend{background:linear-gradient(145deg,#FFC08A,#F2621C 50%,#B0217A)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);flex:none}
.avatar.you{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.who{min-width:0;flex:1}
.who .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.who .meta{font-size:12px;color:var(--muted)}
.poster{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;
  background:linear-gradient(170deg,var(--poster-a),var(--poster-b));}
.poster::before{content:"";position:absolute;inset:0;background:var(--slope);opacity:.9;
  clip-path:polygon(0 72%,38% 52%,62% 58%,100% 30%,100% 100%,0 100%)}
.poster .kick{position:absolute;left:44%;top:46%;width:18%;height:14%;background:var(--slope);
  clip-path:polygon(0 100%,100% 0,100% 100%);opacity:.95}
.poster .tname{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:900;
  font-size:34px;line-height:.95;text-transform:uppercase;color:var(--poster-ink);mix-blend-mode:normal}
.poster .play{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:rgba(15,28,43,.72);color:#fff;border-radius:6px;padding:4px 7px;text-transform:uppercase}
video.clip{display:block;width:100%;max-width:100%;aspect-ratio:16/10;background:#000;object-fit:cover}
.card-foot{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trick{font-weight:700;font-size:15px}
.trick small{font-weight:500;color:var(--muted)}
.pts{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .y{background:var(--good)} .meter .n{background:var(--bad)}
.hint{font-size:12px;color:var(--muted)}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
select,input[type=file]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--surface-2);border-radius:10px;padding:12px 14px}
.preview .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--accent)}
.stamp{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.stamp span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

/* ranks */
.me-card{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.me-card{gap:10px}
.rank-line{display:flex;align-items:center;gap:12px}
.medal.big{width:34px;height:39px}
.rank-name{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:28px 34px 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board li.you{background:var(--accent-soft)}
.board .n{font-family:var(--mono);font-weight:700;color:var(--muted);text-align:right}
.board .score{font-family:var(--mono);font-weight:700;text-align:right}

/* duels */
.letters{display:flex;gap:6px}
.letters b{width:30px;height:34px;display:grid;place-items:center;border-radius:6px;font-family:var(--display);
  font-weight:900;font-size:22px;border:1.5px dashed var(--line);color:var(--line)}
.letters b.hit{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 14px}
.vs .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vs .side.r{align-items:flex-end}
.vs .mid{font-family:var(--display);font-weight:900;font-size:22px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.log li.hot{border-left-color:var(--accent);color:var(--ink)}
.turn{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.turn .what{font-weight:700}
.opp-list{display:flex;flex-direction:column}
.opp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.opp:first-child{border-top:0}
.opp:hover{background:var(--surface-2)}
.opp .odds{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);
  font-size:10px;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;
  max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:.4}}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Send<span>it</span></div>
    <button class="me-chip" data-act="tab" data-tab="ranks" id="me-chip" aria-label="Your rank"></button>
  </header>
  <p class="proto">Prototype with example skiers. Your clips, votes and duels save in this browser only.</p>
  <main id="view"></main>
</div>
<div class="tabs"><nav id="tabs"></nav></div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- catalog ----------
const TRICKS = [
  {id:'180',name:'180',cat:'Park',pts:10},{id:'360',name:'360',cat:'Park',pts:20},
  {id:'540',name:'540',cat:'Park',pts:35},{id:'720',name:'720',cat:'Park',pts:50},
  {id:'misty540',name:'Misty 540',cat:'Park',pts:45},{id:'rodeo540',name:'Rodeo 540',cat:'Park',pts:55},
  {id:'backflip',name:'Backflip',cat:'Park',pts:60},{id:'cork720',name:'Cork 720',cat:'Park',pts:70},
  {id:'dc1080',name:'Double Cork 1080',cat:'Park',pts:120},
  {id:'board',name:'Boardslide',cat:'Rails',pts:15},{id:'lip',name:'Lipslide',cat:'Rails',pts:25},
  {id:'270on',name:'270 On',cat:'Rails',pts:40},{id:'switchup',name:'Switch-Up',cat:'Rails',pts:45},
  {id:'alley360',name:'Alley-Oop 360',cat:'Pipe',pts:45},{id:'flair',name:'Flair',cat:'Pipe',pts:65},
  {id:'spread',name:'Spread Eagle',cat:'Moguls',pts:10},{id:'iron',name:'Iron Cross',cat:'Moguls',pts:15},
  {id:'mog360',name:'Mogul 360',cat:'Moguls',pts:35},
  {id:'cliff15',name:'15 ft Cliff Drop',cat:'Backcountry',pts:40},{id:'bcflip',name:'Backcountry Backflip',cat:'Backcountry',pts:90},
];
const CATS = ['Park','Rails','Pipe','Moguls','Backcountry'];
const GRABS = ['No grab','Mute','Safety','Japan','Tail','Critical'];
const RESORTS = ['Eldora','Winter Park','Copper','Arapahoe Basin','Breckenridge','Keystone'];
const TIERS = [
  {min:1800,name:'Legend',key:'legend',w:2.25},{min:1600,name:'Diamond',key:'diamond',w:2},
  {min:1400,name:'Platinum',key:'plat',w:1.75},{min:1200,name:'Gold',key:'gold',w:1.5},
  {min:1000,name:'Silver',key:'silver',w:1.25},{min:0,name:'Bronze',key:'bronze',w:1},
];
// Trick rank: reach a points total and you rank up. Trick rank also sets how much your votes count.
const TRICK_TIERS = [
  {min:5000,name:'Legend',key:'legend',w:2.25},{min:3500,name:'Diamond',key:'diamond',w:2},
  {min:2000,name:'Platinum',key:'plat',w:1.75},{min:1000,name:'Gold',key:'gold',w:1.5},
  {min:500,name:'Silver',key:'silver',w:1.25},{min:0,name:'Bronze',key:'bronze',w:1},
];
const NEED_WEIGHT = 5, NEED_SHARE = 0.7;
const trickById = id => TRICKS.find(t => t.id === id);
const tierOf = r => TIERS.find(t => r >= t.min);          // duel rank, from rating
const trickTierOf = p => TRICK_TIERS.find(t => p >= t.min); // trick rank, from points
const points = (trickId, grab) => Math.round(trickById(trickId).pts * (grab && grab !== 'No grab' ? 1.2 : 1));

// ---------- seed data ----------
const min = m => Date.now() - m * 60000;
function seed(){
  return {
    tab:'feed', board:'rating',
    users:{
      you:  {name:'You',       home:'Eldora',        rating:1150, xp:380},
      tess: {name:'Tess L.',   home:'Breckenridge',  rating:1630, xp:3900},
      maya: {name:'Maya R.',   home:'Eldora',        rating:1480, xp:2350},
      jordan:{name:'Jordan K.',home:'Winter Park',   rating:1320, xp:1600},
      sam:  {name:'Sam T.',    home:'Copper',        rating:1210, xp:980},
      priya:{name:'Priya N.',  home:'Arapahoe Basin',rating:1045, xp:540},
      eli:  {name:'Eli W.',    home:'Eldora',        rating:960,  xp:300},
    },
    clips:[
      {id:'c1',user:'maya',trick:'cork720',grab:'Safety',resort:'Eldora',ts:min(38),status:'pending',
        votes:[{u:'tess',y:true},{u:'sam',y:true}]},
      {id:'c2',user:'eli',trick:'360',grab:'Mute',resort:'Eldora',ts:min(55),status:'pending',
        votes:[{u:'priya',y:true},{u:'jordan',y:false}]},
      {id:'c3',user:'jordan',trick:'270on',grab:'No grab',resort:'Winter Park',ts:min(80),status:'pending',
        votes:[{u:'maya',y:true}]},
      {id:'c4',user:'priya',trick:'mog360',grab:'No grab',resort:'Arapahoe Basin',ts:min(120),status:'pending',votes:[]},
      {id:'c5',user:'tess',trick:'dc1080',grab:'Japan',resort:'Breckenridge',ts:min(190),status:'verified',
        votes:[{u:'maya',y:true},{u:'jordan',y:true},{u:'sam',y:true},{u:'priya',y:true}]},
      {id:'c6',user:'sam',trick:'backflip',grab:'No grab',resort:'Copper',ts:min(300),status:'rejected',
        votes:[{u:'tess',y:false},{u:'maya',y:false},{u:'jordan',y:true},{u:'eli',y:true}]},
      {id:'c7',user:'maya',trick:'switchup',grab:'No grab',resort:'Eldora',ts:min(420),status:'verified',
        votes:[{u:'tess',y:true},{u:'jordan',y:true},{u:'sam',y:true},{u:'eli',y:true}]},
    ],
    duels:[],
    seq:100,
  };
}

// ---------- state + storage ----------
const KEY = 'sendit-proto-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { S = seed(); }
const videoUrls = {}; // blob URLs live only for this session
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n === 'You' ? 'YOU' : n.split(/\s+/).map(p => p[0]).join('').slice(0,2).toUpperCase();
const sym = key => `<span class="sym medal m-${key}"></span>`;
const tierTag = t => `<span class="tier">${sym(t.key)}${t.name}</span>`;
function ago(ts){
  const m = Math.max(1, Math.round((Date.now() - ts) / 60000));
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60); return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}
function weigh(clip){
  let y = 0, n = 0;
  for (const v of clip.votes){ const w = trickTierOf(S.users[v.u].xp).w; v.y ? y += w : n += w; }
  return {y, n, total: y + n};
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- verification ----------
function resolve(clip){
  if (clip.status !== 'pending') return;
  const {y, total} = weigh(clip);
  if (total < NEED_WEIGHT) return;
  const owner = S.users[clip.user], pts = points(clip.trick, clip.grab);
  if (y / total >= NEED_SHARE){
    const before = trickTierOf(owner.xp);
    clip.status = 'verified'; owner.xp += pts;
    const after = trickTierOf(owner.xp);
    if (clip.user === 'you') toast(after !== before
      ? `Rank up! You reached ${after.name} trick rank`
      : `Verified! ${trickById(clip.trick).name} earned +${pts} points`);
  } else {
    clip.status = 'rejected';
    if (clip.user === 'you') toast(`The community didn't verify your ${trickById(clip.trick).name}`);
  }
}
function addOtherVote(clip, landedOdds){
  const voted = new Set(clip.votes.map(v => v.u));
  const pool = Object.keys(S.users).filter(u => u !== 'you' && u !== clip.user && !voted.has(u));
  if (!pool.length) return false;
  clip.votes.push({u: pick(pool), y: Math.random() < landedOdds});
  resolve(clip); return true;
}
// Simulate other skiers judging your pending clips
setInterval(() => {
  const mine = S.clips.filter(c => c.user === 'you' && c.status === 'pending');
  if (!mine.length) return;
  mine.forEach(c => addOtherVote(c, 0.85));
  save();
  // Don't interrupt a clip that's playing
  if ([...document.querySelectorAll('video')].some(v => !v.paused)) return;
  render();
}, 2200);

// ---------- views ----------
function clipCard(c, {judge = false} = {}){
  const u = S.users[c.user], t = trickById(c.trick), pts = points(c.trick, c.grab);
  const {y, n, total} = weigh(c);
  const media = videoUrls[c.id]
    ? `<video class="clip" src="${videoUrls[c.id]}" controls playsinline muted></video>`
    : `<div class="poster" role="img" aria-label="${esc(t.name)} clip"><div class="kick"></div>
         <span class="play">${c.hasVideo ? 'Video not kept after reload' : 'Example clip'}</span>
         <div class="tname">${esc(t.name)}</div></div>`;
  let status;
  if (c.status === 'verified') status = '<span class="pill ok">Verified</span>';
  else if (c.status === 'rejected') status = '<span class="pill no">Not verified</span>';
  else status = `<span class="pill wait">Judging ${total.toFixed(1)} / ${NEED_WEIGHT}</span>`;
  const scale = Math.max(total, NEED_WEIGHT);
  const meter = `<div class="meter" aria-hidden="true"><i class="y" style="width:${y/scale*100}%"></i><i class="n" style="width:${n/scale*100}%"></i></div>`;
  return `<article class="card">
    <div class="card-head">
      <div class="avatar ${c.user==='you'?'you':''}">${initials(u.name)}</div>
      <div class="who"><div class="name">${esc(u.name)} ${sym(trickTierOf(u.xp).key)}</div>
        <div class="meta">${esc(c.resort)} · ${ago(c.ts)}</div></div>
      ${status}
    </div>
    ${media}
    <div class="card-foot">
      <div class="row"><div class="trick">${esc(t.name)} <small>· ${esc(c.grab)} · ${t.cat}</small></div>
        <div class="pts">+${pts} pts</div></div>
      ${meter}
      ${judge ? `<div class="btns">
          <button class="btn bad" data-act="vote" data-id="${c.id}" data-y="0">Not landed</button>
          <button class="btn good" data-act="vote" data-id="${c.id}" data-y="1">Landed</button></div>` : ''}
    </div>
  </article>`;
}

const views = {
  feed(){
    const clips = [...S.clips].sort((a,b) => b.ts - a.ts);
    return `<h2>Feed</h2><p class="sub">Clips from skiers near you. A trick only earns points after the community verifies it.</p>
      <div class="stack">${clips.map(c => clipCard(c)).join('')}</div>`;
  },
  judge(){
    const me = trickTierOf(S.users.you.xp);
    const q = S.clips.filter(c => c.status === 'pending' && c.user !== 'you' && !c.votes.some(v => v.u === 'you'));
    return `<h2>Judge clips</h2>
      <p class="sub">Your vote counts ×${me.w} at ${me.name} trick rank. A clip is verified once it has ${NEED_WEIGHT} vote-weight and ${NEED_SHARE*100}% say landed.
      Later, an AI pre-check could flag reused or downloaded clips before they reach this queue.</p>
      <div class="stack">${q.length ? q.map(c => clipCard(c, {judge:true})).join('')
        : `<div class="card empty"><strong>All caught up</strong>No clips are waiting for your vote. Post one of your own.</div>`}</div>`;
  },
  post(){
    return `<h2>Post a trick</h2><p class="sub">Pick the trick you landed. Other skiers will judge it.</p>
    <form class="card form" id="post-form">
      <div class="field"><label class="label" for="post-video">Clip</label>
        <input type="file" id="post-video" accept="video/*">
        <span class="hint">Optional in this prototype. The real app records in-app so every clip is new.</span></div>
      <div class="two">
        <div class="field"><label class="label" for="post-cat">Category</label>
          <select id="post-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="post-grab">Grab</label>
          <select id="post-grab">${GRABS.map(g => `<option>${g}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label class="label" for="post-trick">Trick</label><select id="post-trick"></select></div>
      <div class="field"><label class="label" for="post-resort">Resort</label>
        <select id="post-resort">${RESORTS.map(r => `<option>${r}</option>`).join('')}</select></div>
      <div class="preview"><div><div class="label">Worth</div><span class="hint">A grab adds 20%</span></div>
        <div><span class="big" id="post-pts">0</span> <span class="label">pts</span></div></div>
      <div class="stamp"><span>Time stamp ✓</span><span>GPS at resort ✓</span><span>Recorded in-app ✓</span></div>
      <button class="btn primary" type="submit">Post for judging</button>
    </form>`;
  },
  duels(){
    const active = S.duels.find(d => d.phase !== 'done');
    const done = S.duels.filter(d => d.phase === 'done').slice(-4).reverse();
    let html = `<h2>Game of S.K.I.</h2><p class="sub">Land a trick and your opponent has to match it. Miss a match and you take a letter. Spell S-K-I and you lose rating.
      In the real app each attempt is a clip, and opponents get 72 hours per turn.</p>`;
    html += active ? duelCard(active) : newDuel();
    if (done.length) html += `<div class="label" style="margin-block:20px 8px">Recent duels</div>
      <div class="card"><ul class="board">${done.map(d => {
        const o = S.users[d.opp], won = d.result === 'win';
        return `<li><span class="n">${won?'W':'L'}</span><div class="avatar">${initials(o.name)}</div>
          <div><b>${esc(o.name)}</b><div class="hint">${won?'You won':'You lost'} ${d.them}–${d.you} in letters</div></div>
          <span class="score" style="color:var(--${won?'good':'bad'})">${d.delta>0?'+':''}${d.delta}</span></li>`;}).join('')}</ul></div>`;
    return html;
  },
  ranks(){
    const me = S.users.you;
    const verified = S.clips.filter(c => c.user==='you' && c.status==='verified').length;
    const done = S.duels.filter(d => d.phase === 'done'), wins = done.filter(d => d.result === 'win').length;
    const key = S.board === 'rating' ? 'rating' : 'xp';
    const tierFn = key === 'xp' ? trickTierOf : tierOf, unit = key === 'xp' ? 'pts' : '';
    const list = Object.entries(S.users).sort((a,b) => b[1][key] - a[1][key]);
    return `<h2>Ranks</h2><p class="sub">You have two ranks. Every verified trick adds points, and reaching a points total ranks you up.
      Duel rank comes from Game of S.K.I. and goes up or down with every duel.</p>
    <div class="stack">
      ${rankCard('Trick rank', me.xp, TRICK_TIERS, 'pts', `${verified} verified trick${verified===1?'':'s'}`)}
      ${rankCard('Duel rank', me.rating, TIERS, 'rating', `${wins}W · ${done.length - wins}L`)}
    </div>
    <div class="row" style="margin-block:20px 10px">
      <div class="label">Leaderboard · Front Range</div>
      <div class="seg" role="tablist">
        <button class="${key==='xp'?'on':''}" data-act="board" data-k="xp">Tricks</button>
        <button class="${key==='rating'?'on':''}" data-act="board" data-k="rating">Duels</button></div>
    </div>
    <div class="card"><ol class="board">${list.map(([id,u],i) => `
      <li class="${id==='you'?'you':''}"><span class="n">${i+1}</span>
        <div class="avatar ${id==='you'?'you':''}">${initials(u.name)}</div>
        <div><b>${esc(u.name)}</b><div class="hint">${tierTag(tierFn(u[key]))} · ${esc(u.home)}</div></div>
        <span class="score">${u[key]} <small class="hint">${unit}</small></span></li>`).join('')}</ol></div>
    <p style="margin-top:18px"><button class="linkish" data-act="reset">Reset prototype data</button></p>`;
  },
};

function rankCard(title, val, table, unit, extra){
  const t = table.find(x => val >= x.min), i = table.indexOf(t), next = i > 0 ? table[i-1] : null;
  const pct = next ? (val - t.min) / (next.min - t.min) * 100 : 100;
  return `<section class="card me-card">
    <div class="row"><div class="label">${title}</div><span class="hint">${extra}</span></div>
    <div class="rank-line"><span class="sym medal big m-${t.key}"></span>
      <div><div class="rank-name">${t.name}</div><div class="mono hint">${val} ${unit}</div></div></div>
    <div class="bar"><i style="width:${Math.max(3,pct)}%"></i></div>
    <div class="hint">${next ? `${next.min - val} ${unit} to ${next.name}` : 'Top rank'}</div>
  </section>`;
}

// ---------- duels ----------
const expected = (a, b) => 1 / (1 + Math.pow(10, (b - a) / 400));
function newDuel(){
  const me = S.users.you.rating;
  const opps = Object.entries(S.users).filter(([id]) => id !== 'you').sort((a,b) => b[1].rating - a[1].rating);
  return `<div class="card"><div class="card-head"><div class="who"><div class="name">Challenge a skier</div>
    <div class="meta">Win chance uses the chess ELO formula</div></div></div>
    <div class="opp-list">${opps.map(([id,u]) => `<button class="opp" data-act="challenge" data-id="${id}">
      <div class="avatar">${initials(u.name)}</div>
      <div><b>${esc(u.name)}</b><div class="hint">${tierTag(tierOf(u.rating))} · <span class="mono">${u.rating}</span></div></div>
      <div class="odds">${Math.round(expected(me,u.rating)*100)}% win</div></button>`).join('')}</div></div>`;
}
const lettersHtml = n => `<div class="letters">${['S','K','I'].map((l,i) => `<b class="${i<n?'hit':''}">${l}</b>`).join('')}</div>`;
function trickOptions(){
  return CATS.map(c => `<optgroup label="${c}">${TRICKS.filter(t=>t.cat===c).map(t=>`<option value="${t.id}">${t.name} (${t.pts})</option>`).join('')}</optgroup>`).join('');
}
function duelCard(d){
  const o = S.users[d.opp];
  let turn = '';
  if (d.phase === 'set') turn = `<div class="what">Your turn to set a trick</div>
    <select id="duel-trick" aria-label="Trick to set">${trickOptions()}</select>
    <div class="btns"><button class="btn" data-act="set" data-y="0">I bailed</button>
      <button class="btn primary" data-act="set" data-y="1">I landed it</button></div>
    <span class="hint">If you land it, ${esc(o.name)} has to match it.</span>`;
  else if (d.phase === 'oppset') turn = `<div class="what">${esc(o.name)} is setting a trick</div>
    <button class="btn primary" data-act="oppset">See their attempt</button>`;
  else if (d.phase === 'match') turn = `<div class="what">Match ${esc(o.name)}'s ${esc(trickById(d.trick).name)}</div>
    <div class="btns"><button class="btn bad" data-act="match" data-y="0">I missed</button>
      <button class="btn good" data-act="match" data-y="1">I matched it</button></div>`;
  return `<div class="card">
    <div class="vs">
      <div class="side"><b>You</b>${lettersHtml(d.you)}</div>
      <div class="mid">VS</div>
      <div class="side r"><b>${esc(o.name)}</b>${lettersHtml(d.them)}</div>
    </div>
    <ul class="log">${d.log.slice(-5).map((l,i,a) => `<li class="${i===a.length-1?'hot':''}">${esc(l)}</li>`).join('')}</ul>
    <div class="turn">${turn}</div></div>`;
}
function oppOdds(u, t){ return Math.min(.95, Math.max(.08, .92 - t.pts/160 + (u.rating-1200)/900)); }
function finish(d){
  if (d.you < 3 && d.them < 3) return false;
  const me = S.users.you, o = S.users[d.opp], won = d.them >= 3;
  const delta = Math.round(32 * ((won?1:0) - expected(me.rating, o.rating)));
  me.rating += delta; o.rating -= delta;
  Object.assign(d, {phase:'done', result: won?'win':'loss', delta});
  d.log.push(won ? `${o.name} spelled S-K-I. You win!` : `You spelled S-K-I. ${o.name} wins.`);
  toast(`${won?'You won':'You lost'}: rating ${delta>0?'+':''}${delta} → ${me.rating}`);
  return true;
}
const duelActs = {
  challenge(id){
    S.duels.push({id:'d'+(S.seq++), opp:id, you:0, them:0, phase:'set', trick:null,
      log:[`You challenged ${S.users[id].name}. You set first.`]});
  },
  set(_, y, d){
    const t = trickById(document.getElementById('duel-trick').value), o = S.users[d.opp];
    if (!y){ d.log.push(`You bailed your ${t.name}. ${o.name} sets next.`); d.phase = 'oppset'; return; }
    if (Math.random() < oppOdds(o, t)) d.log.push(`You landed a ${t.name}, and ${o.name} matched it. Set again.`);
    else { d.them++; d.log.push(`You landed a ${t.name}. ${o.name} missed and takes a letter.`); finish(d); }
  },
  oppset(_, __, d){
    const o = S.users[d.opp], cap = 30 + (o.rating - 900) / 6;
    const t = pick(TRICKS.filter(x => x.pts <= cap));
    if (Math.random() < oppOdds(o, t) + .05){ d.trick = t.id; d.phase = 'match'; d.log.push(`${o.name} landed a ${t.name}. Your turn to match.`); }
    else { d.phase = 'set'; d.log.push(`${o.name} bailed a ${t.name}. You set next.`); }
  },
  match(_, y, d){
    const o = S.users[d.opp], t = trickById(d.trick);
    if (y) d.log.push(`You matched the ${t.name}.`);
    else { d.you++; d.log.push(`You missed the ${t.name} and take a letter.`); }
    if (!finish(d)) d.phase = 'oppset';
  },
};

// ---------- post form ----------
function syncPost(){
  const cat = document.getElementById('post-cat'); if (!cat) return;
  const sel = document.getElementById('post-trick'), prev = sel.value;
  sel.innerHTML = TRICKS.filter(t => t.cat === cat.value).map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  document.getElementById('post-pts').textContent = points(sel.value, document.getElementById('post-grab').value);
}

// ---------- render ----------
const TABS = [
  ['feed','Feed','<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ['judge','Judge','<path d="M5 12l4 4L19 6"/>'],
  ['post','Post','<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'],
  ['duels','Duels','<path d="M5 19L19 5M14 5h5v5M5 5l5 5M14 14l5 5"/>'],
  ['ranks','Ranks','<path d="M4 20h16M7 20V11M12 20V5M17 20v-6"/>'],
];
function render(){
  const focusId = document.activeElement && document.activeElement.id;
  const keep = {}; ['post-cat','post-grab','post-trick','post-resort','duel-trick'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  const me = S.users.you;
  document.getElementById('me-chip').innerHTML =
    `${sym(trickTierOf(me.xp).key)}<b>${me.xp}</b><span class="hint">·</span>${sym(tierOf(me.rating).key)}<b>${me.rating}</b>`;
  const judgeCount = S.clips.filter(c => c.status==='pending' && c.user!=='you' && !c.votes.some(v=>v.u==='you')).length;
  document.getElementById('tabs').innerHTML = TABS.map(([id,label,icon]) =>
    `<button class="${S.tab===id?'on':''}" data-act="tab" data-tab="${id}" aria-label="${label}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}
      ${id==='judge' && judgeCount ? `<span class="badge">${judgeCount}</span>` : ''}</button>`).join('');
  // Don't rebuild the post form while the user is filling it in
  if (S.tab === 'post' && document.getElementById('post-form')) return;
  document.getElementById('view').innerHTML = views[S.tab]();
  for (const [id,v] of Object.entries(keep)){ const el = document.getElementById(id); if (el) el.value = v; }
  syncPost();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus(); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, y = b.dataset.y === '1';
  if (act === 'tab'){ S.tab = b.dataset.tab; save(); document.getElementById('view').innerHTML = ''; render(); window.scrollTo(0,0); return; }
  if (act === 'board'){ S.board = b.dataset.k; }
  else if (act === 'vote'){
    const c = S.clips.find(x => x.id === b.dataset.id);
    c.votes.push({u:'you', y}); resolve(c);
    addOtherVote(c, .75);
    toast(y ? 'Voted landed' : 'Voted not landed');
  }
  else if (act === 'reset'){ S = seed(); for (const k in videoUrls) delete videoUrls[k]; toast('Prototype data reset'); }
  else if (act in duelActs){
    const d = S.duels.find(x => x.phase !== 'done');
    duelActs[act](b.dataset.id, y, d);
  }
  save(); render();
});
document.addEventListener('change', e => {
  if (['post-cat','post-trick','post-grab'].includes(e.target.id)) syncPost();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'post-form') return;
  e.preventDefault();
  const f = id => document.getElementById(id);
  const id = 'c' + (S.seq++), file = f('post-video').files[0];
  if (file) videoUrls[id] = URL.createObjectURL(file);
  S.clips.push({id, user:'you', trick:f('post-trick').value, grab:f('post-grab').value, resort:f('post-resort').value,
    ts:Date.now(), status:'pending', votes:[], hasVideo:!!file});
  S.tab = 'feed'; save(); document.getElementById('view').innerHTML = ''; render(); window.scrollTo(0,0);
  toast('Posted. Skiers are judging it now.');
});

render();
</script>
